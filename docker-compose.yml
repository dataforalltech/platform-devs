    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "mcp=qa-engineer-mcp"
      - "type=devteam"

  security-mcp:
    build:
      context: .
      dockerfile: ./security-mcp-server/Dockerfile
    ports:
      - "27125:7100"
    environment:
      NODE_ENV: production
      PORT: 7100
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "mcp=security-mcp"
      - "type=devteam"

  # ============================================================================
  # MCP Gateway / Registry (Optional - discovers all MCPs)
  # ============================================================================

  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    ports:
      - "28080:8080"
    environment:
      PORT: 8080
    depends_on:
      - redis
      - postgres
      - dev-twin-mcp
      - config-mcp
      - session-mcp
      - audit-mcp
      - deploy-mcp
      - docs-mcp
      - infra-mcp
      - pipeline-mcp
      - qa-mcp
      - services-mcp
      - test-mcp
      - ai-governance-mcp
      - qa-engineer-mcp
      - backend-mcp
      - architecture-mcp
      - security-mcp
      - devops-mcp
      - product-manager-mcp
      - frontend-mcp
      - product-owner-mcp
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "service=mcp-gateway"
      - "type=gateway"

  mcp-registry:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./mcp-registry.py:/app/mcp-registry.py
    command: bash -c "pip install fastapi uvicorn aiohttp && python mcp-registry.py"
    ports:
      - "28000:8000"
    environment:
      PORT: 8000
    depends_on:
      - config-mcp
      - dev-twin-mcp
      - architecture-mcp
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "service=mcp-registry"
      - "type=gateway"

  # ============================================================================
  # Infrastructure Services (Redis + PostgreSQL for gateway)
  # ============================================================================

  redis:
    image: redis:7-alpine
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "service=redis"
      - "type=infrastructure"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "service=postgres"
      - "type=infrastructure"

networks:
  mcp-network:
    driver: bridge

# ============================================================================
# Volume Definitions (for persistence if needed)
# ============================================================================
volumes:
  config-data:
  session-data:
  auth-data:
  postgres-data:
