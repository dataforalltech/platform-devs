  # ============================================================================
  # DevTeam MCPs (Node.js - já vêm em Docker)
  # ============================================================================

  architecture-mcp:
    build:
      context: .
      dockerfile: ./architecture-mcp-server/Dockerfile
    ports:
      - "27118:7100"
    environment:
      NODE_ENV: production
      PORT: 7100
    networks:
      - mcp-network
    restart: unless-stopped
    labels:
      - "mcp=architecture-mcp"
      - "type=devteam"
      - "language=nodejs"

  backend-mcp:
    build:
      context: .
      dockerfile: ./backend-mcp-server/Dockerfile
    ports:
      - "27119:7100"
    environment:
