[project]
name = "services-mcp"
version = "0.1.0"
description = "MCP sidecar (kind=mcp_http, Model C) do services — registry/monitoramento de serviços da plataforma dataforalltech, gateway-ready."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dataforalltech platform team" }]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0,<1.0",
    "psutil>=5.9.0,<7.0",
    "psycopg2-binary>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # requerido pelo fastapi.testclient
    "ruff==0.15.12",
    "black>=24.0",
    "mypy==2.2.0",
]

[project.scripts]
services-mcp = "src.server.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# Desvios justificados p/ um sidecar stateful (services persiste em PostgreSQL e
# roda docker/psutil/subprocess p/ descoberta) — diferente da persona compute-only:
#   S104 — bind 0.0.0.0: ingress só via gateway (INV-1), justificado no código.
#   S603/S607 — subprocess de comandos fixos (docker ps, restart) sem shell.
#   S608 — SQL "dinâmico" só concatena fragmentos estáticos; valores via %s (parametrizado).
#   S110/S112 — try/except/pass|continue best-effort na descoberta/health (falha não derruba o server).
#   S310 — urllib.urlopen em probes de health/reload contra URLs internas do registry (não input do usuário).
ignore = ["S104", "S603", "S607", "S608", "S110", "S112", "S310"]

[tool.ruff.lint.per-file-ignores]
# S101 assert em testes; S105/S106 tokens/senhas fake em test doubles (sem I/O real);
# S108 uso de /tmp-like paths fake nos testes.
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/**/__init__.py"]
