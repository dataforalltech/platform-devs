# platform-dev-agent — MCP server (Modo B) para Claude Code Desktop.
#   docker compose up -d --build
#   claude mcp add --transport http platform-dev-agent http://localhost:7130/mcp
#
# Por padrão usa o gateway-demo in-process (loop completo sem token/LLM). Para
# apontar no gateway REAL, descomente o bloco DEV_GATEWAY_* abaixo.
services:
  platform-dev-agent-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: platform-dev-agent-mcp:local
    container_name: platform-dev-agent-mcp
    ports:
      - "7130:7130"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "7130"
      # Gateway REAL: `cp .env.example .env`, ponha o PAT (d4all_pat_...) e `docker compose up -d`.
      # Sem .env (valores vazios), o agente cai no gateway-demo in-process.
      DEV_GATEWAY_URL: "${DEV_GATEWAY_URL:-}"
      DEV_TENANT_ID: "${DEV_TENANT_ID:-PLATFORM_DEV_30}"
      DEV_GATEWAY_TOKEN: "${DEV_GATEWAY_TOKEN:-}"
    extra_hosts:
      # permite DEV_GATEWAY_URL apontar para o platform-mcp rodando no host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
