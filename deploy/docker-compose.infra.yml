# =============================================================================
# docker-compose.infra.yml — INFRAESTRUTURA local da plataforma DataForAll
#
# Reconciliado com a infra canônica que já roda (projeto dataforall-infra):
#   admin-mysql (:53306) + tenant-mysql (:3306) + tenant-postgres (:5432)
#   + kafka (apache/kafka, :9095) + redis (:6379) + grafana (:3000)
# e ACRESCENTA o que faltava para a arquitetura: Vault + Prometheus + OTel + Tempo.
#
# Todas as variáveis preenchidas — SÓ senhas/tokens vêm de .env (.env.infra.example).
# Rede compartilhada `platform-local` (convenção da plataforma):
#
#   docker network create platform-local        # uma vez
#   docker compose -f docker-compose.infra.yml --env-file .env up -d
# =============================================================================

name: dataforall-infra

networks:
  platform-local:
    external: true          # docker network create platform-local

volumes:
  admin-mysql-data:
  tenant-mysql-data:
  tenant-postgres-data:
  redis-data:
  kafka-data:
  vault-data:
  prometheus-data:
  grafana-data:
  tempo-data:

services:
  # ── MySQL admin — ADMIN_DATAFORALL (registry de tenants / gateway) ──────────
  admin-mysql:
    image: mysql:8.4
    container_name: dataforall-admin-mysql
    restart: unless-stopped
    command: ["--default-authentication-plugin=caching_sha2_password", "--max-connections=500"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      MYSQL_DATABASE: ADMIN_DATAFORALL
      TZ: UTC
    ports:
      - "53306:3306"
    volumes:
      - admin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [platform-local]

  # ── MySQL tenant — bancos por tenant (plano multi-tenant) ──────────────────
  tenant-mysql:
    image: mysql:8.4
    container_name: dataforall-tenant-mysql
    restart: unless-stopped
    command: ["--default-authentication-plugin=caching_sha2_password", "--max-connections=500"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - tenant-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [platform-local]

  # ── PostgreSQL tenant — serviços novos/analíticos (regra polyglot D2) ──────
  tenant-postgres:
    image: postgres:16
    container_name: dataforall-tenant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env}
      POSTGRES_DB: platform
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [platform-local]

  # ── Redis — rate-limit + JTI blocklist ─────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: dataforall-redis
    restart: unless-stopped
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina em .env}",
       "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [platform-local]

  # ── Kafka (apache/kafka, KRaft) — igual ao que já roda ─────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: dataforall-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: UTC
    ports:
      - "9095:9095"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [platform-local]

  # ── HashiCorp Vault — entrega de segredos (D5) ─────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: dataforall-vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?defina em .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      TZ: UTC
    command: ["vault", "server", "-dev"]
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    networks: [platform-local]

  # ── Observabilidade ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dataforall-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [platform-local]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: dataforall-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [platform-local]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: dataforall-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on: [tempo]
    networks: [platform-local]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dataforall-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina em .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: UTC
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]
    networks: [platform-local]
