# =============================================================================
# docker-compose.infra.yml — INFRAESTRUTURA da plataforma DataForAll
#
# Sobe tudo que os serviços dependem: bancos (MySQL + Postgres), Redis, Kafka,
# Vault e o stack de observabilidade (Prometheus, Grafana, OTel, Tempo).
#
# Todas as variáveis estão preenchidas — SÓ as SENHAS/TOKENS vêm de ambiente
# (defina em .env ao lado, ver deploy/.env.infra.example). Uso:
#
#   docker network create platform            # uma vez (rede compartilhada)
#   docker compose -f docker-compose.infra.yml up -d
#
# Depois suba os serviços: docker compose -f docker-compose.services.yml up -d
# =============================================================================

name: dataforall-infra

networks:
  platform:
    external: true          # criada uma vez: docker network create platform

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  kafka-data:
  vault-data:
  prometheus-data:
  grafana-data:
  tempo-data:

services:
  # ── MySQL 8 — plano multi-tenant (ADMIN_DATAFORALL + bancos de tenant) ──────
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--max-connections=500"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      MYSQL_DATABASE: ADMIN_DATAFORALL
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [platform]

  # ── PostgreSQL 16 — serviços novos / analíticos ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env}
      POSTGRES_DB: platform
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [platform]

  # ── Redis 7 — rate-limit + JTI blocklist ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?defina em .env}"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [platform]

  # ── Kafka 3.7 (KRaft, sem Zookeeper) — mensageria ──────────────────────────
  # Listener interno PLAINTEXT (rede platform) + externo no host (9094).
  # PROD: trocar para SASL_SSL e RF>=3 (ver docker-compose.data.yml).
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: UTC
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 45s
    networks: [platform]

  # ── HashiCorp Vault — entrega de segredos (D5) ─────────────────────────────
  # Modo server single-node com storage em arquivo. O token de bootstrap vem de
  # env (VAULT_ROOT_TOKEN). PROD: HA + auto-unseal (KMS) + auth AWS/IAM.
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?defina em .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      TZ: UTC
    command: ["vault", "server", "-dev"]
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [platform]

  # ── Observabilidade ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [platform]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks: [platform]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on: [tempo]
    networks: [platform]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina em .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: UTC
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus, tempo]
    networks: [platform]
