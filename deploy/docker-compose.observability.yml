# =============================================================================
# docker-compose.observability.yml — OBSERVABILIDADE (stack Swarm)
#
# Prometheus (métricas) + Grafana (dashboards) + OTel Collector + Tempo (traces).
# Roda no cluster para descobrir os serviços pela overlay `platform`.
#
#   docker stack deploy -c deploy/docker-compose.observability.yml observability
#
# Pré-requisitos:
#   • rede overlay `platform` já criada (external)
#   • um nó rotulado para fixar os volumes:  docker node update --label-add obs=true <nó>
#   • Prometheus roda num MANAGER (usa a API do Swarm p/ service discovery)
#   • GRAFANA_ADMIN_PASSWORD exportado (via Vault) antes do deploy
# =============================================================================

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    networks: [platform]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prom-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro   # dockerswarm SD
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager          # SD do Swarm exige manager
          - node.labels.obs == true

  tempo:
    image: grafana/tempo:2.5.0
    networks: [platform]
    command: ["-config.file=/etc/tempo.yaml"]
    configs:
      - source: tempo_yml
        target: /etc/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.obs == true]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    networks: [platform]
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel_yml
        target: /etc/otelcol/config.yaml
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.obs == true]

  grafana:
    image: grafana/grafana:11.1.0
    networks: [platform]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina via Vault}
      GF_AUTH_ANONYMOUS_ENABLED: "false"      # sem anonymous (SEC)
      GF_SERVER_ROOT_URL: https://grafana.dataforall.internal
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.obs == true]

configs:
  prometheus_yml:
    file: ./config/prometheus.yml
  tempo_yml:
    file: ./config/tempo.yaml
  otel_yml:
    file: ./config/otel-collector.yaml

networks:
  platform:
    external: true

volumes:
  prom-data:
  tempo-data:
  grafana-data:
