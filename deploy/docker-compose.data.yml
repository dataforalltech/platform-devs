# =============================================================================
# docker-compose.data.yml — DATA TIER de produção (D1)
#
# Stateful FORA do Swarm: roda como `docker compose` numa EC2 de DADOS dedicada,
# com volume em EBS gp3 dedicado, TLS obrigatório e exporters para o Prometheus.
# Cada store tem seu profile — suba só o que roda naquele host:
#
#   docker compose -f docker-compose.data.yml --profile mysql   up -d
#   docker compose -f docker-compose.data.yml --profile postgres up -d
#   docker compose -f docker-compose.data.yml --profile redis    up -d
#   docker compose -f docker-compose.data.yml --profile kafka    up -d
#
# SEGURANÇA (obrigatório):
#   • As senhas vêm do Vault — exporte antes de subir, nunca comite:
#       export MYSQL_ROOT_PASSWORD=$(vault kv get -field=value kv/dataforall/data/mysql_root)
#   • DATA_BIND_IP = IP PRIVADO da EC2 (nunca 0.0.0.0). O Security Group deve
#     permitir a porta APENAS a partir do SG do app tier.
#   • TLS: monte os certificados em ./certs e aponte as vars *_TLS_* (ver notas).
#   • Snapshots EBS (DLM) + dump lógico para S3 = responsabilidade do host (§5).
# =============================================================================

name: dataforall-data

x-restart: &restart
  restart: unless-stopped

services:
  # ── MySQL 8 — plano multi-tenant (ADMIN_DATAFORALL + bancos de tenant) ──────
  mysql:
    <<: *restart
    image: mysql:8.0
    profiles: [mysql]
    command:
      - "--require_secure_transport=ON"          # TLS obrigatório (NETW-001)
      - "--default-authentication-plugin=caching_sha2_password"
      - "--max-connections=500"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina via Vault}
      MYSQL_DATABASE: ADMIN_DATAFORALL
      TZ: UTC
    ports:
      - "${DATA_BIND_IP:?IP privado da EC2}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql               # volume em EBS gp3 dedicado
      - ./certs/mysql:/etc/mysql/certs:ro       # ca.pem, server-cert.pem, server-key.pem
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysqld-exporter:
    <<: *restart
    image: prom/mysqld-exporter:v0.15.1
    profiles: [mysql]
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=root"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    ports:
      - "${DATA_BIND_IP}:9104:9104"             # Prometheus raspa aqui
    depends_on: [mysql]

  # ── PostgreSQL 16 — serviços novos / analíticos ────────────────────────────
  postgres:
    <<: *restart
    image: postgres:16-alpine
    profiles: [postgres]
    command:
      - "postgres"
      - "-c"
      - "ssl=on"                                # TLS (monte certs abaixo)
      - "-c"
      - "ssl_cert_file=/etc/pg/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/pg/certs/server.key"
      - "-c"
      - "max_connections=400"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina via Vault}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      TZ: UTC
    ports:
      - "${DATA_BIND_IP:?IP privado da EC2}:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./certs/postgres:/etc/pg/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres-exporter:
    <<: *restart
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}?sslmode=require"
    ports:
      - "${DATA_BIND_IP}:9187:9187"
    depends_on: [postgres]

  # ── Redis 7 — rate-limit + JTI blocklist ───────────────────────────────────
  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: [redis]
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina via Vault}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${DATA_BIND_IP:?IP privado da EC2}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # PROD: habilitar TLS (--tls-port 6380 + certs) ou terminar TLS num sidecar.

  redis-exporter:
    <<: *restart
    image: oliver006/redis_exporter:v1.62.0
    profiles: [redis]
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    ports:
      - "${DATA_BIND_IP}:9121:9121"
    depends_on: [redis]

  # ── Kafka 3.7 (KRaft) — mensageria opcional ────────────────────────────────
  # PROD: RF≥3 exige ≥3 brokers (um por host). Este arquivo sobe 1 broker por
  # host; ajuste NODE_ID / QUORUM_VOTERS e use SASL_SSL entre os brokers.
  kafka:
    <<: *restart
    image: bitnami/kafka:3.7
    profiles: [kafka]
    environment:
      KAFKA_CFG_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: ${KAFKA_QUORUM_VOTERS:-1@kafka:9093}
      KAFKA_CFG_LISTENERS: SASL_SSL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: SASL_SSL://${KAFKA_ADVERTISED_HOST:?host privado}:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: ${KAFKA_RF:-3}
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 2
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CLIENT_USERS: ${KAFKA_USER:?}
      KAFKA_CLIENT_PASSWORDS: ${KAFKA_PASSWORD:?defina via Vault}
    ports:
      - "${DATA_BIND_IP:?IP privado da EC2}:9094:9094"
    volumes:
      - kafka-data:/bitnami/kafka
      - ./certs/kafka:/opt/bitnami/kafka/config/certs:ro

  kafka-exporter:
    <<: *restart
    image: danielqsj/kafka-exporter:v1.7.0
    profiles: [kafka]
    command: ["--kafka.server=kafka:9094"]
    ports:
      - "${DATA_BIND_IP}:9308:9308"
    depends_on: [kafka]

volumes:
  mysql-data:
  pg-data:
  redis-data:
  kafka-data:
