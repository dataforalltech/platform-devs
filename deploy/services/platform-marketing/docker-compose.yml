# platform-marketing (API + MCP) — ambiente enxuto (produto sales, tenant `sales`).
# Marketing multi-tenant. DB tenant MYSQL (dialect-aware, MARKETING_STORAGE_BACKEND=mysql).
# ENV_PROFILE == APP_ENV (=hml). Health :9090/api/health/live. Em hml EXIGE PII_PSEUDONYMISATION_KEY
# + MCP_SERVICE_TOKEN. MCP imagem propria (markai-mcp, 16 servers) — buildado a parte.
name: dataforall-marketing

networks:
  platform-local:
    external: true

services:
  platform-marketing:
    image: d4all.azurecr.io/dataforall/3.0/platform-marketing:${IMAGE_TAG:-latest}
    container_name: platform-marketing
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-marketing
      SERVICE_ID: platform-marketing
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml
      DEPLOY_TARGET: docker
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      KAFKA_ENABLED: "false"
      MARKETING_STORAGE_BACKEND: mysql
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      ADMIN_DB_SSLMODE: require # validador hml exige TLS; MySQL 8.4 tem TLS por padrao (cert auto)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: sales
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: require # idem (MySQL 8 aceita TLS com cert auto-assinado; require nao verifica CA)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      # segredos (PII + MCP_SERVICE_TOKEN obrigatorios em hml)
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      PII_PSEUDONYMISATION_KEY: ${PII_PSEUDONYMISATION_KEY:?defina em .env}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:?defina em .env}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # S2S (LAZY). O validador do marketing exige https:// em hml — no ambiente enxuto os servicos
      # sao http interno (sem TLS), entao usamos https:// so p/ passar o formato; as chamadas S2S do
      # marketing ficam limitadas ate haver TLS interno (nao afeta boot/health, que sao lazy).
      URL_PLATFORM_CRM: https://platform-crm:8000
      URL_PLATFORM_ML: https://platform-ml:8000
      URL_PLATFORM_GOVERNANCE: https://platform-governance:8000
      URL_PLATFORM_SCHEDULER: https://platform-scheduler:8000/api/v1
      URL_NOTIFICATION: https://platform-notification:8000
      URL_CUSTOMER_ADMIN: https://platform-admin:8000
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://sales.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/api/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
