# Override LOCAL do platform-marketing.
# Expõe a API no host (127.0.0.1:2299) e corrige a URL do sales-partners
# (o default do config é 'platform-sales-partner' SINGULAR; o container é PLURAL).
services:
  platform-marketing:
    ports:
      - "127.0.0.1:2299:8000"
    # --http h11: o parser httptools do uvicorn corrompe a leitura do body em POST
    # sob a stack de BaseHTTPMiddleware deste serviço (FastAPI devolve 400 "There was
    # an error parsing the body"). Com h11 o body parseia normalmente. Local-only.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "uvloop", "--http", "h11"]
    environment:
      URL_SALES_PARTNERS: http://platform-sales-partners:8000
      # S2S: JWT de serviço obtido do platform-auth (service_identity). SERVICE_ID já vem
      # do compose base; URL_AUTH usa o default http://platform-auth:8000.
      SERVICE_SECRET: ${MARKETING_SERVICE_SECRET:?defina em .env (secret da service account platform-marketing)}
