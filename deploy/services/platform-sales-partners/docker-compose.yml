# platform-sales-partners (API + MCP) — ambiente enxuto (produto sales, tenant `sales`).
# Parceiros/comissoes. DB tenant MYSQL (migrations dialect-aware). Valida JWT via JWKS.
# ENV_PROFILE == APP_ENV (=hml). Health :8000/api/health/ready. MCP imagem propria (Dockerfile.mcp, :7107).
name: dataforall-sales-partners

networks:
  platform-local:
    external: true

services:
  platform-sales-partners:
    image: d4all.azurecr.io/dataforall/3.0/platform-sales-partners:${IMAGE_TAG:-latest}
    container_name: platform-sales-partners
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-sales-partners
      SERVICE_ID: platform-sales-partners
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml
      DEPLOY_TARGET: docker
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      KAFKA_ENABLED: "false"
      KAFKA_CONSUMER_ENABLED: "false"
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: sales
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      URL_AUTH: http://platform-auth:8000/internal
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://sales.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (Dockerfile.mcp). Porta 7107, /v1/health + /mcp/tools/list.
  platform-sales-partners-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-sales-partners-mcp:${IMAGE_TAG:-latest}
    container_name: platform-sales-partners-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      MCP_SALES_PARTNERS_SERVICE_BASE_URL: http://platform-sales-partners:8000
      MCP_SALES_PARTNERS_AUTH_URL: http://platform-auth:8000/internal
      MCP_SALES_PARTNERS_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      MCP_SALES_PARTNERS_DEFAULT_TENANT_ID: sales
      MCP_SALES_PARTNERS_TWIN_ENFORCE: "false"
    depends_on:
      platform-sales-partners:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7107/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
