# Override LOCAL do platform-sales-partners.
# Expõe a API no host para o frontend/dev proxy e testes diretos.
# PLATFORMS[SALES_PARTNERS].url = http://localhost:2288 (internal_port 2288);
# o container escuta em 8000, então mapeia 2288(host)->8000(container).
services:
  platform-sales-partners:
    ports:
      - "127.0.0.1:2288:8000"
    environment:
      # O pool default do compose base aponta pra tenant-mysql/`sales` (inexistente).
      # O DB real do tenant SALES_PARTNERS já existe no tenant-mysql (migrado).
      DB_NAME: SALES_PARTNERS
      SERVICE_TENANT_ID: SALES_PARTNERS
