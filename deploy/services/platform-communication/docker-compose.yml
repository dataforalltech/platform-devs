# platform-communication (API + MCP) — ambiente enxuto.
# Mensageria multi-canal (email/SMS/whatsapp/push/chat). Valida JWT via JWKS. DB tenant (mysql).
# MCP: MESMA imagem da API (nao ha imagem -mcp), rodando o sidecar HTTP (MCP_HTTP_MODE=1, 7100).
name: dataforall-communication

networks:
  platform-local:
    external: true

services:
  platform-communication:
    image: d4all.azurecr.io/dataforall/3.0/platform-communication:${IMAGE_TAG:-latest}
    container_name: platform-communication
    restart: unless-stopped
    networks: [platform-local]
    # CMD bakado usa `uvicorn --max-requests` (invalido nesta versao do uvicorn -> crash).
    # Override com `--limit-max-requests`. Fix de raiz: corrigir o CMD no Dockerfile do repo.
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} --loop uvloop --http httptools --limit-max-requests 1000"]
    environment:
      APP_NAME: platform-communication
      SERVICE_ID: platform-communication
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: local-hml # {RUNTIME_ENV}-{APP_ENV}
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      HEALTHCHECK_TENANT_ID: dataforall # usado pelo healthcheck bakado (X-Tenant-Id)
      # Registry admin
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      # segredos
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      NOTIFICATION_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # Kafka OFF
      KAFKA_ENABLED: "false"
      KAFKA_CONSUMER_ENABLED: "false"
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # platform-communication-mcp: PENDENTE (defeito no repo — K5).
  # O codigo do MCP esta em `mcp/src/server/mcp_server.py` mas o repo NAO tem Dockerfile
  # de MCP, e a imagem da API copia so `app/` + `src/` (nao `mcp/`) — entao nao da p/ rodar
  # da mesma imagem (`ModuleNotFoundError: src.server`). Fix de raiz: adicionar `mcp/Dockerfile`
  # no repo platform-communication (FROM python, COPY mcp/, pip install, CMD MCP_HTTP_MODE=1
  # python -m src.server.mcp_server com WORKDIR /app/mcp) e rebuildar como platform-communication-mcp.
