# platform-auth (API + MCP) — ambiente enxuto.
# API: identidade RS256. Assina JWT; publica JWKS em /internal/.well-known/jwks.json
#      (o gateway valida por ali). Chave privada vem do Vault KV (D5), NAO de env.
# MCP: sidecar (porta 28000) que fala com a API via INTERNAL_API_TOKEN.
name: dataforall-auth

networks:
  platform-local:
    external: true

services:
  platform-auth:
    image: d4all.azurecr.io/dataforall/3.0/platform-auth:${IMAGE_TAG:-latest}
    container_name: platform-auth
    restart: unless-stopped
    networks: [platform-local]
    # API nao publica porta no host: o gateway alcanca via platform-auth:8000 na rede.
    volumes:
      # chave RSA privada (fonte duravel: SSM SecureString /dataforall-hml/platform-auth/jwt-private-key)
      - /opt/dataforall/deploy/secrets/jwt-auth.pem:/run/secrets/jwt_key.pem:ro
    environment:
      APP_NAME: platform-auth
      SERVICE_ID: platform-auth
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: local-hml
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1" # 1 worker: evita corrida no health server :9090
      # Registry admin (ADMIN_DATAFORALL)
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      ADMIN_DB_SSLMODE: disable
      # DB do proprio auth (tenant-mysql / platform_auth)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: platform_auth
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT RS256 — audience/issuer devem casar com o gateway
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      # chave RSA via arquivo montado (env PATH vence Vault no vault_loader).
      # Debito D5: o build atual nao wireia Vault->chave; migrar quando prod Vault existir.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_key.pem
      VAULT_ADDR: http://vault:8200
      VAULT_AUTH_METHOD: token
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:?defina em .env}
      # Redis (rate limit)
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # Token interno service-to-service
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # CORS
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
      # Observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  platform-auth-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-auth-mcp:${IMAGE_TAG:-latest}
    container_name: platform-auth-mcp
    restart: unless-stopped
    networks: [platform-local]
    ports:
      - "127.0.0.1:28801:28000" # debug local via SSM port-forward
    environment:
      MCP_AUTH_BASE_URL: http://platform-auth:8000
      MCP_AUTH_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      MCP_AUTH_LOG_LEVEL: INFO
    depends_on:
      platform-auth:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
