# platform-mcp — GATEWAY MCP CENTRAL (front-door unico de MCP, PEP/PDP + twin token).
# Valida twin token via JWKS do admin, troca por inner token (Model C) no /twin/exchange,
# roteia para os sidecars MCP (registry = GATEWAY_MAPPING). NAO e sidecar.
name: dataforall-mcp

networks:
  platform-local:
    external: true

services:
  platform-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-mcp:${IMAGE_TAG:-latest}
    container_name: platform-mcp
    restart: unless-stopped
    networks: [platform-local]
    ports:
      - "127.0.0.1:8090:8000" # front-door MCP (debug via SSM port-forward)
    environment:
      ENVIRONMENT: staging
      RUNTIME_ENV: local
      APP_ENV: hml
      TZ: UTC
      GATEWAY_WORKERS: "1" # obrigatorio 1 (estado HITL in-memory)
      # Twin token: valida via JWKS do admin, troca por inner token no exchange
      GATEWAY_AUDIENCE: mcp:gateway
      URL_ADMIN_TWIN_JWKS: http://platform-admin:8000/api/v1/twin/jwks.json
      ADMIN_EXCHANGE_URL: http://platform-admin:8000/api/v1/twin/exchange
      GATEWAY_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      EXCHANGE_CACHE_TTL_SECONDS: "45" # DEVE ser < 60 (lifetime do inner token)
      REVOCATION_ENABLED: "true" # obrigatorio true em staging/hml/prod
      # Registry dos backends MCP (le GATEWAY_MAPPING do ADMIN_DATAFORALL)
      REGISTRY_SOURCE: db
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      # mapeia namespace -> URL do container (rede docker) p/ os sidecars/servicos
      NAMESPACE_URL_OVERRIDES: '{"admin":"http://platform-admin:8000","auth":"http://platform-auth:8000","governance":"http://platform-governance:8000","api-gateway":"http://platform-api-gateway:8000"}'
      # Redis (revogacao + rate limit)
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
