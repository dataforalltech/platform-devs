# platform-governance (API + MCP) — ambiente enxuto.
# Servico de permissoes/RLS/RBAC/aprovacoes. VALIDA JWT (JWKS do auth), nao assina.
# Alvo de chamadas S2S (X-Tenant-Id + X-Internal-Token). MCP na porta 7103.
name: dataforall-governance

networks:
  platform-local:
    external: true

services:
  platform-governance:
    image: d4all.azurecr.io/dataforall/3.0/platform-governance:${IMAGE_TAG:-latest}
    container_name: platform-governance
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-governance
      SERVICE_ID: platform-governance
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml # governance exige ENV_PROFILE == APP_ENV (nao {runtime}-{app})
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      HEALTH_PORT: "9090"
      # Registry admin
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      ADMIN_DB_SSLMODE: disable
      # DB do tenant
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — SO valida (audience casa com o que o auth assina)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      # tokens
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      MCP_SERVICE_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  platform-governance-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-governance-mcp:${IMAGE_TAG:-latest}
    container_name: platform-governance-mcp
    restart: unless-stopped
    networks: [platform-local]
    ports:
      - "127.0.0.1:7103:7103"
    environment:
      MCP_GOVERNANCE_SERVICE_BASE_URL: http://platform-governance:8000
      MCP_GOVERNANCE_SERVICE_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      MCP_GOVERNANCE_LOG_LEVEL: INFO
      MCP_HTTP_ONLY: "1"
      MCP_PORT: "7103"
    depends_on:
      platform-governance:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
