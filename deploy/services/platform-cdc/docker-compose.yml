# platform-cdc (API + MCP) — ambiente enxuto.
# Change-data-capture. Sobe API standalone (Kafka/coordinator OFF; workers standalone).
# Valida JWT via JWKS. DB do tenant (mysql). MCP na 28000 (SSE, 9 tools).
name: dataforall-cdc

networks:
  platform-local:
    external: true

services:
  platform-cdc:
    image: d4all.azurecr.io/dataforall/3.0/platform-cdc:${IMAGE_TAG:-latest}
    container_name: platform-cdc
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-cdc
      SERVICE_ID: platform-cdc
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: local-hml # cdc exige {RUNTIME_ENV}-{APP_ENV} (como o core)
      NETWORK_TOPOLOGY: docker
      DEPLOY_TARGET: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      # Registry admin
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      # tokens / S2S DIRETO
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      URL_AUTH: http://platform-auth:8000/internal
      CONNECTORS_SERVICE_URL: http://platform-connectors:8000
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # CDC: API standalone (sem streaming ativo; evita dependencia de Kafka/coordinator)
      KAFKA_ENABLED: "false"
      KAFKA_CONSUMER_ENABLED: "false"
      CDC_ENABLED: "true"
      CDC_COORDINATOR_ENABLED: "false"
      CDC_WORKER_STANDALONE: "true"
      MONITOR_EVENTS_ENABLED: "false"
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  platform-cdc-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-cdc-mcp:${IMAGE_TAG:-latest}
    container_name: platform-cdc-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      MCP_HTTP_PORT: "28000"
      CDC_INTERNAL_URL: http://platform-cdc:8000/api/v1
      CDC_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CDC_MCP_TWIN_ENFORCE: "false" # senao exige URL_ADMIN_TWIN_JWKS no boot
      URL_AUTH: http://platform-auth:8000/internal
      SERVICE_ID: platform-cdc
    depends_on:
      platform-cdc:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
