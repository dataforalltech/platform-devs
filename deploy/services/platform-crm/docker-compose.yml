# platform-crm (API + MCP) — ambiente enxuto (produto sales, tenant `sales`).
# CRM multi-tenant. DB tenant MYSQL (migrations dialect-aware, compat helpers). Valida JWT via JWKS.
# ENV_PROFILE == APP_ENV (=hml). Health server em porta SEPARADA 9090. Migrations opt-in -> rodar manual.
name: dataforall-crm

networks:
  platform-local:
    external: true

services:
  platform-crm:
    image: d4all.azurecr.io/dataforall/3.0/platform-crm:${IMAGE_TAG:-latest}
    container_name: platform-crm
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-crm
      SERVICE_ID: platform-crm
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml # == APP_ENV
      DEPLOY_TARGET: docker
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      AUTH_DEV_BYPASS: "false"
      MIGRATE_TENANTS_ON_STARTUP: "false" # migrar fora de banda (manual)
      # Registry admin (PLATFORMS)
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql) — produto sales usa o tenant `sales`
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: sales
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      # segredos
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://sales.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (mcp/Dockerfile, contexto raiz). Porta 7100, /v1/health + /v1/tools.
  platform-crm-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-crm-mcp:${IMAGE_TAG:-latest}
    container_name: platform-crm-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      MCP_SERVICE_CRM_URL: http://platform-crm:8000
      MCP_SERVICE_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      MCP_SERVICE_DEFAULT_TENANT_ID: sales
    depends_on:
      platform-crm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7100/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
