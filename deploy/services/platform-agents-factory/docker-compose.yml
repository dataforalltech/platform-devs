# platform-agents-factory (API + MCP) — ambiente enxuto.
# Fabrica de agentes de IA. Valida JWT via JWKS do auth. DB tenant (mysql).
# ENV_PROFILE = {RUNTIME_ENV}-{APP_ENV} => local-hml. Migrations sao non-fatal no boot.
# LLM keys (OpenAI/Anthropic) sao LAZY (resolvidas do DB por tenant) — nao precisam no boot.
name: dataforall-agents-factory

networks:
  platform-local:
    external: true

services:
  platform-agents-factory:
    image: d4all.azurecr.io/dataforall/3.0/platform-agents-factory:${IMAGE_TAG:-latest}
    container_name: platform-agents-factory
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-agents-factory
      SERVICE_ID: platform-agents-factory
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: local-hml # {RUNTIME_ENV}-{APP_ENV}
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      AGENTS_RUNTIME: lib
      LAB_MODE: "false"
      AUTH_DEV_BYPASS: "false"
      # Registry admin (descoberta de tenants em PLATFORMS)
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql) — version table isolada (alembic_version_agents_factory)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth (audience = platform-services)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "240"
      # segredos
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      FERNET_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # S2S direto
      URL_AUTH: http://platform-auth:8000/internal
      URL_IAM: http://platform-admin:8000/api/internal/iam
      # rate limit / observabilidade
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      KAFKA_ENABLED: "false"
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (Dockerfile.mcp do repo). Porta 7130, /v1/health.
  # Env prefix AGENTS_FACTORY_MCP_* + shared (JWT_SECRET_KEY/JWT_ALGORITHM).
  platform-agents-factory-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-agents-factory-mcp:${IMAGE_TAG:-latest}
    container_name: platform-agents-factory-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      AGENTS_FACTORY_MCP_FACTORY_URL: http://platform-agents-factory:8000
      AGENTS_FACTORY_MCP_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      AGENTS_FACTORY_MCP_DEFAULT_TENANT_ID: dataforall
      AGENTS_FACTORY_MCP_MCP_PORT: "7130"
      # JWT compartilhado — valida via JWKS (RS256), audience platform-services
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      JWT_ALGORITHM: RS256
      AGENTS_FACTORY_MCP_JWT_ISSUER: platform-auth
      AGENTS_FACTORY_MCP_JWT_AUDIENCE: platform-services
    depends_on:
      platform-agents-factory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7130/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
