# platform-connectors (API + MCP) — ambiente enxuto.
# Integracoes/conectores externos. Cifra credenciais com Fernet (CREDENTIAL_ENCRYPTION_KEY
# OBRIGATORIA). Valida JWT via JWKS do auth. DB do tenant (mysql). MCP na 28000 (235 tools).
name: dataforall-connectors

networks:
  platform-local:
    external: true

services:
  platform-connectors:
    image: d4all.azurecr.io/dataforall/3.0/platform-connectors:${IMAGE_TAG:-latest}
    container_name: platform-connectors
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-connectors
      SERVICE_ID: platform-connectors
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml # connectors exige ENV_PROFILE == APP_ENV (como governance)
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      HEALTH_PORT: "9090"
      # Registry admin
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      # Fernet — OBRIGATORIA (cifra credenciais dos conectores)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      # assina o state dos fluxos OAuth dos conectores (obrigatorio fora de dev)
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?defina em .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina em .env}       # assina tokens de webhook (PIX/PSP)
      FILE_PROXY_SECRET: ${FILE_PROXY_SECRET:?defina em .env} # assina URLs do file proxy
      # tokens / S2S DIRETO
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      SERVICE_TENANT_ID: dataforall
      URL_AUTH: http://platform-auth:8000/internal
      URL_IAM: http://platform-admin:8000/api/internal/iam
      URL_GOVERNANCE: http://platform-governance:8000
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      KAFKA_ENABLED: "false"
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  platform-connectors-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-connectors-mcp:${IMAGE_TAG:-latest}
    container_name: platform-connectors-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      CONNECTORS_MCP_CONNECTORS_URL: http://platform-connectors:8000
      CONNECTORS_MCP_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CONNECTORS_MCP_DEFAULT_TENANT_ID: dataforall
      CONNECTORS_MCP_REQUEST_TIMEOUT: "600"
      CONNECTORS_MCP_AUTH_URL: http://platform-auth:8000/internal
      CONNECTORS_MCP_AUTH_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
    depends_on:
      platform-connectors:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
