# dataforall-customer-admin — ambiente enxuto (HML).
# Backend de admin de clientes (tenant-scoped: resolve o DB do tenant pela PLATFORMS
# em runtime). JWT HS256 (audience service-clients). Porta 8000, health /api/health/ready.
# Kafka OFF no enxuto; DB sem TLS interno (DB_SSLMODE=disable). Migrations per-tenant (manual).
# Build: build-service.sh dataforall-customer-admin dataforall-customer-admin develop Dockerfile .
name: dataforall-customer-admin

networks:
  platform-local:
    external: true

services:
  dataforall-customer-admin:
    image: d4all.azurecr.io/dataforall/3.0/dataforall-customer-admin:${IMAGE_TAG:-latest}
    container_name: dataforall-customer-admin
    restart: unless-stopped
    networks: [platform-local]
    # K6: o CMD bakado usa --max-requests (opcao do gunicorn, NAO do uvicorn) -> crash.
    # Override sem essas opcoes.
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} --loop uvloop --http httptools"]
    environment:
      APP_NAME: customer-admin
      APP_ENV: hml
      ENV_PROFILE: hml
      ENVIRONMENT: staging
      TZ: UTC
      UVICORN_WORKERS: "1"
      SERVICE_PORT: "8000"
      DOCS_ENABLED: "false"
      # DB do tenant: host/porta/nome vem da PLATFORMS em runtime; creds/ssl aqui.
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      DB_SSL_MODE: disable
      # Admin DB (PLATFORMS / GATEWAY_MAPPING)
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # JWT HS256 (secret compartilhado)
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: service-clients
      # Kafka OFF (enxuto)
      KAFKA_ENABLED: "false"
      KAFKA_CONSUMER_ENABLED: "false"
      # S2S
      URL_AUTH: http://platform-auth:8000/internal
      URL_IAM: http://platform-admin:8000/api/v1/iam
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # observabilidade off + rate-limit em memoria
      OTEL_TRACES_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: '["https://admin.dataforall.tech"]'
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
