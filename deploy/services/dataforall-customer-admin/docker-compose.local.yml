services:
  dataforall-customer-admin:
    environment:
      APP_NAME: platform-customer-admin
      JWT_ALGORITHM: RS256
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      # Publish `customer.created` on signup → platform-dataforall-admin mirrors
      # the account into its CUSTOMERS registry. Producer only (consumer stays off).
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
