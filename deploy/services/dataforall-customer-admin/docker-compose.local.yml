services:
  dataforall-customer-admin:
    # Expose the backend on the host so the customer-admin frontend dev proxy
    # (vite target 127.0.0.1:2222) can reach it. Prod uses the gateway instead.
    ports:
      - "127.0.0.1:2222:8000"
    environment:
      APP_NAME: platform-customer-admin
      JWT_ALGORITHM: RS256
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      # Publish `customer.created` on signup → platform-dataforall-admin mirrors
      # the account into its CUSTOMERS registry. Producer only (consumer stays off).
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Verification email on signup → Mailpit (local SMTP catcher, UI :8025).
      # Prod points SMTP_* at SES/SendGrid instead.
      SMTP_ENABLED: "true"
      SMTP_HOST: dataforall-mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@dataforall.tech
      EMAIL_FROM_NAME: Dataforall
      APP_PUBLIC_URL: http://localhost:2021
