coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# ── Autenticação ──────────────────────────────────────────────────────────────
# Descomente as linhas abaixo para habilitar autenticação por senha.
# Requer que os usuários existam em /var/trino-registry/password.db
# (gerenciado automaticamente pela API platform-iceberg).
#
# ATENÇÃO: Após habilitar, todas as conexões precisam de usuário+senha.
# Atualize o conector Power BI para usar autenticação Usuário/Senha.
#
# http-server.authentication.type=PASSWORD
# http-server.authentication.allow-insecure-over-http=true

