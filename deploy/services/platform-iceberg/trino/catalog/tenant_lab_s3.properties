connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=tenant_lab_s3
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:${ENV:POLARIS_CLIENT_SECRET}
# O Polaris EXIGE o scope PRINCIPAL_ROLE:ALL (senao 'invalid_scope'). scope+server-uri sao aceitos
# pelo Trino 465; `token-refresh-enabled` NAO e (renomeada/removida) e prop nao-usada = erro fatal -> removida.
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.region=us-east-1
s3.path-style-access=true
s3.endpoint=http://minio:9000
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
