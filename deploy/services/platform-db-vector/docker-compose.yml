# platform-db-vector (API + pgvector dedicado) — ambiente enxuto.
# Vector store / RAG (chunks + embeddings). Backend 100% pgvector (Postgres) — HARDCODED, sem fallback:
# coluna VECTOR, indice HNSW, operador <=>, `CREATE EXTENSION vector`. Por isso roda um Postgres
# DEDICADO com a extensao (pgvector/pgvector:pg16), separado do tenant-postgres compartilhado.
# Embeddings: OpenAI text-embedding-3-small (OPENAI_API_KEY vem do SSM -> .env on-box).
# ENV_PROFILE = {RUNTIME_ENV}-{APP_ENV} = local-hml. Porta 5004. Health /api/health/live (nao checa DB).
# MCP: NAO existe em develop (so em feat/mcp-server) -> nao subimos MCP.
# NOTA: o connection_factory valida tenant_id como UUID -> provisionar KB exige tenant UUID (nao 'dataforall').
name: dataforall-db-vector

networks:
  platform-local:
    external: true

volumes:
  dbvec-pgdata:
  dbvec-storage:

services:
  # Postgres DEDICADO com pgvector (isolado do tenant-postgres compartilhado)
  dbvec-postgres:
    image: pgvector/pgvector:pg16
    container_name: dbvec-postgres
    restart: unless-stopped
    networks: [platform-local]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DBVEC_PG_PASSWORD:?defina em .env}
      POSTGRES_DB: postgres
    volumes:
      - dbvec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  platform-db-vector:
    image: d4all.azurecr.io/dataforall/3.0/platform-db-vector:${IMAGE_TAG:-latest}
    container_name: platform-db-vector
    restart: unless-stopped
    networks: [platform-local]
    # CMD do Dockerfile fixa --workers 4; override p/ 1 (economia no box enxuto).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5004", "--workers", "1", "--loop", "uvloop", "--http", "httptools"]
    environment:
      APP_NAME: platform-db-vector
      SERVICE_ID: platform-db-vector
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: local-hml # {RUNTIME_ENV}-{APP_ENV}
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      ROOT_PATH: ""
      PORT: "5004"
      # DB dedicado (pgvector)
      DB_ENGINE: postgresql
      DB_HOST: dbvec-postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DBVEC_PG_PASSWORD:?defina em .env}
      DB_SCHEMA: rag_service
      # embeddings (OpenAI)
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: "1536"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?defina em .env}
      VECTOR_STORE_PROVIDER: pgvector
      # storage local
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_BASE_PATH: /app/data/storage
      # JWT (valida via JWKS do auth; RS256)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # rate limit in-memory: o slowapi/limits exige o pacote python `redis` p/ storage redis,
      # que nao esta no requirements -> `memory://` (fallback in-memory, sem dep extra).
      RATE_LIMIT_STORAGE_URI: "memory://"
      KAFKA_ENABLED: "false"
      OTEL_TRACES_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: INFO
    volumes:
      - dbvec-storage:/app/data/storage
    depends_on:
      dbvec-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5004/api/health/live',timeout=4).status==200 else 1)\" 2>/dev/null || curl -f http://localhost:5004/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
