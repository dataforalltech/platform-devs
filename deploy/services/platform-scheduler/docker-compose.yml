# platform-scheduler (API + MCP) — ambiente enxuto.
# Agendador de jobs (APScheduler async, cron). Valida JWT via JWKS. DB tenant resolvido via
# ADMIN_DATAFORALL.PLATFORMS -> dataforall = MYSQL/tenant-mysql (o config aceita mysql; migrations
# MySQL-compat; driver aiomysql presente). Health server em porta SEPARADA 9090.
# PARTICULARIDADES do validador: ENV_PROFILE == APP_ENV (=hml); JWT_ALGORITHM=RS256 (obrigatorio);
# JWT_ISSUER=platform-auth (obrigatorio); JWT_ACCESS_TOKEN_EXPIRE_MINUTES <= 30 (AUTH-08); INTERNAL_API_TOKEN
# >= 32 bytes; RATE_LIMIT_STORAGE_URI nao-vazio; sem sentinelas em senhas/token; CORS sem wildcard.
name: dataforall-scheduler

networks:
  platform-local:
    external: true

services:
  platform-scheduler:
    image: d4all.azurecr.io/dataforall/3.0/platform-scheduler:${IMAGE_TAG:-latest}
    container_name: platform-scheduler
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-scheduler
      SERVICE_ID: platform-scheduler
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml # == APP_ENV
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      HEALTH_PORT: "9090"
      # Registry admin (PLATFORMS) — sempre MySQL
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant — resolvido via PLATFORMS.dataforall (=mysql/tenant-mysql); fallback estatico abaixo
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30" # AUTH-08: validador exige <= 30
      # segredos
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # scheduler engine
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TIMEZONE: America/Sao_Paulo
      CONNECTOR_RECONCILE_ENABLED: "false" # minimal: nao reconciliar contra connectors no boot
      ML_RECONCILE_ENABLED: "false"        # minimal: nao reconciliar contra ml
      # Kafka OFF
      KAFKA_ENABLED: "false"
      KAFKA_DLQ_ENABLED: "true"
      # observabilidade
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — MESMA imagem, command `python -m mcp.server` (porta 7106, /v1/health, /mcp/tools/list).
  # O Dockerfile do scheduler NAO faz COPY do `mcp/` (so app/src/alembic) -> a imagem nao traz o codigo
  # do MCP (embora ele esteja em origin/develop). Injetamos por bind-mount em /app/mcp (deps fastapi/httpx/
  # uvicorn ja estao na imagem; get_twin_pep e lazy por-call). Fix de raiz: COPY mcp/ no Dockerfile (tarefa).
  platform-scheduler-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-scheduler:${IMAGE_TAG:-latest}
    container_name: platform-scheduler-mcp
    restart: unless-stopped
    networks: [platform-local]
    working_dir: /app
    command: ["python", "-m", "mcp.server"]
    volumes:
      - ./mcp:/app/mcp:ro
    environment:
      TZ: UTC
      MCP_PORT: "7106"
      SCHEDULER_MCP_SERVICE_BASE_URL: http://platform-scheduler:8000
      SCHEDULER_MCP_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      SCHEDULER_MCP_REQUEST_TIMEOUT: "15"
    depends_on:
      platform-scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7106/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
