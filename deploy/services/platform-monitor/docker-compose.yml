# platform-monitor (API + MCP) — ambiente enxuto.
# Monitoramento/alertas de metricas. Valida JWT via JWKS. DB tenant (mysql, tabelas mon_).
# PARTICULARIDADES:
#  - Health server em porta SEPARADA 9090 (/health/ready) — como o api-gateway. UVICORN_WORKERS=1.
#  - Migrations sao SQL PURO (nao alembic): scripts/apply_mysql_migrations.sh (rodar 1x pos-boot).
#  - NAO usa ENV_PROFILE (o repo nao valida esse campo).
#  - MONITOR_ALLOW_PRIVATE_URLS deve ser false (SSRF-01); LOG_LEVEL != DEBUG; JWT RS256 (AUTH-15).
#  - MCP :28000 resolve X-Internal-Token por-tenant do ADMIN_DATAFORALL.PLATFORMS (precisa ADMIN_DB_*).
name: dataforall-monitor

networks:
  platform-local:
    external: true

services:
  platform-monitor:
    image: d4all.azurecr.io/dataforall/3.0/platform-monitor:${IMAGE_TAG:-latest}
    container_name: platform-monitor
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-monitor
      SERVICE_ID: platform-monitor
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      HEALTH_PORT: "9090"
      LOG_LEVEL: INFO
      MONITOR_ALLOW_PRIVATE_URLS: "false"
      SCHEDULER_ENABLED: "true"
      # Registry admin (resolucao de tenant / internal_token em PLATFORMS)
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql) — tabelas mon_
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth (RS256 obrigatorio)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      # segredos
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # S2S direto — alertas vao pro notification (/api/internal/monitor/alert existe)
      NOTIFICATION_SERVICE_URL: http://platform-notification:8000
      NOTIFICATION_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # rate limit / observabilidade
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # Kafka OFF (default do repo e true)
      KAFKA_ENABLED: "false"
      KAFKA_CONSUMER_ENABLED: "false"
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/health/ready',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (mcp/Dockerfile). Porta 28000, /v1/health.
  # Resolve X-Internal-Token por-tenant do ADMIN_DATAFORALL.PLATFORMS (precisa ADMIN_DB_*).
  platform-monitor-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-monitor-mcp:${IMAGE_TAG:-latest}
    container_name: platform-monitor-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      MONITOR_MCP_SERVICE_BASE_URL: http://platform-monitor:8000
      MONITOR_MCP_HEALTH_BASE_URL: http://platform-monitor:9090
      # TwinPep desligado no bring-up (paridade com os demais -mcp); ligar exige governance+JWKS
      MONITOR_MCP_TWIN_ENFORCE: "false"
      # Admin DB (le do env; resolve internal_token por tenant)
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      ADMIN_DB_SSLMODE: disable
    depends_on:
      platform-monitor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:28000/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
