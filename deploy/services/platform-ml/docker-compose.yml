# platform-ml (API + MCP) — ambiente enxuto.
# Serving de ML/NLP/vision/audio/generative. Imagem ENXUTA do ACR (CPU-only, sem CUDA) — PULL, sem build.
# Valida JWT via JWKS do auth. DB tenant (mysql) resolvido via ADMIN_DATAFORALL.PLATFORMS.
# ATENCAO ENV_PROFILE: no ml o validator exige ENV_PROFILE == APP_ENV => "hml" (NAO local-hml).
name: dataforall-ml

networks:
  platform-local:
    external: true

volumes:
  ml-model-registry:

services:
  # Init: o volume nomeado nasce root:root, mas a imagem roda como appuser (uid 1000).
  # Sem este chown o boot falha com "MODEL_REGISTRY_PATH is not writable" (Errno 13).
  # Roda 1x e sai; o app so sobe apos completar com sucesso. Reutiliza a propria imagem
  # (ja presente) como root — sem pull extra. Idempotente.
  platform-ml-init:
    image: d4all.azurecr.io/dataforall/3.0/platform-ml:${IMAGE_TAG:-latest}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data/platform-ml/model-registry"]
    volumes:
      - ml-model-registry:/data/platform-ml/model-registry
    restart: "no"
    networks: [platform-local]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  platform-ml:
    image: d4all.azurecr.io/dataforall/3.0/platform-ml:${IMAGE_TAG:-latest}
    container_name: platform-ml
    restart: unless-stopped
    networks: [platform-local]
    depends_on:
      platform-ml-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: platform-ml
      SERVICE_ID: platform-ml
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml # ml: validator exige == APP_ENV
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      DOCS_ENABLED: "false"
      UVICORN_WORKERS: "1"
      # Registry admin (descoberta de tenants em PLATFORMS)
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql)
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # JWT — valida via JWKS do auth (audience = platform-services p/ casar com os tokens emitidos)
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina em .env}
      # segredos
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      NOTIFICATION_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      # ML-especifico: CPU-only, sem carregar modelos gigantes no boot
      ML_METADATA_BACKEND: db
      MODEL_REGISTRY_BACKEND: db
      MODEL_REGISTRY_PATH: /data/platform-ml/model-registry
      ML_USE_GPU: "false"
      ML_WHISPER_DEVICE: cpu
      ONNX_RUNTIME_ENABLED: "false"
      # S2S direto (nunca via gateway)
      URL_GOVERNANCE: http://platform-governance:8000
      # NOTIFICATION desligado: o cliente de notificacao desta imagem esta com contrato
      # DEFASADO vs a API atual do platform-notification (seed em /api/internal/notification-types/seed
      # e notify em /api/internal/notify NAO existem mais; o seed hoje e /api/v1/notification-types/seed
      # com JWT admin + X-Tenant-Id). O `_configured()` do ml pula o seed no boot quando a URL e vazia,
      # evitando o crash "raise_for_status" no 400. Reconciliar o cliente no repo -> tarefa aberta.
      NOTIFICATION_SERVICE_URL: ""
      # rate limit / observabilidade
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      KAFKA_ENABLED: "false"
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ml-model-registry:/data/platform-ml/model-registry
      # A imagem ENXUTA do ml NAO empacotou o diretorio alembic/ + alembic.ini, mas o
      # migration_manager (e o scripts/bootstrap_tenants.py) esperam em /app/alembic.ini
      # (Path(__file__).parents[2]) e script_location=alembic (=> /app/alembic). Sem eles,
      # provisionar as tabelas do tenant falha com "No 'script_location' key". Injetamos o
      # alembic/ do repo por bind-mount (read-only). Fix de raiz: incluir alembic/ na imagem enxuta.
      - ./alembic-inject/alembic.ini:/app/alembic.ini:ro
      - ./alembic-inject/alembic:/app/alembic:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/live',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (mcp/Dockerfile do repo). Porta 7104, /v1/health.
  # Aponta para a REST API do proprio servico via MCP_ML_SERVICE_BASE_URL.
  platform-ml-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-ml-mcp:${IMAGE_TAG:-latest}
    container_name: platform-ml-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      MCP_ML_HTTP: "1"
      MCP_PORT: "7104"
      MCP_ML_SERVICE_BASE_URL: http://platform-ml:8000
      MCP_ML_LOG_LEVEL: INFO
      ML_MCP_SERVICE_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      ML_MCP_TWIN_ENFORCE: "0"
    depends_on:
      platform-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7104/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
