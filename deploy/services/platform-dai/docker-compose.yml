# platform-dai (API + MCP) — ambiente enxuto.
# Orquestrador de agentes de IA multi-tenant (planner + subagentes BI/analise/SQL/integracao).
# FastAPI, porta 5003. Valida JWT via JWKS. DB tenant mysql (migrations dialect-aware, MySQL-compat).
# LLM keys (OpenAI/Anthropic) sao LAZY (so no chat) — nao precisam no boot.
# ATENCAO: ENVIRONMENT=staging e tratado como prod-like -> NAO setar AUTH_DEV_BYPASS/LAB_MODE/TOKEN_DEV.
# Health /api/health/ready faz SELECT 1 real -> precisa do DB alcancavel. ROOT_PATH="" (default e /ai).
name: dataforall-dai

networks:
  platform-local:
    external: true

services:
  platform-dai:
    image: d4all.azurecr.io/dataforall/3.0/platform-dai:${IMAGE_TAG:-latest}
    container_name: platform-dai
    restart: unless-stopped
    networks: [platform-local]
    environment:
      APP_NAME: platform-dai
      SERVICE_ID: platform-dai
      APP_ENV: hml
      RUNTIME_ENV: local
      ENVIRONMENT: staging
      ENV_PROFILE: hml
      NETWORK_TOPOLOGY: docker
      TZ: UTC
      # DOCS_ENABLED=true: o dai-mcp le o /openapi.json da API pra montar as tools (com false vira 404).
      # E interno (rede platform-local, sem exposicao externa via tunnel/gateway).
      DOCS_ENABLED: "true"
      UVICORN_WORKERS: "1"
      ROOT_PATH: "" # override do default /ai (MCP le /openapi.json direto)
      # Registry admin (mysql)
      ADMIN_DB_ENGINE: mysql
      ADMIN_DB_HOST: admin-mysql
      ADMIN_DB_PORT: "3306"
      ADMIN_DB_NAME: ADMIN_DATAFORALL
      ADMIN_DB_USER: root
      ADMIN_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # DB do tenant (mysql) — usado pelo readiness (SELECT 1) e persistencia dai_*
      DB_ENGINE: mysql
      DB_HOST: tenant-mysql
      DB_PORT: "3306"
      DB_NAME: dataforall
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      DB_SSLMODE: disable
      # DB dos agentes (agents-lib) — lazy; aponta pro mesmo tenant mysql
      AGENTS_DB_ENGINE: mysql
      AGENTS_DB_HOST: tenant-mysql
      AGENTS_DB_PORT: "3306"
      AGENTS_DB_NAME: dataforall
      AGENTS_DB_USER: root
      AGENTS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      # JWT — valida via JWKS do auth
      JWT_ALGORITHM: RS256
      JWT_ISSUER: platform-auth
      JWT_AUDIENCE: platform-services
      JWT_JWKS_URL: http://platform-auth:8000/internal/.well-known/jwks.json
      # segredos (INTERNAL_SERVICE_TOKEN != TOKEN_DEV, senao bloqueia em staging)
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?defina em .env}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?defina em .env}@redis:6379/0
      # Kafka OFF; LLM keys omitidas (lazy — chat exige, health nao)
      KAFKA_ENABLED: "false"
      OTEL_TRACES_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: '["https://app.dataforall.tech"]'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5003/api/health/ready',timeout=4).status==200 else 1)\" 2>/dev/null || curl -f http://localhost:5003/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Sidecar MCP — imagem propria (Dockerfile.mcp copia mcp/; porta 7120). Le o OpenAPI da API
  # e expoe as operacoes como tools. env_prefix DAI_MCP_.
  # (PyJWT[crypto] ja no requirements.mcp.txt do repo em develop, commit b5475ff — K8 resolvido;
  #  usa o CMD default da imagem, sem workaround de pip no arranque.)
  platform-dai-mcp:
    image: d4all.azurecr.io/dataforall/3.0/platform-dai-mcp:${IMAGE_TAG:-latest}
    container_name: platform-dai-mcp
    restart: unless-stopped
    networks: [platform-local]
    environment:
      TZ: UTC
      DAI_MCP_DAI_URL: http://platform-dai:5003
      DAI_MCP_OPENAPI_PATH: /openapi.json
      DAI_MCP_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?defina em .env}
      DAI_MCP_DEFAULT_TENANT_ID: dataforall
      DAI_MCP_MCP_PORT: "7120"
      DAI_MCP_ENFORCE_PERMISSIONS: "false"
    depends_on:
      platform-dai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7120/v1/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
