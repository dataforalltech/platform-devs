    container_name: platform-auth
    environment:
      <<: [*env, *mysql]
      APP_NAME: platform-auth
      SERVICE_ID: platform-auth
      DB_NAME: platform_auth
      JWT_PRIVATE_KEY_CONTENT: ${JWT_PRIVATE_KEY_CONTENT:?chave RSA privada (PEM)}

  platform-admin:
