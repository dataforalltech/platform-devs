# ============================================================================
# docker-compose.dev.yml — Stack de DEV para testar os DevTeam localmente
# ----------------------------------------------------------------------------
# Diferente do docker-compose.pilot.yml (produção): aqui NÃO há Caddy/TLS nem
# Postgres. Cada serviço publica sua porta em localhost, stores são in-memory,
# e o auth-mcp usa o client de DEMO (security-dev) com escopo de TODOS os DevTeam.
# É o modo mais simples para conectar o Claude Code de OUTRA sessão.
#
# Uso:
#   docker compose -f deploy/dev/docker-compose.dev.yml up -d --build
#   python scripts/dev_connect.py        # emite tokens e imprime os `claude mcp add`
#
# NUNCA use este arquivo em produção (sem TLS, sem auth de borda, segredo fraco).
# ============================================================================
services:
  auth-mcp:
    build: { context: ../.., dockerfile: auth-mcp-server/Dockerfile.as }
    container_name: dev-auth-mcp
    environment:
      AS_ISSUER: http://localhost:7103
      AS_DEMO_SECRET: ${AS_DEMO_SECRET:-dev-secret-change-me}
      AS_TOKEN_TTL: ${AS_TOKEN_TTL:-86400}   # 1 dia — conveniência p/ testes
      # OAUTH_STORE/USER_STORE vazios → in-memory (sem Postgres neste modo).
    ports: ["7103:7103"]
    networks: [mcp-dev-net]

  security-mcp:
    build: { context: ../.., dockerfile: security-mcp-server/Dockerfile }
    container_name: dev-security-mcp
    environment:
      MCP_PORT: "7125"
      SECURITY_RESOURCE: http://localhost:7125/mcp
      SECURITY_PRM_URL: http://localhost:7125/.well-known/oauth-protected-resource
      AS_ISSUER: http://localhost:7103
      AS_JWKS_URL: http://auth-mcp:7103/.well-known/jwks.json
    ports: ["7125:7125"]
    depends_on: [auth-mcp]
    networks: [mcp-dev-net]

  qa-engineer-mcp:
    build: { context: ../.., dockerfile: qa-engineer-mcp-server/Dockerfile }
