# ─── Access-log sanitisation — mask secrets in query strings ─────────────────
# JWTs, WebSocket tickets and OAuth/OIDC parameters routinely appear in URLs
# (WebSocket handshakes, SSO redirects/callbacks). nginx writes $request_uri to
# the access log verbatim, so without masking these secrets would persist in
# plaintext on disk and in any log-shipping pipeline — usable for session replay
# or account takeover (SEC-API-001 / log-injection of credentials).
#
# We chain one `map` per sensitive parameter; each rewrites the VALUE to *** while
# KEEPING the key, so an operator still sees "an OAuth callback happened" or "a WS
# handshake occurred" without ever seeing the secret. A single nginx map regex can
# only rewrite one parameter, hence the chain (each map consumes the previous
# output variable). Each map uses UNIQUE named captures (p1a/p1b … p8a/p8b) so the
# substitution templates never collide across maps (a known nginx gotcha with
# shared $1/$2 or duplicate named groups under nested lazy evaluation).
#
# The [?&] anchor immediately before each key prevents substring false-positives:
#   • id_token / access_token / refresh_token are NOT caught by the bare `token` map
#   • estate is NOT caught by `state`, passcode/zipcode are NOT caught by `code`.
# Matching is first-occurrence-per-key, which covers every real OAuth/WS URL
# (these parameters are never legitimately duplicated in a single request).
map $request_uri  $masked_uri_1 { ~^(?<p1a>.*?[?&])token=[^&]*(?<p1b>.*)$         "${p1a}token=***${p1b}";         default $request_uri;  }
map $masked_uri_1 $masked_uri_2 { ~^(?<p2a>.*?[?&])access_token=[^&]*(?<p2b>.*)$  "${p2a}access_token=***${p2b}";  default $masked_uri_1; }
map $masked_uri_2 $masked_uri_3 { ~^(?<p3a>.*?[?&])refresh_token=[^&]*(?<p3b>.*)$ "${p3a}refresh_token=***${p3b}"; default $masked_uri_2; }
map $masked_uri_3 $masked_uri_4 { ~^(?<p4a>.*?[?&])id_token=[^&]*(?<p4b>.*)$      "${p4a}id_token=***${p4b}";      default $masked_uri_3; }
map $masked_uri_4 $masked_uri_5 { ~^(?<p5a>.*?[?&])ticket=[^&]*(?<p5b>.*)$        "${p5a}ticket=***${p5b}";        default $masked_uri_4; }
map $masked_uri_5 $masked_uri_6 { ~^(?<p6a>.*?[?&])code=[^&]*(?<p6b>.*)$          "${p6a}code=***${p6b}";          default $masked_uri_5; }
map $masked_uri_6 $masked_uri_7 { ~^(?<p7a>.*?[?&])state=[^&]*(?<p7b>.*)$         "${p7a}state=***${p7b}";         default $masked_uri_6; }
map $masked_uri_7 $request_uri_safe { ~^(?<p8a>.*?[?&])nonce=[^&]*(?<p8b>.*)$     "${p8a}nonce=***${p8b}";         default $masked_uri_7; }

log_format main_secure '$remote_addr - $remote_user [$time_local] '
    '"$request_method $request_uri_safe $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main_secure;

# ─── Rate-limiting zones (http context — included inside http{} by nginx) ────
limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=120r/m;
# SPA/HTML route limiter — a backstop against high-volume scraping that forges a
# browser User-Agent (so the UA block below misses it). Deliberately GENEROUS so
# many real users behind one corporate NAT (each loading index.html) are not
# throttled — an SPA only hits "/" on the initial load, then routes client-side,
# so a legitimate IP makes few "/" requests while a crawler makes one per URL.
limit_req_zone $binary_remote_addr zone=spa_zone:10m   rate=300r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Refresh endpoint limiter (F8) — looser than auth_zone because refresh is
# token-bearing and fired concurrently on bootstrap/route-guards, but still
# bounded (not the general api_zone). 60 r/min per client.
limit_req_zone $binary_remote_addr zone=refresh_zone:10m rate=60r/m;

# ─── Real client IP restoration behind Cloudflare (F1) ───────────────────────
# Cloudflare terminates TLS in front of this origin, so the raw TCP peer is a
# Cloudflare POP. Without this, $binary_remote_addr resolves to that POP and
# EVERY limit_req/limit_conn zone above keys PER-POP instead of per-client — a
# brute-force throttle an attacker dilutes across POPs. Restore the true client
# from CF-Connecting-IP, trusted ONLY when the peer is a published Cloudflare
# range (so the header cannot be spoofed by a direct-to-origin client).
# Ranges: https://www.cloudflare.com/ips/  — refresh if Cloudflare changes them.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ─── Anti-scraping: block scraper/bot User-Agents ────────────────────────────
# First-layer defence — returns 403 to the DEFAULT User-Agent of common HTTP
# libraries, headless tooling, scanners and generic crawlers (and to an empty UA).
# Real browsers send a "Mozilla/..." UA and are unaffected.
#
# This is intentionally AGGRESSIVE and IS bypassable (a custom UA or a real
# headless browser slips through). The robust defences remain: authentication
# (all data is login-gated), the rate limits above, and an edge WAF / bot manager.
# The /healthz path is exempt so orchestrator probes (curl / no UA) never get 403.
map $http_user_agent $ua_is_bot {
    default                                                                                                      0;
    ""                                                                                                           1;
    ~*(python-requests|python-urllib|\burllib|aiohttp|httpx|requests/|scrapy|mechanize|pycurl)                   1;
    ~*(go-http-client|okhttp|node-fetch|axios|got/|libwww-perl|lwp::|java/|jakarta|apache-httpclient|guzzle|httpclient|restsharp|postmanruntime|insomnia|http_request|typhoeus|faraday|httparty|rest-client) 1;
    ~*(wget|curl|httrack|wpscan|nikto|sqlmap|zgrab|masscan|nmap|nuclei|dirbuster|gobuster|ffuf|feroxbuster|acunetix|nessus|qualys|openvas|w3af) 1;
    ~*(phantomjs|headlesschrome|headless|selenium|playwright|puppeteer|splash|colly|scrapyd|chrome-lighthouse)   1;
    ~*(bot|crawler|spider|scraper|harvest|fetcher|ahrefsbot|semrushbot|mj12bot|dotbot|bytespider|petalbot|dataforseo|serpstat|seznambot|blexbot|gptbot|claudebot|ccbot|amazonbot|applebot) 1;
}
map $uri $path_is_health {
    default        0;
    ~^/healthz$    1;
}
# Block only when the UA is a bot AND the request is not the health probe.
map "$ua_is_bot:$path_is_health" $deny_bot {
    default  0;
    "1:0"    1;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health probe — exempt from the anti-scraping gate ────────────────────
    # Point the container/orchestrator health check at /healthz so it never gets
    # 403'd by the bot block below (probes may use curl / send no User-Agent).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Anti-scraping gate ───────────────────────────────────────────────────
    # 403 for known scraper/bot User-Agents (see the $deny_bot maps above).
    # `if` with `return` is one of the safe uses of `if` in a server block.
    if ($deny_bot) {
        return 403;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # IMPORTANT: Every location block that defines its own add_header directives
    # MUST repeat all headers below — nginx does NOT inherit server-level
    # add_header when a location defines its own.
    #
    # Content-Security-Policy notes:
    #   • script-src: 'unsafe-inline' REMOVED — Vite production builds use
    #     external .js chunks only; inline scripts are not needed.
    #   • style-src: 'unsafe-inline' kept — framer-motion and Radix UI inject
    #     styles at runtime; remove only after auditing all CSS-in-JS usage.
    #   • connect-src: explicit https/wss only — no cleartext ws: allowed.
    #   • upgrade-insecure-requests: forces HTTPS for all sub-resource loads.
    #   • frame-src / frame-ancestors: blocks embedding by default.

    # IMPORTANT: the CSP value MUST be ONE single quoted string. nginx does NOT
    # concatenate adjacent "..." fragments (unlike C) — splitting the value makes
    # add_header receive >3 arguments and nginx aborts at startup with
    # "invalid number of arguments in add_header directive". Keep it on one line.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.dataforall.tech wss://*.dataforall.tech https://*.powerbi.com https://*.analysis.windows.net wss://*.analysis.windows.net; frame-src 'self' https://app.powerbi.com https://*.analysis.windows.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # Prevent SSL-stripping attacks; 2-year max-age; pre-loaded
    add_header Strict-Transport-Security
        "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Frame-Options           "DENY"                        always;
    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy
        "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()"
        always;

    # Prevent cross-origin window.opener access (SSO popup uses same-origin-allow-popups)
    add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
    # Restrict how this resource can be loaded by cross-origin documents
    add_header Cross-Origin-Resource-Policy "same-origin"              always;

    # ── Global connection / request limits ────────────────────────────────────
    # Return 429 (not nginx's default 503) when a limiter trips: the app's API
    # contract already treats 429 as "rate limited" (TooManyRequests) and reserves
    # 503 for "backend/Redis unavailable" (which AuthContext uses to trigger a
    # fallback). Emitting 429 keeps those two conditions from being confused.
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn conn_limit 50;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api {
        # General API rate limit: 120 req/min per IP, burst 30
        limit_req zone=api_zone burst=30 nodelay;

        proxy_pass         http://host.docker.internal:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # X-Internal-Token is injected dynamically by the API gateway from
        # ADMIN_DATAFORALL.PLATFORMS.internal_token per tenant (resolved from
        # the Host header). No static token needed here — each tenant has its
        # own token in the database and the gateway handles injection per-request.

        # Strip sensitive response headers before forwarding to browser
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Refresh can be triggered concurrently by app bootstrap, route guards and
    # retry flows. Keep it out of the stricter auth_zone limiter; the gateway/auth
    # service still validates cookies and applies application-level controls.
    location ~ ^/api/v[0-9]+/auth/refresh/?$ {
        limit_req zone=refresh_zone burst=10 nodelay;

        proxy_pass         http://host.docker.internal:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    # Stricter rate limit for auth endpoints
    location ~ ^/api/v[0-9]+/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;

        proxy_pass         http://host.docker.internal:9999;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://host.docker.internal:9999;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Reduced from 86400 (24h) to 300s; clients reconnect via exponential
        # backoff in WebSocketClient. Prevents zombie/idle connections.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ── Runtime env config ────────────────────────────────────────────────────
    # env.js is regenerated at container startup by 30-runtime-env.sh.
    # No-cache headers prevent stale config after deployments.
    # NOTE: this location has its own add_header directives, so ALL security
    # headers must be repeated here (nginx does not inherit server-level headers
    # when a location defines its own).
    location = /env.js {
        # Single-string CSP (see note on the server-level directive above — nginx
        # rejects multi-fragment add_header values at startup).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.dataforall.tech wss://*.dataforall.tech https://*.powerbi.com https://*.analysis.windows.net wss://*.analysis.windows.net; frame-src 'self' https://app.powerbi.com https://*.analysis.windows.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header Strict-Transport-Security
            "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                        always;
        add_header X-Content-Type-Options    "nosniff"                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy
            "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()"
            always;
        add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin"              always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma   "no-cache" always;
        add_header Expires  "0"        always;
        try_files $uri =404;
    }

    # Never serve local env/secrets files from the static root.
    location ~ (^|/)\.(env|env\..*|git|svn|hg|aws|npmrc|yarnrc|pypirc|netrc)$ {
        return 404;
    }

    # ── Static assets — long-lived cache (hashed filenames) ──────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Repeat essential security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        # Backstop rate limit (UA-agnostic) — burst 50 absorbs a NAT of users all
        # loading the app at once; sustained ~5 req/s/IP throttles bulk crawling.
        limit_req zone=spa_zone burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

# ─── Rotas por subdominio (frontends distintos) — bring-up enxuto 2026-07-06 ──
# Cada Host serve um SPA proprio (container dedicado). O default (server_name _)
# acima continua servindo o app (platform-dataforall-frontend).
#
# HARDENING (pentest 2026-07-07): estes blocos agora aplicam NO EDGE o mesmo
# conjunto de security headers, gate anti-bot, rate-limit e supressao de Server
# do bloco do app. Antes so tinham proxy_pass e dependiam de o upstream re-emitir
# headers (F2), vazavam a versao do nginx (F6) e, no caso de sales, serviam a
# pagina default "Welcome to nginx!" (F5).

# sales.: SPA ainda nao deployada (migracao SSR/Nitro pendente). Servimos uma
# pagina de manutencao explicita em vez de proxiar para o nginx default do
# upstream. Quando a SPA subir, trocar o `return 503` do location / por:
#   proxy_pass http://platform-sales-frontend:8080;  (+ os proxy_set_header)
server {
    listen 8080;
    server_name sales.dataforall.tech;
    server_tokens off;

    if ($deny_bot) { return 403; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.dataforall.tech wss://*.dataforall.tech https://*.powerbi.com https://*.analysis.windows.net wss://*.analysis.windows.net; frame-src 'self' https://app.powerbi.com https://*.analysis.windows.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "DENY"                            always;
    add_header X-Content-Type-Options       "nosniff"                         always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups"        always;
    add_header Cross-Origin-Resource-Policy "same-origin"                     always;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn conn_limit 50;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Sem add_header proprio aqui, para herdar os headers do server acima (nginx
    # nao herda add_header quando o location define o seu).
    location / {
        limit_req zone=spa_zone burst=50 nodelay;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Em manutencao - DataForAll</title><body style="margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0f1620;color:#e7edf5;display:grid;place-items:center;min-height:100vh"><main style="text-align:center;padding:40px"><h1 style="font-weight:650;letter-spacing:-.02em;margin:0 0 .4em">Em manutencao</h1><p style="color:#9fb0c4;margin:0">Estamos preparando esta area. Volte em breve.</p></main></body>';
    }
}

# partner.: SPA real. Proxia para o container e o EDGE e a fonte unica de verdade
# dos security headers (esconde as copias do upstream para evitar duplicatas).
server {
    listen 8080;
    server_name partner.dataforall.tech;
    server_tokens off;

    if ($deny_bot) { return 403; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.dataforall.tech wss://*.dataforall.tech https://*.powerbi.com https://*.analysis.windows.net wss://*.analysis.windows.net; frame-src 'self' https://app.powerbi.com https://*.analysis.windows.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "DENY"                            always;
    add_header X-Content-Type-Options       "nosniff"                         always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups"        always;
    add_header Cross-Origin-Resource-Policy "same-origin"                     always;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn conn_limit 50;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
        limit_req zone=spa_zone burst=50 nodelay;
        proxy_pass http://platform-partner-frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        # Edge = fonte unica dos security headers: descarta as copias do upstream
        # para o browser nao receber headers duplicados (F2/F6).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}

