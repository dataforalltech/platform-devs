# platform.d4all.com.br -> platform-d4all-frontend (customer-admin; usa Stripe.js)
server {
    listen 8080;
    server_name platform.d4all.com.br;
    server_tokens off;
    if ($deny_bot) { return 403; }
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://app.powerbi.com https://*.analysis.windows.net; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "DENY"                            always;
    add_header X-Content-Type-Options       "nosniff"                         always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups"        always;
    add_header Cross-Origin-Resource-Policy "same-origin"                     always;
    limit_req_status 429; limit_conn_status 429; limit_conn conn_limit 50;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # customer-admin PRODUCT-NATIVE: o container tem nginx proprio (porta 80) que serve
    # o SPA e proxia /api -> dataforall-customer-admin:8000 injetando X-Tenant-Id +
    # X-Internal-Token (o token da PLATFORMS do tenant). O edge encaminha TUDO p/ ele.
    location / {
        limit_req zone=spa_zone burst=50 nodelay;
        proxy_pass http://platform-d4all-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}
