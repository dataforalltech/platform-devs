# docker-compose.subfrontends.yml — SPAs por subdominio (frontends distintos), atras da borda.
# A borda (dataforall-frontend) roteia por server_name: sales.dataforall.tech -> platform-sales-frontend,
# partner.dataforall.tech -> platform-partner-frontend. Ambos na platform-local; a borda tambem.
#
# ATENCAO (2026-07-06):
#  - platform-partner-frontend (repo platform-sales-partners-frontend): SPA estatico OK.
#  - platform-sales-frontend (repo dataforall-sales-frontend): e TanStack Start + Nitro (SSR),
#    NAO um SPA estatico. Servido por nginx estatico ele mostra o index default. Deploy correto
#    exige rodar o servidor Nitro (Node), nao nginx estatico -> PENDENTE (ver HANDOFF S3).
#
#   docker compose -f docker-compose.subfrontends.yml --env-file /opt/dataforall/deploy/.env up -d
name: dataforall-subfrontends

networks:
  platform-local:
    external: true

services:
  platform-sales-frontend:
    image: d4all.azurecr.io/dataforall/3.0/platform-sales-frontend:${FRONTEND_TAG:-latest}
    container_name: platform-sales-frontend
    networks: [platform-local]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      VITE_APP_ENV: cloud
      VITE_ENABLE_TENANT_SELECTOR: "false"
      VITE_ENABLE_PLATFORM_WS: "true"
      VITE_ENABLE_USER_PROFILE_WS: "true"
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  platform-partner-frontend:
    image: d4all.azurecr.io/dataforall/3.0/platform-partner-frontend:${FRONTEND_TAG:-latest}
    container_name: platform-partner-frontend
    networks: [platform-local]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      VITE_APP_ENV: cloud
      VITE_ENABLE_TENANT_SELECTOR: "false"
      VITE_ENABLE_PLATFORM_WS: "true"
      VITE_ENABLE_USER_PROFILE_WS: "true"
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
