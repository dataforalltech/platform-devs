# Grafana Tempo — armazenamento de traces (single-binary, storage local).
# PROD com volume grande: considere backend S3 no bloco storage.trace.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h   # 7 dias
