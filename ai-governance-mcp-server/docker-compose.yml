# docker-compose.yml — exercício local da imagem (sidecar mcp_http, Model C).
#
# NÃO é o modo de uso primário: em produção o container roda na rede do
# platform-mcp-gateway, que fala HTTP em /mcp/tools/* (ver gateway/ e OPERATIONS).
#
# Este compose serve para:
# - Validar que `docker build` produziu uma imagem que sobe e responde no /v1/health.
# - Smoke local sem precisar configurar client.
#
# Uso (o build context é a RAIZ do repo — o Dockerfile copia ai-governance-mcp-server/...):
#   docker compose -f ai-governance-mcp-server/docker-compose.yml up --build
#   curl http://localhost:7100/v1/health

services:
  mcp:
    build:
      context: ..
      dockerfile: ai-governance-mcp-server/Dockerfile
    image: ai-governance-mcp-server:local
    environment:
      MCP_PORT: "7100"
      DOCS_ENABLED: "false"
      GOVERNANCE_LOG_LEVEL: DEBUG
      GOVERNANCE_LOG_FORMAT: json
      # HTTP-only p/ o exercício local (sem stdio); o gateway usa este mesmo modo.
      MCP_HTTP_ONLY: "1"
    ports:
      - "7100:7100"
    volumes:
      # Persiste sugestões fora do container entre execuções.
      - ./knowledge-base/suggestions:/app/knowledge-base/suggestions:rw
