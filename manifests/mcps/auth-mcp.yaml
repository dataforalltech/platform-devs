schema_version: 1
id: auth-mcp
display_name: Authentication MCP
description: Domain-owned authentication provider; implementation remains in platform-auth.
status: experimental
classification: {type: domain, capability_domain: identity}
ownership:
  team: identity
  source_repo: dataforalltech/platform-auth
  source_path: mcp
  # `services/auth-mcp-server` NÃO existe em disco (services/ tem só o
  # cache-mcp-server). O caminho fantasma fazia a auditoria emitir uma SEGUNDA
  # entrada id=auth-mcp, zerada em todas as colunas, inflando a contagem de
  # superfícies da frota com um provedor que não existe.
  # O que resta em `auth-mcp-server/` é espelho legado e não é o MCP: são o
  # Authorization Server OAuth (authorization_server.py, oidc_upstream.py). O MCP
  # canônico vive em dataforalltech/platform-auth, sob `source_path: mcp`.
  legacy_source_paths: [auth-mcp-server]
runtime: {mode: external, language: python, version: "3.12", base_url_env: AUTH_MCP_URL, exposes_tools: true}
transport:
  stdio: false
  http: true
  canonical_http: {health_live: /v1/health/live, health_ready: /v1/health/ready, tools_list: /mcp/tools/list, tools_call: /mcp/tools/call}
network: {}
security: {auth_required: true, tenant_required: true, policy_mode: fail_closed, audit_required: true, secret_redaction_required: true, context_signing_required: true}
ci: {enabled: false, coverage_threshold: 80, lint: true, type_check: true, docker_build: true, smoke_test: true}
gateway: {enabled: false}
registry: {enabled: false}
dependencies: []
