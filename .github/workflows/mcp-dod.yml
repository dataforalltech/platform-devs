# Gate de CI do "Definition of Done" (DoD) dos MCPs — MCP_SERVICE_STANDARD.md §11.
#
# Tres passos:
#   1. Gate ESTATICO (scripts/check_mcp_dod.py): impoe os criterios do §11 em cada MCP migrado.
#   2. E2E do piloto (tests/e2e/test_oauth_security_pilot.py): auth-mcp emite token -> Security valida.
#   3. Testes do gateway (pytest em mcp-gateway/tests).
#
# Gotcha de shadow: a raiz do repo tem pastas `mcp/` e `src/` que SOMBREIAM o SDK `mcp`
# instalado via pip e o pacote `src` do gateway. Por isso:
#   - o E2E NAO usa working-directory (ele resolve paths a partir de __file__ e cuida do shadow);
#   - o pytest do gateway roda A PARTIR de mcp-gateway/ (working-directory), onde `src` = o do gateway.

name: MCP Definition of Done

on:
  pull_request:
  push:
    branches: [develop, main]

env:
  PYTHONIOENCODING: utf-8

jobs:
  mcp-dod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instala dependencias minimas
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.10" fastapi "uvicorn[standard]" python-multipart pyjwt cryptography bcrypt pytest pytest-asyncio pyyaml psycopg2-binary redis httpx

      # O gate estático §11 (scripts/check_mcp_dod.py) cobrava o padrão FastMCP/OAuth-PRM
      # APOSENTADO — classificava os servers Model-C como "legado" e passava vazio. Retirado.
      # DoD real hoje: Test Doubles Policy + audience-guard (ci.yml) + E2E Model-C + gateway.
      - name: Passo 1 - Test Doubles Policy (STD-QA-001, sem bypass de auth)
        run: python scripts/check_test_doubles.py

      - name: Passo 2 - E2E Model-C (Security sidecar + Authorization Server)
        run: python tests/e2e/test_oauth_security_pilot.py

      - name: Passo 3 - Testes do gateway
        working-directory: mcp-gateway
        run: python -m pytest tests -q
