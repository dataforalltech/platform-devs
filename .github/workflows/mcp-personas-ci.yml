# CI das personas MCP (sidecars mcp_http, Model C) — STD-CICD-001 / STD-QA-001 / STD-MCP-001.
# lint-mcp (ruff+black) + test-mcp (pytest --cov=src --cov-fail-under=80) + audience-guard.
# NOTA STD-CICD-001: actions de terceiros DEVEM ser pinadas por SHA (aqui em tag por brevidade).
name: mcp-personas-ci

on:
  pull_request:
    paths:
      - "*-mcp-server/**"
      - "scripts/ci_assert_audience.py"
      - ".github/workflows/mcp-personas-ci.yml"
  push:
    branches: [develop, main]

jobs:
  lint-test-mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - architecture-mcp-server
          - backend-mcp-server
          - devops-mcp-server
          - frontend-mcp-server
          - product-manager-mcp-server
          - product-owner-mcp-server
          - qa-engineer-mcp-server
          - security-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (${{ matrix.server }})
        working-directory: ${{ matrix.server }}
        run: pip install -e ".[dev]"
      - name: lint-mcp — ruff + black
        working-directory: ${{ matrix.server }}
        run: |
          ruff check src tests
          black --check src tests
      - name: types — mypy (advisory por ora; STD-CICD-001 exige bloqueante)
        working-directory: ${{ matrix.server }}
        run: mypy src || true
      - name: test-mcp — pytest cov>=80%
        working-directory: ${{ matrix.server }}
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80

  audience-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ci-assert-audience (STD-MCP-001 — trava 401 audience mismatch)
        run: python scripts/ci_assert_audience.py
