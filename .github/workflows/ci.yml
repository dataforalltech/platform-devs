name: CI

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '*-mcp-server/gateway/**'
      - 'scripts/ci_assert_audience.py'
      - '.github/workflows/ci.yml'
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '*-mcp-server/gateway/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test all servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [
          # system-MCPs (12)
          session-mcp-server,
          test-mcp-server,
          docs-mcp-server,
          services-mcp-server,
          pipeline-mcp-server,
          qa-mcp-server,
          deploy-mcp-server,
          dev-twin-mcp-server,
          config-mcp-server,
          infra-mcp-server,
          ai-governance-mcp-server,
          audit-mcp-server,
          # personas (8)
          architecture-mcp-server,
          backend-mcp-server,
          devops-mcp-server,
          frontend-mcp-server,
          product-manager-mcp-server,
          product-owner-mcp-server,
          qa-engineer-mcp-server,
          security-mcp-server
        ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install server dependencies
        run: |
          cd ${{ matrix.server }}
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: |
          cd ${{ matrix.server }}
          ruff check .
          ruff format . --check
      
      - name: Type check with mypy (bloqueante — STD-CICD-001)
        run: |
          cd ${{ matrix.server }}
          mypy src/

      - name: Run tests
        run: |
          cd ${{ matrix.server }}
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      
      - name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          files: ./${{ matrix.server }}/coverage.xml
          flags: ${{ matrix.server }}

  test-typescript:
    name: Test TypeScript servers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [
          frontend-pixelfera-mcp-server
        ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.server }}/package-lock.json'

      - name: Install dependencies
        run: |
          cd ${{ matrix.server }}
          npm ci

      - name: Lint with ESLint
        run: |
          cd ${{ matrix.server }}
          npm run lint

      - name: Type check with TypeScript
        run: |
          cd ${{ matrix.server }}
          npm run type-check

      - name: Run tests
        run: |
          cd ${{ matrix.server }}
          npm test

      - name: Build
        run: |
          cd ${{ matrix.server }}
          npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'

      - name: Run bandit
        run: |
          pip install bandit
          bandit -r shared/ -f json || true

  # Trava 401 por audiência divergente (STD-MCP-001): NAMESPACE em settings.py ==
  # audience no gateway/twin-gateway-services.entry.json == mcp:<ns> no gateway-mapping.sql.
  audience-guard:
    name: Audience guard (STD-MCP-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: ci-assert-audience (20 servers)
        run: python scripts/ci_assert_audience.py

  # Prova que o registro DECLARATIVO no banco (gateway-mapping.sql) EXECUTA de fato
  # contra um MySQL efêmero — 2x, para provar idempotência (schema guard + ON DUPLICATE KEY).
  db-register:
    name: DB register (gateway-mapping idempotente)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpw
          MYSQL_DATABASE: ADMIN_DATAFORALL
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpw"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: base GATEWAY_MAPPING (mínima; colunas mcp_http vêm do próprio .sql)
        run: |
          mysql -h 127.0.0.1 -uroot -ptestpw ADMIN_DATAFORALL -e "
            CREATE TABLE IF NOT EXISTS GATEWAY_MAPPING (
              id INT AUTO_INCREMENT PRIMARY KEY,
              name_microservice VARCHAR(255) NOT NULL UNIQUE,
              internal_url VARCHAR(500) NULL,
              health_path VARCHAR(255) DEFAULT '/api/health/ready',
              timeout_seconds FLOAT DEFAULT 30,
              additional_info JSON NULL,
              created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
              updated_at DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
            );"
      - name: executa cada gateway/gateway-mapping.sql (2x = idempotência)
        run: |
          shopt -s nullglob
          found=0
          for f in */gateway/gateway-mapping.sql; do
            found=1
            echo "== aplica $f =="
            mysql -h 127.0.0.1 -uroot -ptestpw ADMIN_DATAFORALL < "$f"
            mysql -h 127.0.0.1 -uroot -ptestpw ADMIN_DATAFORALL < "$f"
          done
          [ "$found" = 1 ] || { echo "nenhum gateway-mapping.sql encontrado"; exit 1; }
      - name: rotas mcp_http registradas
        run: |
          mysql -h 127.0.0.1 -uroot -ptestpw ADMIN_DATAFORALL -e \
            "SELECT name_microservice,kind,mcp_url,call_style FROM GATEWAY_MAPPING WHERE kind='mcp_http' ORDER BY name_microservice;"
