[project]
name = "infra-mcp"
version = "0.1.0"
description = "MCP sidecar (kind=mcp_http, Model C) do infra — operações de infraestrutura (terraform, policy scan, cost estimate) e alocação de VMs (allocator SQLite embarcado), gateway-ready. Read+write: além das tools de leitura, expõe tools de mutação do allocator (request_vm, release_lease, extend_lease, cancel_queued_request, get_lease_ssh_key)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dataforalltech platform team" }]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # requerido pelo fastapi.testclient
    "ruff==0.15.12",
    "black>=24.0",
    "mypy==2.2.0",
]

[project.scripts]
infra-mcp = "src.server.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# Desvios justificados p/ um sidecar backend-backed (infra opera CLIs via subprocess
# e persiste o allocator em SQLite embarcado) — diferente da persona compute-only:
#   S104 — bind 0.0.0.0: ingress só via gateway (INV-1), justificado no código.
#   S603/S607 — subprocess de comandos fixos (terraform/checkov/infracost), sem shell.
#   S608 — SQL "dinâmico" só concatena fragmentos estáticos; valores via ? (parametrizado).
#   S110 — try/except/pass best-effort (falha de parse não derruba a operação).
ignore = ["S104", "S603", "S607", "S608", "S110"]

[tool.ruff.lint.per-file-ignores]
# S101 assert em testes; S105/S106 tokens/senhas fake em test doubles (sem I/O real).
"tests/*" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/**/__init__.py"]
