apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/setup_repo
  uid: delivery.setup_repo
  domain: delivery
  title: setup repo
  description: 'Configura um repositório para deploy automático no ACR. Propaga as
    credenciais ACR do deploy-mcp como GitHub Actions secrets no repo alvo — elimina
    configuração manual por repo.


    Secrets definidos: ACR_USERNAME, ACR_PASSWORD (+ PORTAINER_WEBHOOK_URL e TOKEN_GITHUB
    se informados).

    Variável definida: IMAGE_NAME.


    Após setup_repo, dispare trigger_workflow(workflow_id=''deploy.yml'') para buildar
    e enviar a imagem.'
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: setup
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
          description: Nome do repo (owner/name ou só name — usa DEPLOY_GITHUB_ORG).
        image_name:
          type: string
          description: 'Nome da imagem Docker no ACR (ex: platform-analytics).'
        portainer_webhook:
          type: string
          description: URL do webhook do Portainer para este repo (opcional).
        github_token:
          type: string
          description: PAT para builds com dependências privadas (opcional).
      required:
      - repo
      - image_name
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:repository
