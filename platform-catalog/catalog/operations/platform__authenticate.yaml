apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/authenticate
  uid: platform.authenticate
  domain: platform
  title: authenticate
  description: PRIMEIRA tool por sessão. Valida TWIN_TOKEN, carrega perfil (nome,
    role, escopos, ambiente). Sem authenticate(), whoami() e get_twin_context() falham.
  owner: platform
  tags:
  - platform
  - identity
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: authenticate
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        token:
          type: string
          description: Token do usuário/agente (TWIN_TOKEN do ambiente).
      required:
      - token
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:token
