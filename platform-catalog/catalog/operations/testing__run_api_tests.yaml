apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/run_api_tests
  uid: testing.run_api_tests
  domain: testing
  title: run api tests
  description: Testa endpoints HTTP com verificação de status e chaves de resposta.
    Suporta GET, POST, PUT, DELETE com headers e body customizados.
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: run
  authz: write
  risk:
    effects:
    - execute
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        base_url:
          type: string
          description: 'URL base da API (ex: http://localhost:8000)'
        endpoints:
          type: array
          description: Lista de endpoints a testar
          items:
            type: object
            properties:
              path:
                type: string
              method:
                type: string
              headers:
                type: object
              body:
                type: object
              expect_status:
                type: integer
              expect_keys:
                type: array
                items:
                  type: string
            required:
            - path
        timeout:
          type: number
          description: Timeout HTTP em segundos
      required:
      - base_url
      - endpoints
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
