apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_acr_images
  uid: delivery.list_acr_images
  domain: delivery
  title: list acr images
  description: Lista as tags disponíveis de uma imagem no ACR, ordenadas por data
    (mais recente primeiro). Útil para verificar quais versões estão publicadas antes
    de um rollback ou deploy.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: deployment
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service_name:
          type: string
          description: 'Nome do serviço/imagem (ex: platform-analytics).'
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: 'Máximo de tags a retornar. Default: 20.'
          default: 20
      required:
      - service_name
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:deployment
