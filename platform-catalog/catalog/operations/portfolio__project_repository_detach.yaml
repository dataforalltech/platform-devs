apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/project_repository_detach
  uid: portfolio.project_repository_detach
  domain: portfolio
  title: project repository detach
  description: Soft-detach a repository binding after approval and version validation.
  owner: platform-engineering
  tags:
  - portfolio
  - repository-binding
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: repository-binding
    parent: null
    namespace: null
  operation: detach
  authz: write
  risk:
    effects:
    - delete
    requires:
    - approval:N2
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs: {}
    outputs: {}
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:repository-binding
