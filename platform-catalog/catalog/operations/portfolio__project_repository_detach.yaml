apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/project_repository_detach
  uid: portfolio.project_repository_detach
  domain: portfolio
  title: project repository detach
  description: Soft-detach a repository binding after approval and version validation.
  owner: platform-engineering
  tags:
  - portfolio
  - repository-binding
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: repository-binding
    parent: null
    namespace: null
  operation: detach
  authz: write
  risk:
    effects:
    - delete
    requires:
    - approval:N2
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        binding_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        expected_version:
          type: integer
          minimum: 1
      required:
      - idempotency_key
      - binding_id
      - expected_version
    outputs:
      type: object
      additionalProperties: false
      properties:
        binding_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        detached:
          const: true
      required:
      - binding_id
      - detached
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:repository-binding
