apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/list_audits
  uid: governance.list_audits
  domain: governance
  title: list audits
  description: Lista auditorias de conformidade persistidas, com filtros opcionais
    por status, ambiente e serviço e limite de resultados.
  owner: platform
  tags:
  - governance
  - audit
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: audit
  resource:
    type: audit
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        status:
          type: string
          description: Filtro por status
        env:
          type: string
          description: Filtro por ambiente
        service:
          type: string
          description: Filtro por serviço
        limit:
          type: integer
          description: 'Limite de resultados (default: 50)'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:audit
