apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: provenance/provenance_hash_artifact
  uid: provenance.provenance_hash_artifact
  domain: provenance
  title: hash repository artifact
  description: Compute SHA-256 and Git provenance for one non-sensitive repository
    artifact.
  owner: security
  tags:
  - provenance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: provenance
  capability: artifact-provenance
  resource:
    type: artifact
    parent: null
    namespace: null
  operation: hash
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: workspace
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - path
    outputs:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          minimum: 0
        git_tracked:
          type: boolean
        git_status:
          type: string
        repository_head:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{40,64}$
          - type: 'null'
      required:
      - path
      - sha256
      - size_bytes
      - git_tracked
      - git_status
      - repository_head
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:artifact
