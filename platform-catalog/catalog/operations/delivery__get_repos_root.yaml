apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_repos_root
  uid: delivery.get_repos_root
  domain: delivery
  title: get repos root
  description: 'Retorna o caminho resolvido de REPOS_ROOT e quantos repos existem
    la. Resolucao: argumento > DEPLOY_REPOS_ROOT > REPOS_ROOT > config-mcp workspace
    > auto-detect. Use para descobrir onde os repos estao antes de clonar ou listar.'
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        explicit:
          type: string
          description: Caminho explicito a usar (sobrepoe todas as outras fontes).
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:repository
