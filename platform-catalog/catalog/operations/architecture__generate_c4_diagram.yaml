apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: architecture/generate_c4_diagram
  uid: architecture.generate_c4_diagram
  domain: architecture
  title: generate c4 diagram
  description: Gera um diagrama C4 em Mermaid (context|container|component) determinístico
    a partir da spec.
  owner: platform
  tags:
  - architecture
  - architecture
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: architecture
  capability: architecture
  resource:
    type: architecture
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
          description: 'Nível: context|container|component.'
        elements:
          type: array
          description: Elementos [{name,type?,technology?,description?,id?}] ou nomes
            (str).
        relations:
          type: array
          description: Relações [{from,to,text?,technology?}] ou 'A -> B' (opcional).
        title:
          type: string
          description: Título do diagrama (opcional).
      required:
      - level
      - elements
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:architecture
