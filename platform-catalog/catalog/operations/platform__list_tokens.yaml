apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/list_tokens
  uid: platform.list_tokens
  domain: platform
  title: list tokens
  description: Admin — Lista metadados de usuários/tokens (sem exibir valores). Requer
    TWIN_ADMIN_TOKEN.
  owner: platform
  tags:
  - platform
  - identity
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        admin_token:
          type: string
        include_revoked:
          type: boolean
          description: 'Incluir tokens revogados. Default: false.'
          default: false
      required:
      - admin_token
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:token
