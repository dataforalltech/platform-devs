apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/visual_regression
  uid: testing.visual_regression
  domain: testing
  title: visual regression
  description: Compara screenshot atual com baseline via Pillow. Cria baseline se
    não existir. Retorna diff em % de pixels.
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: visual
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
        baseline_name:
          type: string
          description: Nome do baseline (sem extensão)
        viewport:
          type: string
          enum:
          - desktop
          - tablet
          - mobile
          default: desktop
        threshold_pct:
          type: number
          description: '% máximo de pixels diferentes para passar'
          default: 2.0
        update_baseline:
          type: boolean
          description: Se True, salva novo baseline
          default: false
      required:
      - url
      - baseline_name
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
