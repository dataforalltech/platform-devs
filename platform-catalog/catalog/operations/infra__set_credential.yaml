apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/set_credential
  uid: infra.set_credential
  domain: infra
  title: set credential
  description: Define (cria ou atualiza) uma credencial no store central. O valor
    é armazenado encriptado com Fernet.
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: credential
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        namespace:
          type: string
          description: 'Ex: ''credentials.acr'', ''credentials.github'', ''credentials.portainer''.'
        key:
          type: string
          description: Nome da variável.
        value:
          type: string
          description: Valor da credencial (será encriptado).
        description:
          type: string
          description: Descrição opcional para documentação.
      required:
      - namespace
      - key
      - value
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:credential
