apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_pr
  uid: delivery.get_pr
  domain: delivery
  title: get pr
  description: 'Retorna detalhes de um PR: estado, mergeable_state, check runs (CI
    status) e informações de review.'
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        pr_number:
          type: integer
          description: Número do PR.
      required:
      - repo
      - pr_number
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:pull_request
