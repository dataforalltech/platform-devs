apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/request_vm
  uid: infra.request_vm
  domain: infra
  title: request vm
  description: 'Solicita capacidade ao allocator. Servidor decide entre lease em VM
    existente (compartilhamento), provisão de nova, fila ou denial. Spec restrita
    à whitelist (cpu-small/medium/large). gpu-a100 e high-mem exigem uma aprovação
    verificada pelo gateway. Phase 2c: provisão via terraform real (INFRA_TF_MODULES_ROOT).
    Lease inicia PENDING e vai ACTIVE quando VM fica READY. Use get_lease(lease_id)
    para verificar connection_hint (endpoint SSH).'
  owner: platform
  tags:
  - infra
  - provisioning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: request
  authz: write
  risk:
    effects:
    - write
    requires:
    - terraform
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        spec:
          type: string
          enum:
          - cpu-small
          - cpu-medium
          - cpu-large
          - high-mem
          - gpu-a100
        duration_min:
          type: integer
          minimum: 1
          maximum: 4320
        owner:
          type: string
          description: Identificador do agente.
        exclusive:
          type: boolean
          default: false
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          default: low
        purpose:
          type: string
          description: Descrição curta para audit.
      required:
      - spec
      - duration_min
      - owner
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:vm
