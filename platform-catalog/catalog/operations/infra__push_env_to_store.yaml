apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/push_env_to_store
  uid: infra.push_env_to_store
  domain: infra
  title: push env to store
  description: Le um arquivo .env do disco e importa as variaveis para o ConfigStore
    encriptado no namespace env.<environment>.
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: environment
    parent: null
    namespace: null
  operation: push
  authz: write
  risk:
    effects:
    - write
    - external_api
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - path
      - environment
      additionalProperties: false
      properties:
        path:
          type: string
          description: Caminho do arquivo .env a importar.
        environment:
          type: string
          description: 'Perfil de ambiente destino (ex: ''dev'', ''local'').'
        overwrite:
          type: boolean
          default: false
          description: 'Sobrescrever vars ja existentes no store. Default: false.'
        secrets_only:
          type: boolean
          default: false
          description: 'Importar apenas vars identificadas como secrets. Default:
            false.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:environment
