apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/list_tasks
  uid: platform.list_tasks
  domain: platform
  title: list tasks
  description: 'Lista as tarefas de uma sessão, opcionalmente filtrando por status.
    Estados possíveis: pending | in_progress | completed | failed | cancelled.'
  owner: platform
  tags:
  - platform
  - session
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: task
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: ID da sessão
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          - cancelled
          description: Filtrar por status
      required:
      - session_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:task
