apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_prs
  uid: delivery.list_prs
  domain: delivery
  title: list prs
  description: Lista Pull Requests de um repositório com filtros opcionais.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        state:
          type: string
          enum:
          - open
          - closed
          - all
          description: 'Estado dos PRs. Default: open.'
          default: open
        base:
          type: string
          description: 'Filtrar por branch de destino (ex: main, develop).'
        author:
          type: string
          description: Filtrar por login do autor.
      required:
      - repo
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:pull_request
