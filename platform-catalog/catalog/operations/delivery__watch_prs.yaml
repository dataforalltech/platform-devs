apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/watch_prs
  uid: delivery.watch_prs
  domain: delivery
  title: watch prs
  description: 'Escaneia PRs abertas nos repos registrados no pipeline. PRs targeting
    ''develop'': auto-aprova e mergia se gates passam (DEV — autonomia total). PRs
    targeting ''homol'' ou ''main'': lista para aprovação humana sem tocar. Configure
    PIPELINE_GITHUB_TOKEN e PIPELINE_GITHUB_ORG para usar.'
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: watch
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repos:
          type: array
          items:
            type: string
          description: 'Repos específicos a verificar. Default: todos os registrados.'
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pull_request
