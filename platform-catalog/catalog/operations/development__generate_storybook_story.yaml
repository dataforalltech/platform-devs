apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_storybook_story
  uid: development.generate_storybook_story
  domain: development
  title: generate storybook story
  description: Gera uma story do Storybook (CSF3) determinística a partir do componente
    e variantes.
  owner: platform
  tags:
  - development
  - frontend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: frontend
  resource:
    type: user_story
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        component:
          type: string
          description: Componente-alvo da story.
        variants:
          type: array
          description: 'Variantes: nomes ou [{name,args?}] (opcional).'
      required:
      - component
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:user_story
