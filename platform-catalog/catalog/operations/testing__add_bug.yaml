apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/add_bug
  uid: testing.add_bug
  domain: testing
  title: add bug
  description: 'Registra um BUG no banco vinculado a um plano de teste. USE ESTA TOOL
    sempre que encontrar um bug, erro, falha ou comportamento inesperado. Bugs críticos
    bloqueiam a aprovação do plano (double_check retorna BLOQUEADO). Severidades:
    critical (sistema inoperante) | high (funcionalidade quebrada) | medium (degradação)
    | low (cosmético).'
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: bug
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_id:
          type: string
          description: ID do plano de teste ao qual o bug pertence
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          description: critical=sistema parado | high=funcionalidade quebrada | medium=degradação
            | low=cosmético
        title:
          type: string
          description: Título curto e descritivo do bug
        description:
          type: string
          description: 'Descrição detalhada: passos para reproduzir, esperado vs atual'
        evidence:
          type: string
          description: Log, screenshot, stack trace ou link para evidência
      required:
      - plan_id
      - severity
      - title
      - description
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:bug
