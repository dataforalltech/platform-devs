apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/search_logs
  uid: infra.search_logs
  domain: infra
  title: search logs
  description: 'Busca por padrao regex nos logs recentes de um servico. Varre as ultimas
    N linhas e retorna apenas as que batem com o padrao. lines: quantas linhas vasculhar
    antes de filtrar (default 500). since: restringe a janela temporal (opcional).'
  owner: platform
  tags:
  - infra
  - service-registry
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: search
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - name
      - pattern
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nome do servico no registry.
        pattern:
          type: string
          description: Padrao regex a buscar nos logs (case-insensitive).
        lines:
          type: integer
          default: 500
          description: 'Janela de linhas a vasculhar. Default: 500.'
        since:
          type: string
          description: 'Janela de tempo: ''30m'', ''1h'', ''5s'' ou ISO 8601. Opcional.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:service
