apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/set_pipeline_config
  uid: delivery.set_pipeline_config
  domain: delivery
  title: set pipeline config
  description: 'Configura quais gates são obrigatórios por ambiente para um serviço.
    Substitui a configuração padrão (homol: [qa_tests, pr_approved]; prod: [qa_tests,
    security_scan, pr_approved, health_check]).'
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pipeline
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        gates_required:
          type: object
          description: 'Mapa de ambiente → lista de gates obrigatórios. Ex: {"homol":
            ["qa_tests"], "prod": ["qa_tests", "pr_approved"]}'
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - service
      - gates_required
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pipeline
