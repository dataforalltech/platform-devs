apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/cost_estimate_infracost
  uid: infra.cost_estimate_infracost
  domain: infra
  title: cost estimate infracost
  description: 'Roda `infracost diff --path <tfplan> --format json` e devolve delta
    mensal de custo. Marca hard_stop=True se delta > threshold (default +US$ 100/mês
    ou +20%, conforme cicd-deploy.md §4 #4).'
  owner: platform
  tags:
  - infra
  - provisioning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: infra
    parent: null
    namespace: null
  operation: cost
  authz: read
  risk:
    effects:
    - read
    requires:
    - terraform
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_path:
          type: string
        delta_usd_threshold:
          type: number
          default: 100.0
        delta_pct_threshold:
          type: number
          default: 20.0
      required:
      - plan_path
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:infra
