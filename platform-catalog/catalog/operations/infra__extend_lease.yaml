apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/extend_lease
  uid: infra.extend_lease
  domain: infra
  title: extend lease
  description: 'Estende a validade de um lease ativo. Cap absoluto: 24h totais e no
    máximo 3 extensões por lease.'
  owner: platform
  tags:
  - infra
  - provisioning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: extend
  authz: write
  risk:
    effects:
    - write
    requires:
    - terraform
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        lease_id:
          type: string
        additional_min:
          type: integer
          minimum: 1
          maximum: 720
      required:
      - lease_id
      - additional_min
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:vm
