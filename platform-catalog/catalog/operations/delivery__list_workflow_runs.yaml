apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_workflow_runs
  uid: delivery.list_workflow_runs
  domain: delivery
  title: list workflow runs
  description: Lista runs recentes de workflows. Use após trigger_workflow para encontrar
    o run_id do dispatch.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: workflow
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        workflow_id:
          type: string
          description: 'Filtrar por workflow (arquivo ou ID). Default: todos.'
        branch:
          type: string
          description: Filtrar por branch.
        status:
          type: string
          enum:
          - queued
          - in_progress
          - completed
          - success
          - failure
          - cancelled
          description: Filtrar por status.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: 'Máximo de runs. Default: 10.'
          default: 10
      required:
      - repo
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:workflow
