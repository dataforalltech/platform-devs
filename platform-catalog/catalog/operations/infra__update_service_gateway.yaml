apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/update_service_gateway
  uid: infra.update_service_gateway
  domain: infra
  title: update service gateway
  description: Atualizaas URLs de gateway (internal_url e external_url) de um servico
    no banco. Se internal_url naoo fornecida, derivado nome do container. Se external_url
    naoo fornecida, derivade host:port. Com probe=true, testaas URLs antes de salvar
    e marcao status.
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: gate
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        name:
          type: string
          description: Nome do servico.
        internal_url:
          type: string
          description: 'URL internaDocker (ex: http://container-name:7100).'
        external_url:
          type: string
          description: 'URL externaacessivel do host (ex: http://localhost:27101).'
        host:
          type: string
          description: Host externo.
        port:
          type: integer
          description: Portaexterna.
        probe:
          type: boolean
          default: true
          description: Testar URLs antes de salvar.
      required:
      - name
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:gate
