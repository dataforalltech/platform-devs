apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: security/generate_security_controls
  uid: security.generate_security_controls
  domain: security
  title: generate security controls
  description: Gera uma matriz de controles de segurança (controles × assets) determinística
    a partir da spec.
  owner: platform
  tags:
  - security
  - app-security
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: security
  capability: app-security
  resource:
    type: security_artifact
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        framework:
          type: string
          description: Framework de referência (nist_csf/iso_27001/cis/...).
        assets:
          type: array
          description: Assets [str | {name}] que compõem as colunas (opcional).
        controls:
          type: array
          description: Controles [{key|control_key,name?,category?,framework_ref?,applies_to?}].
      required:
      - framework
      - controls
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:security_artifact
