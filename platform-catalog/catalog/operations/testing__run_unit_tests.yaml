apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/run_unit_tests
  uid: testing.run_unit_tests
  domain: testing
  title: run unit tests
  description: Roda testes unitários (pytest/jest) com cobertura opcional. Detecta
    framework automaticamente.
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: run
  authz: write
  risk:
    effects:
    - execute
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
        framework:
          type: string
          enum:
          - auto
          - pytest
          - jest
          default: auto
        test_path:
          type: string
          default: .
        coverage:
          type: boolean
          default: false
        timeout:
          type: integer
          description: Timeout em segundos
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
