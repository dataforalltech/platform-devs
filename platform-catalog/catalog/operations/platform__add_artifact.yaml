apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/add_artifact
  uid: platform.add_artifact
  domain: platform
  title: add artifact
  description: 'Registra um artefato ou evento relevante na sessão. Tipos: file_changed,
    file_created, file_deleted, decision, tool_call, error, note.'
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        artifact_type:
          type: string
          enum:
          - file_changed
          - file_created
          - file_deleted
          - decision
          - tool_call
          - error
          - note
          description: Tipo do artefato
        content:
          type: string
          description: Conteúdo do artefato (caminho do arquivo, descrição da decisão,
            etc.)
      required:
      - session_id
      - artifact_type
      - content
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:session
