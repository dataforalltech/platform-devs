apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/product_delete
  uid: portfolio.product_delete
  domain: portfolio
  title: product delete
  description: Soft-delete an empty product after an approved, version-checked request.
  owner: platform-engineering
  tags:
  - portfolio
  - product
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: product
    parent: null
    namespace: null
  operation: delete
  authz: write
  risk:
    effects:
    - delete
    requires:
    - approval:N2
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs: {}
    outputs: {}
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:product
