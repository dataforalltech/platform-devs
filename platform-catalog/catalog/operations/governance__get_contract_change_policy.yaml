apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/get_contract_change_policy
  uid: governance.get_contract_change_policy
  domain: governance
  title: get contract change policy
  description: Regras + checklist + testes obrigatórios para mudança de contrato.
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        provider_service:
          type: string
        consumer_services:
          type: array
          items:
            type: string
        contract_type:
          type: string
          enum:
          - api
          - event
          - database
          - file
          - schema
        proposed_change:
          type: string
      required:
      - provider_service
      - contract_type
      - proposed_change
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
