apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/whoami
  uid: platform.whoami
  domain: platform
  title: whoami
  description: 'Retorna o usuário autenticado na sessão: user_id, name, email, role,
    scopes, environment, authenticated_at. Requer authenticate() anterior.'
  owner: platform
  tags:
  - platform
  - identity
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: whoami
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties: {}
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:token
