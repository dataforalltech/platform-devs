apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: contracts/contracts_list
  uid: contracts.contracts_list
  domain: contracts
  title: list governed MCP contracts
  description: List canonical governed tool contracts with optional filters.
  owner: platform-engineering
  tags:
  - contracts
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: contracts
  capability: contract-governance
  resource:
    type: contract
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - active
          - disabled
    outputs:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        contracts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              provider_id:
                type: string
              name:
                type: string
              description:
                type: string
              status:
                type: string
                enum:
                - active
                - disabled
              required_scope:
                type: string
              mutating:
                type: boolean
              risk:
                type: object
              secret_reference_only:
                type: boolean
              input_schema:
                type: object
              output_schema:
                type: object
            required:
            - provider_id
            - name
            - description
            - status
            - required_scope
            - mutating
            - risk
            - secret_reference_only
            - input_schema
            - output_schema
      required:
      - count
      - contracts
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:contract
