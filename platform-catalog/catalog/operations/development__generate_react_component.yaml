apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_react_component
  uid: development.generate_react_component
  domain: development
  title: generate react component
  description: Gera um componente React (TSX) determinístico a partir de name/props/hooks.
  owner: platform
  tags:
  - development
  - frontend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: frontend
  resource:
    type: frontend_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nome do componente.
        props:
          type: array
          description: 'Props: nomes ou [{name,type?,optional?}] (opcional).'
        hooks:
          type: array
          description: 'Hooks a incluir (ex.: useState, useEffect; opcional).'
      required:
      - name
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:frontend_artifact
