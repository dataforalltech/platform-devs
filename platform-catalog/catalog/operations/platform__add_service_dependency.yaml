apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/add_service_dependency
  uid: platform.add_service_dependency
  domain: platform
  title: add service dependency
  description: Vincula serviço auxiliar à sessão. service = nome canônico do services-mcp;
    role classifica o papel (database, cache, auth).
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: service
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: ID da sessão
        service:
          type: string
          description: Nome canônico do serviço no services-mcp
        role:
          type: string
          description: 'Papel do serviço na sessão (ex: database, cache, auth)'
        notes:
          type: string
          description: Observações livres sobre o uso do serviço
      required:
      - session_id
      - service
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
