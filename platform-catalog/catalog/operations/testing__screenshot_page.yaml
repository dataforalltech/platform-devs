apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/screenshot_page
  uid: testing.screenshot_page
  domain: testing
  title: screenshot page
  description: Tira screenshot de uma página via Playwright. Suporta viewports desktop/tablet/mobile
    e captura de elemento por selector.
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: screenshot
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          description: URL da página
        viewport:
          type: string
          enum:
          - desktop
          - tablet
          - mobile
          default: desktop
        selector:
          type: string
          description: CSS selector para capturar elemento específico
        output_dir:
          type: string
          description: 'Diretório de saída (default: settings.screenshots_dir)'
      required:
      - url
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
