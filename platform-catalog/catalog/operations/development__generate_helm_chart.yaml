apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_helm_chart
  uid: development.generate_helm_chart
  domain: development
  title: generate helm chart
  description: Gera um Helm chart multi-arquivo (Chart.yaml/values.yaml/templates)
    determinístico.
  owner: platform
  tags:
  - development
  - devops
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: devops
  resource:
    type: devops_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nome do chart/app.
        image:
          type: string
          description: Repositório da imagem.
        port:
          type: integer
          description: Porta do serviço (default 80).
        values:
          type: object
          description: Valores extras (opcional).
        app_version:
          type: string
          description: appVersion / tag (default 1.0.0).
      required:
      - name
      - image
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:devops_artifact
