apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: provenance/provenance_build_statement
  uid: provenance.provenance_build_statement
  domain: provenance
  title: build artifact provenance statement
  description: Build an in-memory provenance statement from observed artifact hashes
    and Git state.
  owner: security
  tags:
  - provenance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: provenance
  capability: artifact-provenance
  resource:
    type: statement
    parent: null
    namespace: null
  operation: build
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: workspace
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 4096
      required:
      - paths
    outputs:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: 1
        subject:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              size_bytes:
                type: integer
                minimum: 0
              git_tracked:
                type: boolean
              git_status:
                type: string
              repository_head:
                anyOf:
                - type: string
                  pattern: ^[a-f0-9]{40,64}$
                - type: 'null'
            required:
            - path
            - sha256
            - size_bytes
            - git_tracked
            - git_status
            - repository_head
        repository:
          type: string
        repository_head:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{40,64}$
          - type: 'null'
        environment:
          type: string
        correlation_id:
          type: string
      required:
      - schema_version
      - subject
      - repository
      - repository_head
      - environment
      - correlation_id
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:statement
