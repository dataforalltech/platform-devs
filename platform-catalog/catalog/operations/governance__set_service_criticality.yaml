apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/set_service_criticality
  uid: governance.set_service_criticality
  domain: governance
  title: set service criticality
  description: Define nível de criticidade de um serviço
  owner: platform
  tags:
  - governance
  - audit
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: audit
  resource:
    type: service
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço
        criticality:
          type: string
          description: Nível de criticidade
          enum:
          - low
          - medium
          - high
          - critical
        updated_by:
          type: string
          description: Quem está atualizando
      required:
      - service
      - criticality
      - updated_by
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
