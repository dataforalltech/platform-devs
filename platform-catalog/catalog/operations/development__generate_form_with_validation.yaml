apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_form_with_validation
  uid: development.generate_form_with_validation
  domain: development
  title: generate form with validation
  description: Gera um formulário react-hook-form + zod determinístico a partir dos
    campos e regras.
  owner: platform
  tags:
  - development
  - frontend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: frontend
  resource:
    type: frontend_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nome do formulário.
        fields:
          type: array
          description: 'Campos [{name,type?,rules?}] (rules: required|email|url|min:N|max:N).'
      required:
      - name
      - fields
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:frontend_artifact
