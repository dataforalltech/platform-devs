apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/get_doc_tree
  uid: documentation.get_doc_tree
  domain: documentation
  title: get doc tree
  description: Retorna estrutura hierárquica de todos os arquivos de documentação.
    Agrupa por diretório com resumo de tipos e contagem de palavras.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
