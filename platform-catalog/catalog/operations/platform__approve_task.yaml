apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/approve_task
  uid: platform.approve_task
  domain: platform
  title: approve task
  description: Decisão sobre task com needs_human_decision=true. go = libera start_task;
    no_go = cancela. actor obrigatório.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: task
    parent: null
    namespace: null
  operation: approve
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: integer
        decision:
          type: string
          enum:
          - go
          - no_go
          description: go = aprova, no_go = rejeita (cancela a task).
        actor:
          type: object
          additionalProperties: false
          description: Quem tomou a decisão (governança).
          properties:
            type:
              type: string
              enum:
              - human
              - agent
              - system
            id:
              type: string
              description: Email do humano, session_id do agente, ou nome do sistema.
          required:
          - type
          - id
        rationale:
          type: string
          description: Por que esta decisão (obrigatório para no_go).
        notes:
          type: string
          description: Texto adicional gravado em decision_notes da task.
      required:
      - task_id
      - decision
      - actor
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:task
