apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/check_links
  uid: documentation.check_links
  domain: documentation
  title: check links
  description: Detecta links quebrados em markdown. Verifica links internos (existência
    de arquivo), âncoras (#heading) e opcionalmente links externos via HTTP.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: check
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        file_path:
          type: string
          description: Caminho absoluto do arquivo markdown
        check_external:
          type: boolean
          description: Verificar links externos via HTTP (lento)
      required:
      - file_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
