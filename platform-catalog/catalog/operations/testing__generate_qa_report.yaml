apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_qa_report
  uid: testing.generate_qa_report
  domain: testing
  title: generate qa report
  description: 'Gera relatório QA agregado com score 0-100 e grade A-F. Pondera: unit_tests
    30%, security 25%, linter 20%, coverage 15%, dependencies 10%.'
  owner: platform
  tags:
  - testing
  - quality
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: repository
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        repo_path:
          type: string
        last_n_runs:
          type: integer
          description: Considera último N run de cada tipo
          default: 1
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:repository
