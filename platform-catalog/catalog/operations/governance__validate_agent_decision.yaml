apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/validate_agent_decision
  uid: governance.validate_agent_decision
  domain: governance
  title: validate agent decision
  description: Valida uma decisão proposta pelo agente. Bloqueia (approved=false)
    decisões com fallback silencioso, hardcoded de credencial, bypass de auth, mock
    em prod, remoção de teste, DROP em código de app. Marca como alto risco contratos
    sem consumidor declarado, dependências sem justificativa, alterações fora do escopo.
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: validate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repository_name:
          type: string
        task_description:
          type: string
        proposed_change:
          type: string
        affected_files:
          type: array
          items:
            type: string
        affected_layers:
          type: array
          items:
            type: string
            enum:
            - frontend
            - backend
            - database
            - integrations
            - infrastructure
            - security
            - observability
            - testing
        changes_contracts:
          type: boolean
        adds_fallback:
          type: boolean
        adds_dependency:
          type: boolean
        modifies_security:
          type: boolean
      required:
      - repository_name
      - task_description
      - proposed_change
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
