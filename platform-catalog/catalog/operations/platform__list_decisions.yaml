apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/list_decisions
  uid: platform.list_decisions
  domain: platform
  title: list decisions
  description: 'Audit trail: lista decisões registradas com filtros (target, actor,
    ação, sessão). Use para governança e revisão de quem decidiu o quê e por quê.'
  owner: platform
  tags:
  - platform
  - session
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        target_type:
          type: string
          enum:
          - task
          - suggestion
          - session
          description: Tipo da entidade alvo.
        target_id:
          type: string
          description: ID da entidade alvo (string).
        actor_type:
          type: string
          enum:
          - human
          - agent
          - system
        actor_id:
          type: string
        action:
          type: string
        session_id:
          type: string
        limit:
          type: integer
          default: 100
      required: []
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:session
