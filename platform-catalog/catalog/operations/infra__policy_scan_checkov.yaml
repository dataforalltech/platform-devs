apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/policy_scan_checkov
  uid: infra.policy_scan_checkov
  domain: infra
  title: policy scan checkov
  description: 'Roda checkov sobre código terraform (ou outro framework) e devolve
    findings agrupados por severity. Marca hard_stop=True se houver qualquer HIGH
    ou CRITICAL (cicd-deploy.md §4 #3 do ai-governance).'
  owner: platform
  tags:
  - infra
  - provisioning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: policy
    parent: null
    namespace: null
  operation: policy
  authz: read
  risk:
    effects:
    - read
    requires:
    - terraform
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        path:
          type: string
        framework:
          type: string
          enum:
          - terraform
          - terraform_plan
          - kubernetes
          - dockerfile
          - all
          default: terraform
        skip_checks:
          type: array
          items:
            type: string
          description: 'Lista de check_ids para ignorar (ex.: CKV_AZURE_42)'
      required:
      - path
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
