apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/add_scenario
  uid: testing.add_scenario
  domain: testing
  title: add scenario
  description: Adiciona um cenário de teste específico e customizado ao plano.
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_id:
          type: string
          description: ID do plano de teste
        name:
          type: string
          description: Nome descritivo do cenário
        category:
          type: string
          enum:
          - happy_path
          - auth
          - boundary
          - error
          - edge_case
          - empty_state
          - pagination
          - performance
          - schema
          - concurrency
        steps:
          type: string
          description: Passos para executar o cenário
        expected_result:
          type: string
          description: Resultado esperado
        priority:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          description: Prioridade do cenário (default medium)
        preconditions:
          type: string
          description: Pré-condições necessárias
      required:
      - plan_id
      - name
      - category
      - steps
      - expected_result
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
