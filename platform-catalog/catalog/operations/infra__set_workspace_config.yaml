apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/set_workspace_config
  uid: infra.set_workspace_config
  domain: infra
  title: set workspace config
  description: 'Define ou atualiza uma chave no namespace ''workspace'' do ConfigStore.
    Para REPOS_ROOT: valida que o caminho existe (use create_dir=true para criar).'
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: config
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - key
      - value
      additionalProperties: false
      properties:
        key:
          type: string
          description: 'Nome da chave (ex: REPOS_ROOT, PYTHON_BIN, EDITOR, DEFAULT_ENV).'
        value:
          type: string
          description: Valor a armazenar.
        create_dir:
          type: boolean
          default: false
          description: 'Para REPOS_ROOT: cria o diretorio se nao existir. Default:
            false.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:config
