apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/validate_migration
  uid: governance.validate_migration
  domain: governance
  title: validate migration
  description: 'Valida conteúdo de arquivo de migration Alembic contra AGENTS.md §29:
    sem ORM (op.execute(sa.text(...))), idempotência (IF NOT EXISTS), sem DROP destrutivo
    na upgrade(), downgrade obrigatório. O caller PASSA o conteúdo como string — a
    tool não toca em filesystem.'
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: validate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        content:
          type: string
          description: Conteúdo completo do arquivo de migration.
      required:
      - content
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
