apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/validate_doc
  uid: documentation.validate_doc
  domain: documentation
  title: validate doc
  description: Valida documento contra regras do tipo (seções, mínimo de palavras,
    status ADR). Auto-detecta tipo pelo nome.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: validate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        file_path:
          type: string
          description: Caminho absoluto do arquivo markdown
        doc_type:
          type: string
          enum:
          - auto
          - readme
          - changelog
          - adr
          - agents
          - runbook
          - api
          description: Tipo do documento (auto = detecta pelo nome)
          default: auto
      required:
      - file_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
