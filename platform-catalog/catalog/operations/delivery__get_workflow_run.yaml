apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_workflow_run
  uid: delivery.get_workflow_run
  domain: delivery
  title: get workflow run
  description: 'Retorna status detalhado de um workflow run: status (queued/in_progress/completed),
    conclusion (success/failure/cancelled), branch, SHA, URL e logs_url.'
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: workflow
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        run_id:
          type: integer
          description: ID numérico do run.
      required:
      - repo
      - run_id
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:workflow
