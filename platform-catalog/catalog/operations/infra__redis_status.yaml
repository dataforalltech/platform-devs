apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/redis_status
  uid: infra.redis_status
  domain: infra
  title: redis status
  description: Verifica conectividade com o Redis via TCP + RESP PING. Se url nao
    for passado, busca no registry (type='redis'/'cache'). Retorna reachable, latencia_ms
    e resposta do PING.
  owner: platform
  tags:
  - infra
  - service-registry
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: cache
    parent: null
    namespace: null
  operation: redis
  authz: read
  risk:
    effects:
    - read
    requires:
    - redis
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          description: 'URL Redis: redis://host:port/db ou host:port. Se omitido,
            usa registry.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:cache
