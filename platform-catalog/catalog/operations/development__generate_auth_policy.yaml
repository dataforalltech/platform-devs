apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_auth_policy
  uid: development.generate_auth_policy
  domain: development
  title: generate auth policy
  description: Gera um documento de política RBAC (Markdown) determinístico a partir
    de roles/resources/rules.
  owner: platform
  tags:
  - development
  - backend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: backend
  resource:
    type: policy
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        roles:
          type: array
          items: &id001
            type: string
          description: Papéis do RBAC.
        resources:
          type: array
          items: *id001
          description: Recursos protegidos.
        rules:
          type: array
          description: Regras [{role,resource,actions,effect}] (opcional).
        title:
          type: string
          description: Título do doc (default 'RBAC Policy').
      required:
      - roles
      - resources
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:policy
