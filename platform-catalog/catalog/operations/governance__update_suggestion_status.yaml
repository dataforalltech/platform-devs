apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/update_suggestion_status
  uid: governance.update_suggestion_status
  domain: governance
  title: update suggestion status
  description: Muda o status de uma sugestão. Registra histórico (ts, status, note,
    by). Use 'acknowledged' quando você viu mas ainda não decidiu, 'accepted' quando
    vai virar trabalho, 'done' quando implementado.
  owner: platform
  tags:
  - governance
  - ai-governance
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        suggestion_id:
          type: string
        new_status:
          type: string
          enum:
          - pending
          - acknowledged
          - accepted
          - rejected
          - done
          - duplicate
        note:
          type: string
        by:
          type: string
          description: Quem fez a mudança (agent id, user, etc.).
      required:
      - suggestion_id
      - new_status
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:suggestion
