apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/sync_broker_urls
  uid: infra.sync_broker_urls
  domain: infra
  title: sync broker urls
  description: 'Atualiza vars de conexao de Kafka e Redis num arquivo .env a partir
    do registry. Vars tratadas: KAFKA_BOOTSTRAP_SERVERS, REDIS_URL, REDIS_HOST, REDIS_URI,
    RATE_LIMIT_STORAGE_URI, CACHE_URL, CELERY_BROKER_URL, CELERY_RESULT_BACKEND. Preserva
    o /db da URL Redis existente. Use dry_run=true para simular.'
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: sync
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - path
      additionalProperties: false
      properties:
        path:
          type: string
          description: Caminho absoluto do arquivo .env a atualizar.
        dry_run:
          type: boolean
          default: false
          description: 'Simular sem alterar o arquivo. Default: false.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
