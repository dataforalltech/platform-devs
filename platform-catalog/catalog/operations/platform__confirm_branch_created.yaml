apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/confirm_branch_created
  uid: platform.confirm_branch_created
  domain: platform
  title: confirm branch created
  description: Confirma que a branch da sessão foi criada via deploy-mcp.create_branch.
    sha base opcional (auditoria).
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: branch
    parent: null
    namespace: null
  operation: confirm
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: ID da sessão
        sha:
          type: string
          description: Sha base da branch (retornado por deploy-mcp.create_branch).
      required:
      - session_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:branch
