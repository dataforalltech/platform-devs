apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_migration
  uid: development.generate_migration
  domain: development
  title: generate migration
  description: Gera um esqueleto de migration alembic (upgrade/downgrade) determinístico
    a partir de revision+ops.
  owner: platform
  tags:
  - development
  - backend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: backend
  resource:
    type: backend_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Id da revisão.
        ops:
          type: array
          description: Operações (str SQL ou {op,table,column?,type?}); downgrade
            é o inverso.
        down_revision:
          type: string
          description: Revisão anterior (opcional).
        message:
          type: string
          description: Mensagem/descrição da migration (opcional).
      required:
      - revision
      - ops
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:backend_artifact
