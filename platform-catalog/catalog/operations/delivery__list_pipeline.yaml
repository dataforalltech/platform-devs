apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_pipeline
  uid: delivery.list_pipeline
  domain: delivery
  title: list pipeline
  description: Lista serviços registrados no pipeline. Suporta filtros por env (dev/homol/prod/blocked/rollback)
    e status (active/blocked).
  owner: platform
  tags:
  - delivery
  - promotion
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pipeline
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        env:
          type: string
          enum:
          - dev
          - homol
          - prod
          - blocked
          - rollback
          description: Filtrar por ambiente atual do serviço.
        status:
          type: string
          enum:
          - active
          - blocked
          description: Filtrar por status de bloqueio.
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:pipeline
