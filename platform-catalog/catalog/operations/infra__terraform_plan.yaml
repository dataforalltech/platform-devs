apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/terraform_plan
  uid: infra.terraform_plan
  domain: infra
  title: terraform plan
  description: Roda `terraform plan -no-color -out=<file> -detailed-exitcode`. Retorna
    summary (add/change/destroy) + path do .tfplan binário (input para infracost e
    show-plan). Pode chamar provider remoto (rate limit).
  owner: platform
  tags:
  - infra
  - provisioning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: terraform
  authz: read
  risk:
    effects:
    - read
    requires:
    - terraform
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        path:
          type: string
        out_file:
          type: string
          description: 'Caminho do .tfplan a gravar. Default: <path>/.infra-mcp.tfplan'
        var_file:
          type: string
          description: -var-file=... opcional
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:vm
