apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_nextjs_page
  uid: development.generate_nextjs_page
  domain: development
  title: generate nextjs page
  description: Gera uma página Next.js (app router) determinística a partir de route/title/sections.
  owner: platform
  tags:
  - development
  - frontend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: frontend
  resource:
    type: frontend_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        route:
          type: string
          description: 'Rota da página (ex.: /dashboard).'
        title:
          type: string
          description: Título/metadata (derivado da rota se ausente).
        sections:
          type: array
          description: Seções a esboçar na página (opcional).
      required:
      - route
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:frontend_artifact
