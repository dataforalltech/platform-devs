apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/list_suggestions
  uid: platform.list_suggestions
  domain: platform
  title: list suggestions
  description: Lista sugestões cross-repo com filtros. Use target_repo para ver a
    fila que cabe ao seu repo trabalhar.
  owner: platform
  tags:
  - platform
  - session
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        target_repo:
          type: string
        source_repo:
          type: string
        status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
          - deferred
          - superseded
        limit:
          type: integer
          default: 50
      required: []
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:suggestion
