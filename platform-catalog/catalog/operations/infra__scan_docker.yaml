apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/scan_docker
  uid: infra.scan_docker
  domain: infra
  title: scan docker
  description: Executa`docker ps` e sincronizacontainers em execucaoo no registry.
    Requer Docker instalado e acessivel no PATH.
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: document
    parent: null
    namespace: null
  operation: scan
  authz: write
  risk:
    effects:
    - write
    requires:
    - docker
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        timeout:
          type: integer
          minimum: 1
          maximum: 60
          description: 'Timeout em segundos parao comando docker. Default: 10.'
          default: 10
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:document
