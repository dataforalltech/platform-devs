apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/list_services
  uid: infra.list_services
  domain: infra
  title: list services
  description: Lista servicos registrados. Suporta filtros por environment, type,
    status, tag, runtime e deploy_mode.
  owner: platform
  tags:
  - infra
  - service-registry
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        environment:
          type: string
          enum:
          - local
          - dev
          - hml
          - prod
          description: Filtrar por ambiente.
        type:
          type: string
          enum:
          - docker
          - process
          - remote
          - unknown
          - mysql
          - mariadb
          - postgres
          - redis
          - kafka
          - mongodb
          description: Filtrar por tipo.
        status:
          type: string
          enum:
          - running
          - stopped
          - unknown
          description: Filtrar por status.
        tag:
          type: string
          description: Filtrar por tag.
        runtime:
          type: string
          description: 'Filtrar por runtime (ex: uvicorn, gunicorn, node, docker).'
        deploy_mode:
          type: string
          enum:
          - asgi
          - wsgi
          - node
          - jvm
          - proxy
          - docker
          - script
          - unknown
          description: Filtrar por modo de deploy.
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:service
