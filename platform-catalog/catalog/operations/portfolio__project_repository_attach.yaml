apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/project_repository_attach
  uid: portfolio.project_repository_attach
  domain: portfolio
  title: project repository attach
  description: Attach a provider-neutral repository reference resolved by platform-connectors.
  owner: platform-engineering
  tags:
  - portfolio
  - repository-binding
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: repository-binding
    parent: null
    namespace: null
  operation: attach
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: tenant
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        project_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]*$
        connector_ref:
          type: string
          minLength: 1
          maxLength: 512
        repository_ref:
          type: string
          minLength: 1
          maxLength: 512
        role:
          type: string
          enum:
          - source
          - documentation
          - infrastructure
          - deployment
          - other
          default: source
        metadata:
          type: object
          additionalProperties: false
          properties:
            display_name:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 200
              - type: 'null'
            default_branch:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 255
              - type: 'null'
            web_url:
              anyOf:
              - type: string
                format: uri
                pattern: ^https?://(?![^/?#]*@)(?!.*[\\#\s])[^/?#]+(?:[/?][^#\\\s]*)?$
                maxLength: 2048
              - type: 'null'
        external_link:
          type: object
          additionalProperties: false
          properties:
            owner:
              type: string
              minLength: 1
              maxLength: 255
            repo:
              type: string
              minLength: 1
              maxLength: 255
            url:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 2048
              - type: 'null'
          required:
          - owner
          - repo
      required:
      - idempotency_key
      - project_id
      - provider
      - connector_ref
      - repository_ref
    outputs:
      type: object
      additionalProperties: false
      properties:
        binding_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        project_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9._-]*$
        connector_ref:
          type: string
          minLength: 1
          maxLength: 512
        repository_ref:
          type: string
          minLength: 1
          maxLength: 512
        role:
          type: string
          enum:
          - source
          - documentation
          - infrastructure
          - deployment
          - other
        metadata:
          type: object
          additionalProperties: false
          properties:
            display_name:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 200
              - type: 'null'
            default_branch:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 255
              - type: 'null'
            web_url:
              anyOf:
              - type: string
                format: uri
                pattern: ^https?://(?![^/?#]*@)(?!.*[\\#\s])[^/?#]+(?:[/?][^#\\\s]*)?$
                maxLength: 2048
              - type: 'null'
        external_link:
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              owner:
                type: string
                minLength: 1
                maxLength: 255
              repo:
                type: string
                minLength: 1
                maxLength: 255
              url:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 2048
                - type: 'null'
            required:
            - owner
            - repo
          - type: 'null'
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_ref:
          type: string
          minLength: 1
          maxLength: 512
        updated_by_ref:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - binding_id
      - project_id
      - provider
      - connector_ref
      - repository_ref
      - role
      - metadata
      - version
      - created_at
      - updated_at
      - created_by_ref
      - updated_by_ref
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:repository-binding
