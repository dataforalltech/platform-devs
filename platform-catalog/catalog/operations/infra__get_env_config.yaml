apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/get_env_config
  uid: infra.get_env_config
  domain: infra
  title: get env config
  description: Retorna variáveis de um perfil de ambiente (dev/staging/production).
  owner: platform
  tags:
  - infra
  - configuration
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: environment
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        environment:
          type: string
          description: 'Perfil. Ex: ''dev'', ''staging'', ''production''.'
        key_pattern:
          type: string
          description: 'Filtrar variáveis por nome (substring). Ex: ''DATABASE''.'
        limit:
          type: integer
          description: 'Máximo de variáveis retornadas. Padrão: 50.'
          default: 50
      required:
      - environment
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:environment
