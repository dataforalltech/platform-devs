apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_e2e_tests
  uid: testing.generate_e2e_tests
  domain: testing
  title: generate e2e tests
  description: Gera um esqueleto de testes e2e determinístico (playwright|cypress)
    a partir dos fluxos.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        framework:
          type: string
          description: 'Framework: playwright|cypress.'
        flows:
          type: array
          description: Fluxos [{name,steps?}] (steps str ou {type,selector,value}).
        suite:
          type: string
          description: Nome da suite (default 'e2e').
      required:
      - framework
      - flows
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
