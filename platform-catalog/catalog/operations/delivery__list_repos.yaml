apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_repos
  uid: delivery.list_repos
  domain: delivery
  title: list repos
  description: Lista repositórios da organização GitHub. Útil para descobrir nomes
    exatos antes de operar em um repo.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        org:
          type: string
          description: 'Organização. Default: DEPLOY_GITHUB_ORG.'
        filter_name:
          type: string
          description: Filtro substring no nome (case-insensitive).
        include_archived:
          type: boolean
          description: 'Incluir repos arquivados. Default: false.'
          default: false
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:repository
