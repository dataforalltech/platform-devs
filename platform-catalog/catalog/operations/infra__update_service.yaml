apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/update_service
  uid: infra.update_service
  domain: infra
  title: update service
  description: Atualizacampos de um servico existente. Pelo menos um campo deve ser
    informado alem do name.
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        name:
          type: string
          description: Nome do servico aatualizar.
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        url:
          type: string
        type:
          type: string
          enum:
          - docker
          - process
          - remote
          - unknown
        environment:
          type: string
          enum:
          - local
          - dev
          - hml
          - prod
        status:
          type: string
          enum:
          - running
          - stopped
          - unknown
        health_path:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
      required:
      - name
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
