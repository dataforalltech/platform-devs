apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/create_pr
  uid: delivery.create_pr
  domain: delivery
  title: create pr
  description: Abre um Pull Request. Suporta labels, reviewers e modo draft. Retorna
    número do PR, URL e estado inicial.
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: create
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        title:
          type: string
          description: Título do PR.
        body:
          type: string
          description: Descrição em markdown.
        head:
          type: string
          description: Branch de origem (feature/minha-feature).
        base:
          type: string
          description: 'Branch de destino. Default: develop.'
        labels:
          type: array
          items:
            type: string
          description: Labels a aplicar.
        reviewers:
          type: array
          items:
            type: string
          description: Logins de reviewers.
        draft:
          type: boolean
          description: 'Criar como rascunho. Default: false.'
          default: false
      required:
      - repo
      - title
      - head
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pull_request
