apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/add_gate_result
  uid: delivery.add_gate_result
  domain: delivery
  title: add gate result
  description: 'Registra o resultado de um gate de qualidade para um serviço/ambiente.
    Types válidos: qa_tests, security_scan, pr_approved, health_check, manual_approval,
    audit_compliance. Se o gate já existir, atualiza o resultado.'
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: gate
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        env:
          type: string
          enum:
          - dev
          - homol
          - prod
          description: Ambiente ao qual o gate se refere.
        gate_type:
          type: string
          enum:
          - qa_tests
          - security_scan
          - pr_approved
          - health_check
          - manual_approval
          - audit_compliance
          description: Tipo do gate.
        passed:
          type: boolean
          description: True se o gate passou, False se falhou.
        details:
          type: string
          description: Detalhes adicionais (URL do relatório, mensagem de erro, etc.).
        evaluated_by:
          type: string
          description: Identificador de quem/o que avaliou o gate.
      required:
      - service
      - env
      - gate_type
      - passed
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:gate
