apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/context_status
  uid: platform.context_status
  domain: platform
  title: context status
  description: 'Retorna métricas de uso do contexto Claude: tool_calls desde autenticação,
    tempo decorrido e recomendação de /compact (ok | compact_soon | compact_now).
    Use periodicamente para saber quando compactar o contexto e reduzir custo de tokens.'
  owner: platform
  tags:
  - platform
  - identity
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: context
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties: {}
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:token
