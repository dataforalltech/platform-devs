apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/cancel_queued_request
  uid: infra.cancel_queued_request
  domain: infra
  title: cancel queued request
  description: Cancela um request WAITING na fila de provisão de VM. Use quando o
    agente não precisa mais da VM aguardada (job cancelado, timeout). request_id foi
    retornado por request_vm quando outcome=QUEUED. Retorna erro se request_id não
    existe ou já foi FULFILLED/CANCELLED.
  owner: platform
  tags:
  - infra
  - provisioning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: cancel
  authz: write
  risk:
    effects:
    - execute
    requires:
    - terraform
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        request_id:
          type: string
          description: ID retornado por request_vm (campo request_id quando outcome=QUEUED).
        by:
          type: string
          description: Identificador de quem está cancelando (audit).
      required:
      - request_id
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:vm
