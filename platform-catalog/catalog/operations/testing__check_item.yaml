apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/check_item
  uid: testing.check_item
  domain: testing
  title: check item
  description: Marca um item do checklist como passed, failed, na (não aplicável)
    ou blocked.
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test_plan
    parent: null
    namespace: null
  operation: check
  authz: write
  risk:
    effects:
    - read
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        run_id:
          type: string
          description: ID da execução do checklist
        item_id:
          type: integer
          description: ID numérico do item
        status:
          type: string
          enum:
          - passed
          - failed
          - na
          - blocked
        notes:
          type: string
          description: Observação sobre o item
      required:
      - run_id
      - item_id
      - status
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test_plan
