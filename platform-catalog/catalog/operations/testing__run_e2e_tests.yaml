apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/run_e2e_tests
  uid: testing.run_e2e_tests
  domain: testing
  title: run e2e tests
  description: Roda testes E2E via Playwright (test_*.py ou *.spec.ts). Detecta tipo
    de arquivo e usa comando correto.
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: run
  authz: write
  risk:
    effects:
    - execute
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        test_path:
          type: string
          description: Diretório com os testes E2E
        base_url:
          type: string
          description: URL base da aplicação
        browser:
          type: string
          enum:
          - chromium
          - firefox
          - webkit
          default: chromium
        headless:
          type: boolean
          default: true
        timeout:
          type: integer
          description: Timeout em segundos
      required:
      - test_path
      - base_url
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
