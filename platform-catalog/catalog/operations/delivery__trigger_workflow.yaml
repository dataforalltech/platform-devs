apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/trigger_workflow
  uid: delivery.trigger_workflow
  domain: delivery
  title: trigger workflow
  description: Dispara um workflow via workflow_dispatch. workflow_id pode ser o nome
    do arquivo (deploy.yml) ou ID numérico. A API não retorna o run_id — use list_workflow_runs
    após para localizar o run.
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: workflow
    parent: null
    namespace: null
  operation: trigger
  authz: write
  risk:
    effects:
    - execute
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        workflow_id:
          type: string
          description: 'Nome do arquivo do workflow (ex: deploy.yml) ou ID.'
        ref:
          type: string
          description: Branch, tag ou SHA para o dispatch.
        inputs:
          type: object
          additionalProperties:
            type: string
          description: Inputs do workflow_dispatch (chave → valor string).
      required:
      - repo
      - workflow_id
      - ref
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: none
relations:
- verb: acts-on
  target: resource:workflow
