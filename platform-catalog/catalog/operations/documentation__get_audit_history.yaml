apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/get_audit_history
  uid: documentation.get_audit_history
  domain: documentation
  title: get audit history
  description: Retorna histórico de auditorias salvas no store, ordenadas pela mais
    recente. Filtra por repo_path opcionalmente.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: audit
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Filtrar por repositório (opcional)
        limit:
          type: integer
          description: Máximo de auditorias a retornar
          default: 10
      required: []
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:audit
