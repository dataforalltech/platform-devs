apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/kafka_status
  uid: infra.kafka_status
  domain: infra
  title: kafka status
  description: Verifica conectividade TCP com o broker Kafka. Se bootstrap_servers
    nao for passado, busca no registry (type='kafka' ou nome 'kafka'/'platform-kafka').
    Retorna lista de brokers com reachable=true/false e latencia em ms.
  owner: platform
  tags:
  - infra
  - service-registry
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: broker
    parent: null
    namespace: null
  operation: kafka
  authz: read
  risk:
    effects:
    - read
    requires:
    - kafka
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        bootstrap_servers:
          type: string
          description: 'Broker(s) Kafka: ''host:port'' ou ''h1:p1,h2:p2''. Se omitido,
            usa registry.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:broker
