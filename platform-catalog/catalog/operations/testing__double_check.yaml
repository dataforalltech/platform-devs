apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/double_check
  uid: testing.double_check
  domain: testing
  title: double check
  description: 'Executa verificação completa do plano: lista cenários não executados,
    falhas abertas e findings críticos. Retorna veredicto APROVADO ou BLOQUEADO.'
  owner: platform
  tags:
  - testing
  - test-planning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test_plan
    parent: null
    namespace: null
  operation: double
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_id:
          type: string
          description: ID do plano de teste
      required:
      - plan_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test_plan
