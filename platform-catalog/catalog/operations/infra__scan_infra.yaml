apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/scan_infra
  uid: infra.scan_infra
  domain: infra
  title: scan infra
  description: Varre containers Docker em execucao e registra automaticamente os de
    infraestrutura (mysql, mariadb, postgres, redis, kafka, mongodb) detectados pelo
    nome da imagem. Para Kafka, usa a porta EXTERNAL (9094) se disponivel. Nao afeta
    containers de aplicacao (plataform-*, mcp-*, etc).
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: infra
    parent: null
    namespace: null
  operation: scan
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        timeout:
          type: integer
          default: 10
          description: 'Timeout do docker ps em segundos. Default: 10.'
        environment:
          type: string
          default: local
          description: 'Ambiente a marcar nos registros. Default: local.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:infra
