apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/terraform_show_plan
  uid: infra.terraform_show_plan
  domain: infra
  title: terraform show plan
  description: Devolve o terraform plan em JSON estruturado para análise programática
    (via `terraform show -json <plan>`). Use depois de terraform_plan.
  owner: platform
  tags:
  - infra
  - provisioning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: terraform
  authz: read
  risk:
    effects:
    - read
    requires:
    - terraform
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_path:
          type: string
        path:
          type: string
      required:
      - plan_path
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:vm
