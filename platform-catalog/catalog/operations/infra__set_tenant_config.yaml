apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/set_tenant_config
  uid: infra.set_tenant_config
  domain: infra
  title: set tenant config
  description: Define uma variável de configuração para o tenant. O tenant_id é resolvido
    das claims do inner token (gateway) — nunca de argumento do cliente (INV-3).
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: tenant
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        key:
          type: string
          description: 'Ex: ''DATABASE_URL''.'
        value:
          type: string
      required:
      - key
      - value
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:tenant
