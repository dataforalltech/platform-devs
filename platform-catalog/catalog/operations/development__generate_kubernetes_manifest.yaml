apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_kubernetes_manifest
  uid: development.generate_kubernetes_manifest
  domain: development
  title: generate kubernetes manifest
  description: Gera um manifesto Kubernetes (Deployment|Service|Ingress|ConfigMap)
    determinístico.
  owner: platform
  tags:
  - development
  - devops
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: devops
  resource:
    type: devops_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Deployment|Service|Ingress|ConfigMap.
        name:
          type: string
          description: Nome do recurso.
        image:
          type: string
          description: Imagem do container (opcional).
        replicas:
          type: integer
          description: Réplicas (default 1).
        port:
          type: integer
          description: Porta (opcional).
        env:
          type: object
          description: Variáveis de ambiente (opcional).
        resources:
          type: object
          description: requests/limits de recursos (opcional).
        namespace:
          type: string
          description: Namespace (opcional).
      required:
      - kind
      - name
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:devops_artifact
