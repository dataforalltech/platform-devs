apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_pipeline
  uid: delivery.get_pipeline
  domain: delivery
  title: get pipeline
  description: Retorna o status atual do pipeline de um serviço, incluindo ambiente
    atual, status de bloqueio e últimas 10 promoções.
  owner: platform
  tags:
  - delivery
  - promotion
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pipeline
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
      required:
      - service
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:pipeline
