apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/get_audit_status
  uid: governance.get_audit_status
  domain: governance
  title: get audit status
  description: Retorna status da auditoria mais recente de um serviço/ambiente
  owner: platform
  tags:
  - governance
  - audit
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: audit
  resource:
    type: audit
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço
        env:
          type: string
          description: 'Ambiente: dev, hml, prod'
          enum:
          - dev
          - hml
          - prod
      required:
      - service
      - env
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:audit
