apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/scan_docs
  uid: documentation.scan_docs
  domain: documentation
  title: scan docs
  description: Encontra todos os arquivos de documentação em repo_path. Detecta tipo
    (readme, changelog, adr, etc.) e indexa no store.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: scan
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
        patterns:
          type: array
          items:
            type: string
          description: 'Padrões glob (default: [''**/*.md'', ''**/*.rst'', ''**/*.txt''])'
        include_hidden:
          type: boolean
          description: Incluir arquivos/diretórios ocultos
          default: false
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
