apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/commit_files
  uid: delivery.commit_files
  domain: delivery
  title: commit files
  description: Cria ou atualiza arquivos em um commit. Para 1 arquivo usa Contents
    API. Para N arquivos usa Git Data API (1 commit atômico). Cria o arquivo se não
    existir, atualiza se existir.
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: commit
    parent: null
    namespace: null
  operation: commit
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        branch:
          type: string
          description: Branch de destino.
        message:
          type: string
          description: Mensagem do commit.
        files:
          type: array
          description: Arquivos a criar/atualizar.
          items:
            type: object
            properties:
              path:
                type: string
                description: 'Caminho relativo ao root (ex: src/main.py).'
              content:
                type: string
                description: Conteúdo completo do arquivo.
            required:
            - path
            - content
            additionalProperties: false
          minItems: 1
        author_name:
          type: string
          description: 'Nome do autor (override). Default: usa o token.'
        author_email:
          type: string
      required:
      - repo
      - branch
      - message
      - files
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:commit
