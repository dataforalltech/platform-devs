apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_service_layer
  uid: development.generate_service_layer
  domain: development
  title: generate service layer
  description: Gera o scaffold de uma classe de service determinística a partir de
    entity+methods.
  owner: platform
  tags:
  - development
  - backend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: backend
  resource:
    type: service
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        entity:
          type: string
          description: Entidade alvo (nome da classe de service).
        methods:
          type: array
          description: Métodos (str ou {name}); default CRUD (create/get/list/update/delete).
      required:
      - entity
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
