apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/sync_service_urls
  uid: infra.sync_service_urls
  domain: infra
  title: sync service urls
  description: 'Sincronizavariaveis URL_* de um arquivo .env com as URLs registradas
    no registry. ParacadaURL_<NAME>, buscao servico ''name'' ou ''platform-name''
    no registry e atualizao valor. Preservao path existente daURL (ex: /api/v1) amenos
    que url_suffix sejainformado. Use url_map paramapeamentos explicitos. Use dry_run=true
    parasimular sem alterar.'
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: sync
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - path
      additionalProperties: false
      properties:
        path:
          type: string
          description: Caminho do arquivo .env aatualizar.
        url_map:
          type: object
          additionalProperties:
            type: string
          description: 'Mapeamento explicito {ENV_VAR: service_name}. Ex: {"URL_ADMIN":
            "platform-admin"}.'
        url_suffix:
          type: string
          default: ''
          description: 'Sufixo de path aforcar. Ex: ''/api/v1''. Se vazio, preservao
            path atual.'
        dry_run:
          type: boolean
          default: false
          description: Se true, apenas simulaas mudancas sem alterar o arquivo.
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
