apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/complete_task
  uid: platform.complete_task
  domain: platform
  title: complete task
  description: Marca tarefa como concluída. Requer commit_sha + commit_message do
    deploy-mcp.commit_files chamado ANTES desta tool.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: task
    parent: null
    namespace: null
  operation: complete
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: integer
          description: ID da tarefa
        commit_sha:
          type: string
          description: Sha do commit retornado por mcp__deploy-mcp__commit_files.
        commit_message:
          type: string
          description: Mensagem do commit (a mesma usada no commit_files).
        result:
          type: string
          description: Notas livres sobre o resultado (campo informativo).
      required:
      - task_id
      - commit_sha
      - commit_message
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:task
