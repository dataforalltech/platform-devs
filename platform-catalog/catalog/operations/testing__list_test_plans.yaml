apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/list_test_plans
  uid: testing.list_test_plans
  domain: testing
  title: list test plans
  description: Lista planos de teste, opcionalmente filtrados por status.
  owner: platform
  tags:
  - testing
  - test-planning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        status:
          type: string
          description: Filtrar por status
          enum:
          - active
          - completed
          - archived
        limit:
          type: integer
          description: Máximo de planos retornados (default 20)
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
