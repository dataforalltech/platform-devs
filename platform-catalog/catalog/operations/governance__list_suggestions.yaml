apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/list_suggestions
  uid: governance.list_suggestions
  domain: governance
  title: list suggestions
  description: 'Lista sugestões com filtros (target_repo, status, category, severity,
    source_agent). Default: 20 mais recentes.'
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        target_repo:
          type: string
        status:
          type: string
          enum:
          - pending
          - acknowledged
          - accepted
          - rejected
          - done
          - duplicate
        category:
          type: string
          enum:
          - bug
          - improvement
          - refactor
          - security
          - performance
          - docs
          - test
          - contract
          - observability
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        source_agent:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:suggestion
