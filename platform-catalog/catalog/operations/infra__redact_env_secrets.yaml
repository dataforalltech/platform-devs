apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/redact_env_secrets
  uid: infra.redact_env_secrets
  domain: infra
  title: redact env secrets
  description: Substitui valores hardcoded de secrets por ${VAR_NAME} em arquivos
    .env. Use dry_run=true para simular antes de aplicar.
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: credential
    parent: null
    namespace: null
  operation: redact
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - paths
      additionalProperties: false
      properties:
        paths:
          type: array
          items:
            type: string
          description: Lista de caminhos dos arquivos .env.
        keys:
          type: array
          items:
            type: string
          description: Chaves explicitas a redact. Se omitido, usa auto_detect.
        auto_detect:
          type: boolean
          default: true
          description: 'Detectar automaticamente via padrao de nomes. Default: true.'
        dry_run:
          type: boolean
          default: false
          description: 'Simular sem alterar arquivos. Default: false.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:credential
