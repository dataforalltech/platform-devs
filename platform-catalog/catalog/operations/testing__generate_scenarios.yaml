apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_scenarios
  uid: testing.generate_scenarios
  domain: testing
  title: generate scenarios
  description: 'Gera e salva automaticamente cenários de teste baseados em templates
    para a categoria informada. Categorias: rest_api, react_component, auth_flow,
    db_migration, websocket, form_validation, ui_data_validation.'
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_id:
          type: string
          description: ID do plano de teste
        category:
          type: string
          description: Categoria da feature
          enum:
          - rest_api
          - react_component
          - auth_flow
          - db_migration
          - websocket
          - form_validation
          - ui_data_validation
        context:
          type: string
          description: 'Contexto específico (ex: ''/api/users'') para personalizar
            os cenários'
      required:
      - plan_id
      - category
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
