apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/product_update
  uid: portfolio.product_update
  domain: portfolio
  title: product update
  description: Update a product with idempotency and optimistic concurrency.
  owner: platform-engineering
  tags:
  - portfolio
  - product
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: product
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: tenant
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        product_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        expected_version:
          type: integer
          minimum: 1
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 80
              pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
            name:
              type: string
              minLength: 1
              maxLength: 200
            description:
              anyOf:
              - type: string
                maxLength: 4000
              - type: 'null'
            status:
              type: string
              enum:
              - planned
              - active
              - paused
              - retired
            owner_user_refs:
              type: array
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 512
      required:
      - idempotency_key
      - product_id
      - expected_version
      - changes
    outputs:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
        status:
          type: string
          enum:
          - planned
          - active
          - paused
          - retired
        owner_user_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_ref:
          type: string
          minLength: 1
          maxLength: 512
        updated_by_ref:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - product_id
      - slug
      - name
      - description
      - status
      - owner_user_refs
      - version
      - created_at
      - updated_at
      - created_by_ref
      - updated_by_ref
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:product
