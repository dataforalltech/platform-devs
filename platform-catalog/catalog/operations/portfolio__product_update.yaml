apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/product_update
  uid: portfolio.product_update
  domain: portfolio
  title: product update
  description: Update a product with idempotency and optimistic concurrency.
  owner: platform-engineering
  tags:
  - portfolio
  - product
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: product
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: tenant
    default_level: medium
    approval_required: none
  contract:
    inputs: {}
    outputs: {}
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:product
