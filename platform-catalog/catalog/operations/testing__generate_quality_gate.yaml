apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_quality_gate
  uid: testing.generate_quality_gate
  domain: testing
  title: generate quality gate
  description: Gera uma config JSON de quality gate determinística a partir das métricas/thresholds.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: gate
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        metrics:
          type: object
          description: Métricas {coverage,lint,tests,...} → thresholds.
        service:
          type: string
          description: Serviço alvo (opcional).
        on_failure:
          type: string
          description: Ação em falha (default 'block').
      required:
      - metrics
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:gate
