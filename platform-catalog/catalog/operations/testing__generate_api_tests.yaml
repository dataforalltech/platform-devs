apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_api_tests
  uid: testing.generate_api_tests
  domain: testing
  title: generate api tests
  description: Gera testes de API determinísticos (pytest + requests) a partir dos
    endpoints.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        base:
          type: string
          description: Base URL da API.
        endpoints:
          type: array
          description: Endpoints [{method?,path?,expected_status?,name?}].
      required:
      - base
      - endpoints
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
