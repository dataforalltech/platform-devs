apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/project_delete
  uid: portfolio.project_delete
  domain: portfolio
  title: project delete
  description: Soft-delete a project with no active repository bindings after approval.
  owner: platform-engineering
  tags:
  - portfolio
  - project
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: project
    parent: null
    namespace: null
  operation: delete
  authz: write
  risk:
    effects:
    - delete
    requires:
    - approval:N2
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs: {}
    outputs: {}
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:project
