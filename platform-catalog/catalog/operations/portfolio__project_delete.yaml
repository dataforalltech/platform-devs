apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/project_delete
  uid: portfolio.project_delete
  domain: portfolio
  title: project delete
  description: Soft-delete a project with no active repository bindings after approval.
  owner: platform-engineering
  tags:
  - portfolio
  - project
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: project
    parent: null
    namespace: null
  operation: delete
  authz: write
  risk:
    effects:
    - delete
    requires:
    - approval:N2
    blast_radius: tenant
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        project_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        expected_version:
          type: integer
          minimum: 1
      required:
      - idempotency_key
      - project_id
      - expected_version
    outputs:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        deleted:
          const: true
      required:
      - project_id
      - deleted
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: idempotency-key
relations:
- verb: acts-on
  target: resource:project
