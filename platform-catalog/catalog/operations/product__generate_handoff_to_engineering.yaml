apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: product/generate_handoff_to_engineering
  uid: product.generate_handoff_to_engineering
  domain: product
  title: generate handoff to engineering
  description: Gera um documento de handoff para Engenharia determinístico a partir
    da feature/specs.
  owner: platform
  tags:
  - product
  - product-ownership
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: product
  capability: product-ownership
  resource:
    type: product_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        feature:
          type: string
          description: Feature alvo do handoff.
        specs:
          type: array
          description: Especificações técnicas a repassar (opcional).
      required:
      - feature
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:product_artifact
