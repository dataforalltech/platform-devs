apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/create_test_plan
  uid: testing.create_test_plan
  domain: testing
  title: create test plan
  description: Cria um plano de testes para uma feature ou endpoint. Retorna plan_id
    usado em todas as operações subsequentes.
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test
    parent: null
    namespace: null
  operation: create
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        title:
          type: string
          description: 'Título do plano (ex: ''GET /api/users'')'
        scope:
          type: string
          description: O que será testado e quais limites
        feature:
          type: string
          description: Nome da feature ou ticket relacionado
      required:
      - title
      - scope
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
