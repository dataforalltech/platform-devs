apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/validate_lib_change
  uid: governance.validate_lib_change
  domain: governance
  title: validate lib change
  description: 'HARD STOP §18 AGENTS.md: bloqueia mudanças em libs privadas (platform-*-lib,
    platform-db-vector). Retorna template de LIB CHANGE REQUEST pré-preenchido com
    consumidores identificados automaticamente no grafo, e os next steps para aprovação
    por @caiog.'
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: validate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        lib_name:
          type: string
        proposed_change:
          type: string
          description: Descrição da mudança que se quer fazer na lib.
      required:
      - lib_name
      - proposed_change
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
