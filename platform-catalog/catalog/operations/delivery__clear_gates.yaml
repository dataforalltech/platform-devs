apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/clear_gates
  uid: delivery.clear_gates
  domain: delivery
  title: clear gates
  description: Limpa todos os resultados de gates de um serviço/ambiente. Útil para
    forçar re-avaliação completa antes de uma nova promoção.
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: gate
    parent: null
    namespace: null
  operation: clear
  authz: write
  risk:
    effects:
    - delete
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        env:
          type: string
          enum:
          - dev
          - homol
          - prod
          description: Ambiente cujos gates serão limpos.
      required:
      - service
      - env
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:gate
