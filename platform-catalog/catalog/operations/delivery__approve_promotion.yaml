apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/approve_promotion
  uid: delivery.approve_promotion
  domain: delivery
  title: approve promotion
  description: Registra aprovação humana de uma promoção HML ou PROD e executa o merge
    da PR. Deve ser chamado após o humano aprovar a PR no GitHub. Atualiza o ambiente
    do serviço para to_env após merge bem-sucedido.
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: approve
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        promotion_id:
          type: integer
          description: ID da promoção retornado por promote_service.
        approved_by:
          type: string
          description: Identificador de quem aprovou (usuário GitHub ou nome).
      required:
      - promotion_id
      - approved_by
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pull_request
