apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_k6_performance_test
  uid: testing.generate_k6_performance_test
  domain: testing
  title: generate k6 performance test
  description: Gera um script de performance k6 (JS) determinístico com VUs/duração/thresholds.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: URL alvo do teste de carga.
        vus:
          type: integer
          description: Virtual users (default 10).
        duration:
          type: string
          description: Duração (default '30s').
        thresholds:
          type: object
          description: 'Thresholds {metric: condição|[condições]} (opcional).'
      required:
      - target
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
