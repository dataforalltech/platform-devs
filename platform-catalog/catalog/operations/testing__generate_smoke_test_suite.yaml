apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_smoke_test_suite
  uid: testing.generate_smoke_test_suite
  domain: testing
  title: generate smoke test suite
  description: Gera um manifesto YAML de smoke suite determinístico a partir de endpoints
    e/ou páginas.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        endpoints:
          type: array
          description: Endpoints [{method?,path?,expected_status?}] ou strings.
        pages:
          type: array
          description: Páginas [{url?,name?}] ou strings.
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
