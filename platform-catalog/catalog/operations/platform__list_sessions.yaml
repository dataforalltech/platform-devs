apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/list_sessions
  uid: platform.list_sessions
  domain: platform
  title: list sessions
  description: Lista sessões recentes. Filtre por status (active/paused/completed)
    ou repo para ver sessões em andamento.
  owner: platform
  tags:
  - platform
  - session
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          description: Filtrar por status
        repo:
          type: string
          description: Filtrar por nome/caminho do repo (busca parcial)
        limit:
          type: integer
          description: 'Máximo de sessões a retornar (default: 20)'
          default: 20
      required: []
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:session
