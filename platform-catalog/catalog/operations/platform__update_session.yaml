apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/update_session
  uid: platform.update_session
  domain: platform
  title: update session
  description: 'Atualiza o status e/ou progresso de uma sessão. Status: active | paused
    | completed.'
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: update
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          description: Novo status da sessão
        progress:
          type: string
          description: Texto livre descrevendo o progresso atual
      required:
      - session_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:session
