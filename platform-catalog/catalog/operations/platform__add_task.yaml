apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/add_task
  uid: platform.add_task
  domain: platform
  title: add task
  description: Cria tarefa na sessão (single ou bulk). needs_human_decision=true bloqueia
    start_task até approve_task.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: task
    parent: null
    namespace: null
  operation: add
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: ID da sessão
        title:
          type: string
          description: Título da tarefa (modo single)
        description:
          type: string
          description: Descrição opcional da tarefa (modo single)
        needs_human_decision:
          type: boolean
          description: Se true, start_task fica bloqueado até approve_task. Default
            false.
          default: false
        tasks:
          type: array
          description: Lista de tarefas a criar em lote (modo bulk)
          items:
            type: object
            additionalProperties: false
            properties:
              title:
                type: string
              description:
                type: string
              needs_human_decision:
                type: boolean
            required:
            - title
      required:
      - session_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:task
