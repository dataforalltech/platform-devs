apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/stop_service
  uid: infra.stop_service
  domain: infra
  title: stop service
  description: 'Paraum servico registrado. Detectaautomaticamente o tipo: docker/docker-compose
    â†'' docker stop; process/uvicorn â†'' SIGTERM no PID. Atualizastatus=stopped
    no registry apos parar.'
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: stop
  authz: write
  risk:
    effects:
    - execute
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nome do servico aparar.
        mode:
          type: string
          enum:
          - docker
          - docker-compose
          - process
          description: Forcar tipo de stop. Se omitido, detectapelo registro.
        timeout:
          type: integer
          minimum: 1
          maximum: 120
          default: 10
          description: 'Timeout em segundos paradocker stop. Default: 10.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
