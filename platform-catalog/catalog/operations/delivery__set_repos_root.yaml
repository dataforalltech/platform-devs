apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/set_repos_root
  uid: delivery.set_repos_root
  domain: delivery
  title: set repos root
  description: Define a pasta raiz dos repositorios locais. Persiste REPOS_ROOT no
    config-mcp (namespace workspace) para uso em todas as sessoes. create_dir=true
    cria o diretorio se nao existir. persist=false (default true) apenas valida sem
    salvar no config-mcp.
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      required:
      - path
      additionalProperties: false
      properties:
        path:
          type: string
          description: Caminho absoluto (ou ~ expandido) da pasta de repos.
        create_dir:
          type: boolean
          default: false
          description: 'Cria o diretorio se nao existir. Default: false.'
        persist:
          type: boolean
          default: true
          description: 'Salva no config-mcp para persistir entre sessoes. Default:
            true.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:repository
