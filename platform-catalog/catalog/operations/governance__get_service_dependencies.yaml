apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/get_service_dependencies
  uid: governance.get_service_dependencies
  domain: governance
  title: get service dependencies
  description: Upstream (o que o serviço consome) + downstream (quem consome ele).
    Use ANTES de validate_agent_decision com changes_contracts=True para saber quem
    precisa ser comunicado.
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: service
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service_name:
          type: string
      required:
      - service_name
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:service
