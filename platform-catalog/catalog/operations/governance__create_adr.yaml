apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/create_adr
  uid: governance.create_adr
  domain: governance
  title: create adr
  description: Cria docs/decisions/adr-NNNN.md no repositório alvo. Numeração automática
    (próximo número livre). Use quando uma decisão arquitetural justifica ADR (substituir
    biblioteca, mudar padrão de cache, novo protocolo).
  owner: platform
  tags:
  - governance
  - ai-governance
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: adr
    parent: null
    namespace: null
  operation: create
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        title:
          type: string
          description: Título curto da decisão.
        context:
          type: string
          description: Cenário, forças, restrições.
        decision:
          type: string
          description: 'Decisão em voz ativa: ''Vamos usar X para Y porque Z.'''
        consequences:
          type: string
          description: Positivas, negativas, neutras.
        repo_path:
          type: string
          description: 'Caminho absoluto do repo alvo. Default: pai da knowledge-base.'
      required:
      - title
      - context
      - decision
      - consequences
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:adr
