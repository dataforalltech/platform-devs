apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/read_env_file
  uid: infra.read_env_file
  domain: infra
  title: read env file
  description: Le um arquivo .env do disco e retorna as variaveis como dict. Complemento
    ao get_env_config que le do store encriptado.
  owner: platform
  tags:
  - infra
  - configuration
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: environment
    parent: null
    namespace: null
  operation: read
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - path
      additionalProperties: false
      properties:
        path:
          type: string
          description: Caminho absoluto do arquivo .env.
        key_filter:
          type: string
          description: 'Filtro substring nas chaves (case-insensitive). Ex: ''URL''.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:environment
