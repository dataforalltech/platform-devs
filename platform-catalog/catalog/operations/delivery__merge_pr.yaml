apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/merge_pr
  uid: delivery.merge_pr
  domain: delivery
  title: merge pr
  description: 'Faz merge de um PR. Estratégias: squash (padrão), merge, rebase. Verifique
    get_pr antes para garantir checks passando.'
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: merge
  authz: write
  risk:
    effects:
    - merge
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        pr_number:
          type: integer
        method:
          type: string
          enum:
          - squash
          - merge
          - rebase
          description: 'Estratégia de merge. Default: squash.'
          default: squash
        commit_title:
          type: string
          description: Título do commit de merge (override).
        commit_message:
          type: string
          description: Mensagem do commit de merge (override).
      required:
      - repo
      - pr_number
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pull_request
