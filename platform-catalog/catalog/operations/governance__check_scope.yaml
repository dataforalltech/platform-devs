apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/check_scope
  uid: governance.check_scope
  domain: governance
  title: check scope
  description: 'Detecta drift de escopo: volume excessivo, infra central, libs privadas
    (HARD STOP §18), múltiplos serviços, arquivos suspeitos para a tarefa declarada.
    Retorna risk_level + drift_indicators + required_actions. Rodar antes de abrir
    PR.'
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: check
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        task_description:
          type: string
        changed_files:
          type: array
          items:
            type: string
          description: Lista de paths relativos modificados pela tarefa.
      required:
      - task_description
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
