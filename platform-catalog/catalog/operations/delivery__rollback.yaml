apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/rollback
  uid: delivery.rollback
  domain: delivery
  title: rollback
  description: Registra um rollback de versão para um serviço em um ambiente. Atualiza
    o status do serviço para 'rollback' e registra no histórico.
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pipeline
    parent: null
    namespace: null
  operation: rollback
  authz: write
  risk:
    effects:
    - rollback
    requires:
    - github
    blast_radius: environment
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        env:
          type: string
          enum:
          - dev
          - homol
          - prod
          description: Ambiente onde o rollback será realizado.
        to_version:
          type: string
          description: Versão/SHA/tag para onde reverter.
        rolled_back_by:
          type: string
          description: Identificador de quem executou o rollback.
        reason:
          type: string
          description: Motivo do rollback (opcional).
      required:
      - service
      - env
      - to_version
      - rolled_back_by
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pipeline
