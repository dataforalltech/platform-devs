apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/get_agent_guidelines
  uid: governance.get_agent_guidelines
  domain: governance
  title: get agent guidelines
  description: 'Retorna diretrizes aplicáveis ao contexto: regras obrigatórias, ações
    proibidas e checklist recomendado. Chamar antes de iniciar a tarefa.'
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repository_name:
          type: string
          description: Nome do repositório alvo (opcional).
        task_type:
          type: string
          description: feature | bugfix | refactor | migration | infra | docs | test
            | chore
        layer:
          type: string
          enum:
          - frontend
          - backend
          - database
          - integrations
          - infrastructure
          - security
          - observability
          - testing
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
