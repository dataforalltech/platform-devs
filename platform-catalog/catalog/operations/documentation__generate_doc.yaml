apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/generate_doc
  uid: documentation.generate_doc
  domain: documentation
  title: generate doc
  description: Gera documento a partir de template com substituição {{var}}. Salva
    no disco se output_path fornecido.
  owner: platform
  tags:
  - documentation
  - docs
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        template_name:
          type: string
          enum:
          - README
          - CHANGELOG
          - ADR
          - AGENTS
          - RUNBOOK
          - API
          description: Nome do template a usar
        variables:
          type: object
          description: 'Mapa de variáveis para substituição (ex: {service_name: ''meu-serviço''})'
          additionalProperties:
            type: string
        output_path:
          type: string
          description: Caminho absoluto para salvar o arquivo gerado (opcional)
      required:
      - template_name
      - variables
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:document
