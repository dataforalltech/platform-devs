apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: portfolio/product_list
  uid: portfolio.product_list
  domain: portfolio
  title: product list
  description: List active tenant products with bounded cursor pagination.
  owner: platform-engineering
  tags:
  - portfolio
  - product
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: portfolio
  capability: project-product-registry
  resource:
    type: product
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - planned
          - active
          - paused
          - retired
        after_id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    outputs:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_id:
                type: string
                format: uuid
                minLength: 36
                maxLength: 36
              slug:
                type: string
                minLength: 1
                maxLength: 80
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              name:
                type: string
                minLength: 1
                maxLength: 200
              description:
                anyOf:
                - type: string
                  maxLength: 4000
                - type: 'null'
              status:
                type: string
                enum:
                - planned
                - active
                - paused
                - retired
              owner_user_refs:
                type: array
                maxItems: 100
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 512
              version:
                type: integer
                minimum: 1
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              created_by_ref:
                type: string
                minLength: 1
                maxLength: 512
              updated_by_ref:
                type: string
                minLength: 1
                maxLength: 512
            required:
            - product_id
            - slug
            - name
            - description
            - status
            - owner_user_refs
            - version
            - created_at
            - updated_at
            - created_by_ref
            - updated_by_ref
        next_after_id:
          anyOf:
          - type: string
            format: uuid
            minLength: 36
            maxLength: 36
          - type: 'null'
      required:
      - items
      - next_after_id
    preconditions:
    - trusted tenant context
    postconditions:
    - tenant-scoped audit record
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:product
