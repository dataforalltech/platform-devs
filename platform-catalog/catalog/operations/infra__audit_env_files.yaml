apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/audit_env_files
  uid: infra.audit_env_files
  domain: infra
  title: audit env files
  description: Escaneia todos os arquivos .env.* de um diretorio e reporta problemas.
    Detecta secrets hardcoded, arquivos fora do padrao canonico, e cobertura no ConfigStore.
  owner: platform
  tags:
  - infra
  - configuration
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: environment
    parent: null
    namespace: null
  operation: audit
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      required:
      - directory
      additionalProperties: false
      properties:
        directory:
          type: string
          description: 'Caminho do diretorio a escanear (ex: /path/to/platform-auth).'
        include_pattern:
          type: string
          default: .env*
          description: 'Glob para os arquivos. Default: .env*.'
        check_store:
          type: boolean
          default: true
          description: 'Verificar se os secrets ja estao no ConfigStore. Default:
            true.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:environment
