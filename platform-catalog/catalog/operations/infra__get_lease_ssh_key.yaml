apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/get_lease_ssh_key
  uid: infra.get_lease_ssh_key
  domain: infra
  title: get lease ssh key
  description: 'Retorna a chave privada Ed25519 (PEM) para conectar via SSH à VM do
    lease. Requer lease em status ACTIVE. owner deve ser o titular do lease. A chave
    é deletada quando o lease é liberado — salve localmente antes do release. Uso:
    salvar em arquivo com chmod 600 e usar com ssh -i key.pem ubuntu@<host>.'
  owner: platform
  tags:
  - infra
  - provisioning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: get
  authz: write
  risk:
    effects:
    - write
    requires:
    - terraform
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        lease_id:
          type: string
        owner:
          type: string
          description: Identificador do agente titular do lease (autenticação).
      required:
      - lease_id
      - owner
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:vm
