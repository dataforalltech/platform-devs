apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/refresh_context
  uid: platform.refresh_context
  domain: platform
  title: refresh context
  description: Recaptura contexto de ambiente (git branch, cwd) sem invalidar autenticação.
    Use após trocar de branch ou diretório.
  owner: platform
  tags:
  - platform
  - identity
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: refresh
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties: {}
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:token
