apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/get_credential
  uid: infra.get_credential
  domain: infra
  title: get credential
  description: 'Recupera um valor de credencial do store central. Namespaces convencionais:
    credentials.acr, credentials.github, credentials.portainer, credentials.internal.


    Use list_credentials para ver quais chaves estão disponíveis.'
  owner: platform
  tags:
  - infra
  - configuration
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: credential
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        namespace:
          type: string
          description: 'Namespace da credencial. Ex: ''credentials.acr'', ''credentials.github''.'
        key:
          type: string
          description: 'Nome da variável. Ex: ''ACR_USERNAME'', ''GITHUB_TOKEN''.'
      required:
      - namespace
      - key
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:credential
