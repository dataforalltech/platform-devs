apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_fastapi_router
  uid: development.generate_fastapi_router
  domain: development
  title: generate fastapi router
  description: Gera o scaffold de um APIRouter FastAPI determinístico a partir de
    resource+routes.
  owner: platform
  tags:
  - development
  - backend
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: backend
  resource:
    type: backend_artifact
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        resource:
          type: string
          description: Recurso/entidade do router (usado no prefix/tag).
        routes:
          type: array
          description: Rotas [{method,path,handler}]; path params viram args do handler.
        prefix:
          type: string
          description: Prefixo do router (default '/<resource>').
      required:
      - resource
      - routes
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:backend_artifact
