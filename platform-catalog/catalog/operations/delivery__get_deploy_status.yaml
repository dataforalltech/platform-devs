apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_deploy_status
  uid: delivery.get_deploy_status
  domain: delivery
  title: get deploy status
  description: Retorna os últimos runs de deploy para um serviço e ambiente. Mostra
    status (in_progress/completed), conclusion (success/failure) e URL de cada run.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: deployment
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
        environment:
          type: string
          enum:
          - dev
          - hml
          - prod
        repo:
          type: string
          description: Nome do repo (se diferente do service).
        limit:
          type: integer
          minimum: 1
          maximum: 20
          description: 'Máximo de runs. Default: 5.'
          default: 5
      required:
      - service
      - environment
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:deployment
