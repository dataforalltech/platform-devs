apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_uat_checklist
  uid: testing.generate_uat_checklist
  domain: testing
  title: generate uat checklist
  description: Gera um checklist UAT em markdown determinístico a partir dos critérios
    de aceite.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: checklist
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        acceptance_criteria:
          type: array
          description: Critérios [{id?,description?}] ou strings.
        feature:
          type: string
          description: Funcionalidade alvo (opcional).
      required:
      - acceptance_criteria
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:checklist
