apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/analyze_complexity
  uid: testing.analyze_complexity
  domain: testing
  title: analyze complexity
  description: Analisa complexidade ciclomática com radon (Python) ou grep simples
    (JS/TS). Identifica hotspots acima do threshold.
  owner: platform
  tags:
  - testing
  - quality
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: analyze
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        repo_path:
          type: string
        threshold:
          type: integer
          description: 'CC máximo antes de considerar complexo (default: complexity_threshold)'
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
