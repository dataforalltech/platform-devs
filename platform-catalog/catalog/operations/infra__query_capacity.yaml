apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/query_capacity
  uid: infra.query_capacity
  domain: infra
  title: query capacity
  description: 'Planejamento sem efeito: ''haveria slot para essa spec sem violar
    hard stops?'' Retorna can_satisfy_now + by_existing_vm/would_provision + blocked_by
    quando recusado.'
  owner: platform
  tags:
  - infra
  - provisioning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: provisioning
  resource:
    type: vm
    parent: null
    namespace: null
  operation: query
  authz: read
  risk:
    effects:
    - read
    requires:
    - terraform
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        spec:
          type: string
          enum:
          - cpu-small
          - cpu-medium
          - cpu-large
          - high-mem
          - gpu-a100
        owner:
          type: string
          description: Para checar quota por agente.
      required:
      - spec
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:vm
