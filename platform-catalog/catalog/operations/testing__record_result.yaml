apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/record_result
  uid: testing.record_result
  domain: testing
  title: record result
  description: Registra o resultado da execução de um cenário de teste.
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: test_plan
    parent: null
    namespace: null
  operation: record
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        plan_id:
          type: string
          description: ID do plano de teste
        scenario_id:
          type: integer
          description: ID numérico do cenário
        status:
          type: string
          enum:
          - passed
          - failed
          - blocked
          - skipped
        actual_result:
          type: string
          description: O que realmente aconteceu
        notes:
          type: string
          description: Observações adicionais
        evidence:
          type: string
          description: Link ou referência para evidência (screenshot, log, etc.)
      required:
      - plan_id
      - scenario_id
      - status
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test_plan
