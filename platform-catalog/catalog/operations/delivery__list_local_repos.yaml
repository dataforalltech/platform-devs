apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_local_repos
  uid: delivery.list_local_repos
  domain: delivery
  title: list local repos
  description: 'Lista repositorios clonados em REPOS_ROOT. Para cada repo com .git
    retorna: branch atual, remote origin, ultimo commit, dirty flag, latest tag. filter_name:
    filtra por substring no nome. include_git_info=false retorna apenas nomes (muito
    mais rapido para muitos repos).'
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        repos_root:
          type: string
          description: Caminho da pasta de repos (sobrepoe REPOS_ROOT configurado).
        filter_name:
          type: string
          description: Filtro substring case-insensitive no nome do repo.
        include_git_info:
          type: boolean
          default: true
          description: 'Coleta branch, remote, commits de cada repo. Default: true.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:repository
