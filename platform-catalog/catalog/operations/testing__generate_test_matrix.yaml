apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_test_matrix
  uid: testing.generate_test_matrix
  domain: testing
  title: generate test matrix
  description: 'Gera e executa matriz de testes: cada cenário × payload é um caso.
    Ideal para testar variações de input em endpoints.'
  owner: platform
  tags:
  - testing
  - quality
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        base_url:
          type: string
        scenarios:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              endpoint:
                type: string
              method:
                type: string
              payloads:
                type: array
                items:
                  type: object
              expected_statuses:
                type: array
                items:
                  type: integer
              expected_keys:
                type: array
                items:
                  type: array
                  items:
                    type: string
            required:
            - name
            - endpoint
      required:
      - base_url
      - scenarios
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:test
