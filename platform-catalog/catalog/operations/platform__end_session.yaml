apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/end_session
  uid: platform.end_session
  domain: platform
  title: end session
  description: Encerra sessão como completed. Falha se houver tarefas abertas. actor
    + rationale obrigatórios.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: end
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        actor:
          type: object
          additionalProperties: false
          description: Quem tomou a decisão (governança).
          properties:
            type:
              type: string
              enum:
              - human
              - agent
              - system
            id:
              type: string
              description: Email do humano, session_id do agente, ou nome do sistema.
          required:
          - type
          - id
        rationale:
          type: string
          description: Por que a sessão está sendo encerrada (obrigatório).
        final_summary:
          type: string
          description: Resumo final do que foi realizado na sessão
      required:
      - session_id
      - actor
      - rationale
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:session
