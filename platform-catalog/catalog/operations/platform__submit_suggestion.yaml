apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/submit_suggestion
  uid: platform.submit_suggestion
  domain: platform
  title: submit suggestion
  description: 'Cross-repo: source_repo propõe melhoria para target_repo. Entra na
    fila pending e aparece no resume_session do target_repo.'
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: submit
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        source_repo:
          type: string
          description: Repo que está sugerindo.
        target_repo:
          type: string
          description: Repo que vai receber/avaliar a sugestão.
        title:
          type: string
        description:
          type: string
        kind:
          type: string
          enum:
          - improvement
          - correction
          - addition
          - question
          - other
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        needs_human_decision:
          type: boolean
          description: Default true — sugestões cross-repo passam por decisão humana.
          default: true
        source_session_id:
          type: string
          description: Sessão originária (opcional, para auditoria).
      required:
      - source_repo
      - target_repo
      - title
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:suggestion
