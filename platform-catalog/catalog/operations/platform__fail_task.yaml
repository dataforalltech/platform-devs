apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/fail_task
  uid: platform.fail_task
  domain: platform
  title: fail task
  description: Marca uma tarefa como 'failed' registrando o motivo. actor obrigatório
    (governança); reason obrigatório.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: task
    parent: null
    namespace: null
  operation: fail
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: integer
        actor:
          type: object
          additionalProperties: false
          description: Quem tomou a decisão (governança).
          properties:
            type:
              type: string
              enum:
              - human
              - agent
              - system
            id:
              type: string
              description: Email do humano, session_id do agente, ou nome do sistema.
          required:
          - type
          - id
        reason:
          type: string
          description: Motivo da falha
      required:
      - task_id
      - actor
      - reason
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:task
