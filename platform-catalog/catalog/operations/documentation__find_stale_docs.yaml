apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/find_stale_docs
  uid: documentation.find_stale_docs
  domain: documentation
  title: find stale docs
  description: Detecta documentos não atualizados há mais de X dias. Usa `git log`
    para obter data do último commit; fallback para mtime.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: find
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
        days_threshold:
          type: integer
          description: 'Dias sem atualização para considerar stale (default: settings.stale_days_threshold)'
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
