apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/find_consumers_of
  uid: governance.find_consumers_of
  domain: governance
  title: find consumers of
  description: Lista quem consome o que o nó produz/provê. Resolve via contratos para
    serviços (provides_api/produces_event → consumes/consumes_event) e via uses_lib
    para libraries.
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: find
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        node_id:
          type: string
          description: id canônico do nó (service/contract/library)
      required:
      - node_id
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
