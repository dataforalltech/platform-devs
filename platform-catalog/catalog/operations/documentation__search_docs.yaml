apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/search_docs
  uid: documentation.search_docs
  domain: documentation
  title: search docs
  description: Busca full-text em todos os docs do repo_path. Retorna trechos (snippets)
    ao redor de cada match.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: search
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
        query:
          type: string
          description: Texto a buscar nos documentos
        case_sensitive:
          type: boolean
          description: Busca case-sensitive
          default: false
        file_types:
          type: array
          items:
            type: string
          description: 'Extensões a buscar (ex: [''md'', ''rst''])'
      required:
      - repo_path
      - query
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
