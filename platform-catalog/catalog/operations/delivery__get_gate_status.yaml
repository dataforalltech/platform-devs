apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_gate_status
  uid: delivery.get_gate_status
  domain: delivery
  title: get gate status
  description: 'Retorna o status de todos os gates para um serviço/ambiente. Indica
    quais gates são obrigatórios, quais passaram, falharam ou estão ausentes. Inclui
    campo can_promote: true/false.'
  owner: platform
  tags:
  - delivery
  - promotion
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: gate
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        env:
          type: string
          enum:
          - dev
          - homol
          - prod
          description: Ambiente a consultar.
      required:
      - service
      - env
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:gate
