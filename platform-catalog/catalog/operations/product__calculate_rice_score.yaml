apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: product/calculate_rice_score
  uid: product.calculate_rice_score
  domain: product
  title: calculate rice score
  description: Calcula o score RICE = (reach × impact × confidence) / effort de forma
    determinística.
  owner: platform
  tags:
  - product
  - product-ownership
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: product
  capability: product-ownership
  resource:
    type: product_artifact
    parent: null
    namespace: null
  operation: calculate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        reach:
          type: number
          description: Alcance (nº de pessoas/eventos por período).
        impact:
          type: number
          description: Impacto (peso por pessoa).
        confidence:
          type: number
          description: 'Confiança (ex.: 0-100 ou 0-1).'
        effort:
          type: number
          description: Esforço (person-months; deve ser > 0).
      required:
      - reach
      - impact
      - confidence
      - effort
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:product_artifact
