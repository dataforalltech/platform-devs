apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_gherkin_scenarios
  uid: testing.generate_gherkin_scenarios
  domain: testing
  title: generate gherkin scenarios
  description: Gera um arquivo .feature (Gherkin) determinístico a partir dos cenários
    da spec.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        feature:
          type: string
          description: Nome da funcionalidade.
        scenarios:
          type: array
          description: Cenários [{name,given?,when?,then?}] (given/when/then str ou
            lista).
        description:
          type: string
          description: Descrição da feature (opcional).
      required:
      - feature
      - scenarios
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
