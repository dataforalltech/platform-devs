apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/rotate_token
  uid: platform.rotate_token
  domain: platform
  title: rotate token
  description: Admin — Revoga o token atual e emite um novo para o mesmo usuário.
    Útil para rotação periódica de segurança. O novo token é exibido uma única vez.
  owner: platform
  tags:
  - platform
  - identity
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: identity
  resource:
    type: token
    parent: null
    namespace: null
  operation: rotate
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        admin_token:
          type: string
        identifier:
          type: string
          description: Token ou user_id a rotacionar.
      required:
      - admin_token
      - identifier
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:token
