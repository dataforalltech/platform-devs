apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/promote_service
  uid: delivery.promote_service
  domain: delivery
  title: promote service
  description: 'Promove um serviço entre ambientes (dev→homol ou homol→prod). Verifica
    todos os gates obrigatórios antes de promover. DEV→HML e HML→PROD: cria PR via
    GitHub e aguarda aprovação humana (status=waiting_approval). Após aprovação humana,
    chame approve_promotion(promotion_id). Retorna can_promote=false com lista de
    gates pendentes se houver falhas.'
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: service
    parent: null
    namespace: null
  operation: promote
  authz: write
  risk:
    effects:
    - deploy
    requires:
    - github
    blast_radius: environment
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço.
        from_env:
          type: string
          enum:
          - dev
          - homol
          description: Ambiente de origem.
        to_env:
          type: string
          enum:
          - homol
          - prod
          description: Ambiente de destino.
        promoted_by:
          type: string
          description: Identificador de quem solicitou a promoção (usuário ou agente).
        reason:
          type: string
          description: Motivo da promoção (opcional).
      required:
      - service
      - from_env
      - to_env
      - promoted_by
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: none
relations:
- verb: acts-on
  target: resource:service
