apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/generate_doc_report
  uid: documentation.generate_doc_report
  domain: documentation
  title: generate doc report
  description: Relatório de qualidade documental com score, grade, trend e action
    items. Executa audit_repo se não houver histórico.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: repository
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:repository
