apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/run_type_check
  uid: testing.run_type_check
  domain: testing
  title: run type check
  description: Type checking com mypy (Python) ou tsc (TypeScript). Retorna erros
    e warnings por arquivo.
  owner: platform
  tags:
  - testing
  - quality
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: run
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        repo_path:
          type: string
        framework:
          type: string
          enum:
          - auto
          - python
          - javascript
          - typescript
          default: auto
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: true
      streaming: false
      timeout_s: 900
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
