apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/get_promotion_history
  uid: delivery.get_promotion_history
  domain: delivery
  title: get promotion history
  description: Retorna o histórico de promoções. Se service for fornecido, filtra
    pelo serviço. Retorna até limit registros ordenados por data decrescente.
  owner: platform
  tags:
  - delivery
  - promotion
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pull_request
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome do serviço (opcional, para filtrar).
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
          description: 'Número máximo de registros. Default: 20.'
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:pull_request
