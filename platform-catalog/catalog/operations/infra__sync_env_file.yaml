apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/sync_env_file
  uid: infra.sync_env_file
  domain: infra
  title: sync env file
  description: Gera ou atualiza um arquivo .env com as variáveis do store para um
    ambiente. Com merge=true (padrão), mantém variáveis locais que não estão no store.
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: environment
    parent: null
    namespace: null
  operation: sync
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        target_path:
          type: string
          description: 'Caminho do arquivo .env. Ex: ''/path/to/repo/.env.dev''.'
        environment:
          type: string
          description: 'Perfil cujas variáveis serão escritas. Ex: ''dev''.'
        merge:
          type: boolean
          description: 'Manter variáveis locais não presentes no store. Default: true.'
          default: true
      required:
      - target_path
      - environment
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:environment
