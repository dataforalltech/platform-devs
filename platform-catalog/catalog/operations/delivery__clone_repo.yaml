apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/clone_repo
  uid: delivery.clone_repo
  domain: delivery
  title: clone repo
  description: 'Clona um repositorio do GitHub para REPOS_ROOT/<repo>. repo: nome
    simples (''platform-auth'') ou ''owner/repo''. Usa o GITHUB_TOKEN configurado
    (sem expor o token no remote URL retornado). depth: shallow clone para repos grandes.'
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: repository
    parent: null
    namespace: null
  operation: clone
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      required:
      - repo
      additionalProperties: false
      properties:
        repo:
          type: string
          description: Nome do repo ('platform-auth') ou 'owner/repo'.
        branch:
          type: string
          description: 'Branch/tag/SHA a clonar. Default: branch padrao do repo.'
        repos_root:
          type: string
          description: Pasta destino (sobrepoe REPOS_ROOT configurado).
        target_dir:
          type: string
          description: 'Nome do diretorio destino. Default: nome do repo.'
        depth:
          type: integer
          minimum: 1
          description: 'Shallow clone --depth N. Default: clone completo.'
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:repository
