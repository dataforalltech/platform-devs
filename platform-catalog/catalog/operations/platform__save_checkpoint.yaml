apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/save_checkpoint
  uid: platform.save_checkpoint
  domain: platform
  title: save checkpoint
  description: Salva snapshot do progresso. Use ao concluir etapas ou antes do contexto
    esgotar. context aceita JSON com estado de retomada.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: session
    parent: null
    namespace: null
  operation: save
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: 'ID da sessão (ex: sess_abc123)'
        summary:
          type: string
          description: Resumo do estado atual — o que foi feito e o que falta
        context:
          type: object
          description: Contexto estruturado opcional (arquivos pendentes, decisões,
            próximos passos)
      required:
      - session_id
      - summary
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:session
