apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/generate_unit_tests
  uid: testing.generate_unit_tests
  domain: testing
  title: generate unit tests
  description: Gera um esqueleto de testes unitários determinístico (pytest|jest)
    para o alvo.
  owner: platform
  tags:
  - testing
  - test-authoring
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-authoring
  resource:
    type: test
    parent: null
    namespace: null
  operation: generate
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        framework:
          type: string
          description: 'Framework: pytest|jest.'
        target:
          type: string
          description: Alvo/módulo sob teste.
        cases:
          type: array
          description: Casos [{name,description?}] (opcional; usa placeholder).
      required:
      - framework
      - target
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
