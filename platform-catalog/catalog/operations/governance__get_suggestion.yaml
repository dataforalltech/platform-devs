apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/get_suggestion
  uid: governance.get_suggestion
  domain: governance
  title: get suggestion
  description: Devolve o payload completo de uma sugestão pelo id.
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: get
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        suggestion_id:
          type: string
          description: 'Formato: YYYYMMDDTHHMMSS-XXXXXXXX'
      required:
      - suggestion_id
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:suggestion
