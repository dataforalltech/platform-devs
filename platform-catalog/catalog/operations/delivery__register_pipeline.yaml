apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/register_pipeline
  uid: delivery.register_pipeline
  domain: delivery
  title: register pipeline
  description: Registra um serviço no pipeline. Se o serviço já existir, atualiza
    repo e base_branch. Retorna action=created ou action=updated.
  owner: platform
  tags:
  - delivery
  - promotion
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: promotion
  resource:
    type: pipeline
    parent: null
    namespace: null
  operation: register
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        service:
          type: string
          description: Nome único do serviço.
        repo:
          type: string
          description: 'Nome do repositório (ex: org/repo-name).'
        base_branch:
          type: string
          description: 'Branch base de desenvolvimento. Default: develop.'
          default: develop
      required:
      - service
      - repo
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:pipeline
