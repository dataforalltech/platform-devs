apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/check_accessibility
  uid: testing.check_accessibility
  domain: testing
  title: check accessibility
  description: Verifica acessibilidade via Playwright + axe-core. Suporta WCAG2A,
    WCAG2AA, WCAG2AAA. Retorna violations, passes e incomplete.
  owner: platform
  tags:
  - testing
  - quality
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: quality
  resource:
    type: test
    parent: null
    namespace: null
  operation: check
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          description: URL da página a verificar
        standard:
          type: string
          enum:
          - WCAG2A
          - WCAG2AA
          - WCAG2AAA
          default: WCAG2AA
      required:
      - url
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
