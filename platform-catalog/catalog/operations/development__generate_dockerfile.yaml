apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: development/generate_dockerfile
  uid: development.generate_dockerfile
  domain: development
  title: generate dockerfile
  description: Gera um Dockerfile (multi-stage quando faz sentido) determinístico
    a partir da spec.
  owner: platform
  tags:
  - development
  - devops
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: development
  capability: devops
  resource:
    type: document
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires:
    - docker
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          description: 'Linguagem: python|node|go|java.'
        framework:
          type: string
          description: Framework (opcional).
        app_dir:
          type: string
          description: Diretório da aplicação (default '.').
        port:
          type: integer
          description: Porta exposta (opcional).
        package_manager:
          type: string
          description: Gerenciador de pacotes (opcional).
        version:
          type: string
          description: Versão do runtime base (opcional).
        extra_system_deps:
          type: array
          description: Pacotes de sistema extras (opcional).
      required:
      - language
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:document
