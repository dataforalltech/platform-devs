apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/submit_audit_approval
  uid: governance.submit_audit_approval
  domain: governance
  title: submit audit approval
  description: Submete aprovação ou rejeição manual de uma auditoria
  owner: platform
  tags:
  - governance
  - audit
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: audit
  resource:
    type: audit
    parent: null
    namespace: null
  operation: submit
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        audit_id:
          type: string
          description: ID da auditoria (audit_...)
        approved_by:
          type: string
          description: Identificador de quem aprova
        decision:
          type: string
          description: 'Decisão: approved ou rejected'
          enum:
          - approved
          - rejected
        role:
          type: string
          description: Role do aprovador (developer, lead, architect)
        notes:
          type: string
          description: Notas da aprovação
      required:
      - audit_id
      - approved_by
      - decision
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:audit
