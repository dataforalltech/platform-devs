apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/create_branch
  uid: delivery.create_branch
  domain: delivery
  title: create branch
  description: Cria uma branch em um repositório a partir de um ref (branch, tag ou
    SHA). Use antes de commit_files para ter uma branch de trabalho.
  owner: platform
  tags:
  - delivery
  - deployment
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: branch
    parent: null
    namespace: null
  operation: create
  authz: write
  risk:
    effects:
    - write
    requires:
    - github
    - acr
    blast_radius: service
    default_level: high
    approval_required: N2
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
          description: Nome do repo (owner/name ou só name).
        branch:
          type: string
          description: Nome da nova branch.
        from_ref:
          type: string
          description: 'Branch/tag/SHA base. Default: develop.'
          default: develop
      required:
      - repo
      - branch
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:branch
