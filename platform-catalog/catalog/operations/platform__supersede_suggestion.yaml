apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: platform/supersede_suggestion
  uid: platform.supersede_suggestion
  domain: platform
  title: supersede suggestion
  description: Marca uma sugestão como superseded. actor obrigatório, by_suggestion_id
    opcional.
  owner: platform
  tags:
  - platform
  - session
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: platform
  capability: session
  resource:
    type: suggestion
    parent: null
    namespace: null
  operation: supersede
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        suggestion_id:
          type: integer
        actor:
          type: object
          additionalProperties: false
          description: Quem tomou a decisão (governança).
          properties:
            type:
              type: string
              enum:
              - human
              - agent
              - system
            id:
              type: string
              description: Email do humano, session_id do agente, ou nome do sistema.
          required:
          - type
          - id
        by_suggestion_id:
          type: integer
        reason:
          type: string
      required:
      - suggestion_id
      - actor
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:suggestion
