apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/set_credential_secure
  uid: infra.set_credential_secure
  domain: infra
  title: set credential secure
  description: Define uma credencial via input seguro no terminal (getpass). O valor
    nunca trafega pelo canal MCP — digitado diretamente no TTY do config-mcp. Use
    para senhas e tokens altamente sensíveis.
  owner: platform
  tags:
  - infra
  - configuration
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: configuration
  resource:
    type: credential
    parent: null
    namespace: null
  operation: set
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        namespace:
          type: string
          description: 'Ex: ''credentials.e2e'', ''credentials.acr'', ''credentials.github''.'
        key:
          type: string
          description: 'Nome da variável sensível. Ex: ''E2E_USER_PASSWORD'', ''ACR_PASSWORD''.'
      required:
      - namespace
      - key
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:credential
