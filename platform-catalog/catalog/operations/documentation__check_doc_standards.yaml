apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: documentation/check_doc_standards
  uid: documentation.check_doc_standards
  domain: documentation
  title: check doc standards
  description: Verifica padrões documentais (completeness, validity, quality). Retorna
    score 0-100 e grade A-F.
  owner: platform
  tags:
  - documentation
  - docs
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: documentation
  capability: docs
  resource:
    type: document
    parent: null
    namespace: null
  operation: check
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo_path:
          type: string
          description: Caminho absoluto do repositório
        standard:
          type: string
          enum:
          - minimal
          - standard
          - full
          - service
          description: Nível de exigência documental
          default: standard
      required:
      - repo_path
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:document
