apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/get_test_plan
  uid: testing.get_test_plan
  domain: testing
  title: get test plan
  description: Retorna um plano de teste com métricas de cobertura, resultados e findings.
  owner: platform
  tags:
  - testing
  - test-planning
  - read
  lifecycle: stable
  version: 1.0.0
spec:
