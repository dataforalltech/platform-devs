        include_scenarios:
          type: boolean
          description: Incluir lista completa de cenários no retorno
      required:
      - plan_id
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:test
