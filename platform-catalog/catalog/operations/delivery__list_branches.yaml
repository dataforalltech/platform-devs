apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: delivery/list_branches
  uid: delivery.list_branches
  domain: delivery
  title: list branches
  description: Lista branches de um repositório com nome, SHA e status de proteção.
  owner: platform
  tags:
  - delivery
  - deployment
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: delivery
  capability: deployment
  resource:
    type: branch
    parent: null
    namespace: null
  operation: list
  authz: read
  risk:
    effects:
    - read
    requires:
    - github
    - acr
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        repo:
          type: string
        filter_name:
          type: string
          description: 'Filtro substring (ex: ''feature/'', ''release/'').'
      required:
      - repo
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:branch
