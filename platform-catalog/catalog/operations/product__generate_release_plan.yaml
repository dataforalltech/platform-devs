apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: product/generate_release_plan
  uid: product.generate_release_plan
  domain: product
  title: generate release plan
  description: Gera um plano de release em Markdown determinístico a partir de versão/escopo/milestones.
  owner: platform
  tags:
  - product
  - product-management
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: product
  capability: product-management
  resource:
    type: vm
    parent: null
    namespace: null
  operation: generate
  authz: write
  risk:
    effects:
    - generate
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: 'Versão do release (ex.: ''2.1.0'').'
        scope:
          type: array
          description: Itens de escopo do release (opcional).
        milestones:
          type: array
          description: Marcos [{name,date?,items?}] ou strings (opcional).
      required:
      - version
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:vm
