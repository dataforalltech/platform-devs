apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: testing/create_checklist
  uid: testing.create_checklist
  domain: testing
  title: create checklist
  description: 'Cria um checklist de verificação a partir de template ou com itens
    customizados. Templates: pre_deploy, post_deploy, code_review, security, accessibility,
    data_integrity.'
  owner: platform
  tags:
  - testing
  - test-planning
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: testing
  capability: test-planning
  resource:
    type: checklist
    parent: null
    namespace: null
  operation: create
  authz: write
  risk:
    effects:
    - write
    requires: []
    blast_radius: service
    default_level: medium
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        title:
          type: string
          description: Título do checklist
        checklist_type:
          type: string
          enum:
          - pre_deploy
          - post_deploy
          - code_review
          - security
          - accessibility
          - data_integrity
          - custom
        plan_id:
          type: string
          description: Associar ao plano de teste (opcional)
        use_template:
          type: boolean
          description: Usar template padrão para o tipo informado (default true)
        items:
          type: array
          description: Itens customizados (obrigatório quando use_template=false ou
            type='custom')
          items:
            type: object
            properties:
              description:
                type: string
              required:
                type: boolean
              category:
                type: string
            required:
            - description
      required:
      - title
      - checklist_type
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: false
      side_effects: true
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: none
relations:
- verb: acts-on
  target: resource:checklist
