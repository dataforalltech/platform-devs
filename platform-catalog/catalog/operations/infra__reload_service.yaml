apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: infra/reload_service
  uid: infra.reload_service
  domain: infra
  title: reload service
  description: 'Recarrega/reiniciaum servico registrado. Estrategiaautomaticapor tipo:
    docker â†’ `docker restart <name>` | process â†’ mataprocesso naporta(esperareinicio
    pelo process manager) | remote â†’ POST em /reload ou /actuator/restart | unknown
    â†’ re-verificahealth. Aguardawait_seconds e faz health check automatico apos
    o reload.'
  owner: platform
  tags:
  - infra
  - service-registry
  - write
  lifecycle: stable
  version: 1.0.0
spec:
  domain: infra
  capability: service-registry
  resource:
    type: service
    parent: null
    namespace: null
  operation: reload
  authz: write
  risk:
