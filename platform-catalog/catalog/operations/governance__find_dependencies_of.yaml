apiVersion: catalog.platform.dev/v1
kind: Operation
metadata:
  name: governance/find_dependencies_of
  uid: governance.find_dependencies_of
  domain: governance
  title: find dependencies of
  description: Lista dependências do nó. Por padrão, apenas diretas (include_transitive=false).
  owner: platform
  tags:
  - governance
  - ai-governance
  - read
  lifecycle: stable
  version: 1.0.0
spec:
  domain: governance
  capability: ai-governance
  resource:
    type: policy
    parent: null
    namespace: null
  operation: find
  authz: read
  risk:
    effects:
    - read
    requires: []
    blast_radius: none
    default_level: low
    approval_required: none
  contract:
    inputs:
      type: object
      properties:
        node_id:
          type: string
        include_transitive:
          type: boolean
          default: false
          description: Se true, inclui dependências transitivas (max_depth até 5).
        max_depth:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
          description: Profundidade máxima (só relevante com include_transitive=true).
      required:
      - node_id
      additionalProperties: false
    outputs: {}
    preconditions: []
    postconditions: []
    execution:
      idempotent: true
      side_effects: false
      is_async: false
      streaming: false
      timeout_s: 60
      retry_policy: read-only
relations:
- verb: acts-on
  target: resource:policy
