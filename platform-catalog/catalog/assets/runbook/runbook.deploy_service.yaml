apiVersion: catalog.platform.dev/v1
kind: Runbook
metadata:
  name: runbook.deploy_service
  uid: runbook.deploy_service
  title: Deploy a service (pre-check -> tests -> deploy -> verify)
  owner: platform
  tags:
  - runbook
  - devops
  lifecycle: active
  version: 1.0.0
spec:
  runbook_id: deploy_service
  description: Deploy a service (pre-check -> tests -> deploy -> verify)
  responsible_profile: devops
  tasks:
  - task_id: check_health
    operation_id: infra.check_health
    tool: services-mcp.check_health
    responsible: devops
    required: true
    depends_on: []
    resolved: true
  - task_id: run_tests
    operation_id: testing.run_unit_tests
    tool: qa-mcp.run_unit_tests
    responsible: qa-engineer
    required: true
    depends_on:
    - check_health
    resolved: true
  - task_id: deploy
    operation_id: delivery.deploy
    tool: deploy-mcp.deploy
    responsible: devops
    required: true
    depends_on:
    - run_tests
    resolved: true
  - task_id: verify
    operation_id: infra.check_health
    tool: services-mcp.check_health
    responsible: devops
    required: false
    depends_on:
    - deploy
    resolved: true
  unresolved_tools: 0
relations:
- verb: uses
  target: infra.check_health
- verb: uses
  target: testing.run_unit_tests
- verb: uses
  target: delivery.deploy
- verb: uses
  target: infra.check_health
