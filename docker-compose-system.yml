version: '3.9'

# Build context is the REPO ROOT for every server: the per-server Dockerfiles
# COPY <name>-mcp-server/... and shared/ relative to the repo root. Each service
# builds and runs the REAL Streamable-HTTP MCP server (src.server.mcp_server via
# its Dockerfile CMD/console-script). The server reads MCP_PORT.
#
# The old <name>_mcp.py FastAPI shims (broken: SyntaxError line 35) were removed.
# The former legacy services auth/admin/governance/scheduler/connectors/cache were
# dropped from this compose: admin & governance are owned by separate repos
# (platform-admin / platform-governance, running as platform-*-mcp sidecars); the
# platform OAuth AS is served from auth-mcp-server/Dockerfile.as via docker-compose.pilot.yml;
# cache is infra (dataforall-redis); scheduler/connectors had no real server.

services:
  config-mcp:
    build:
      context: .
      dockerfile: config-mcp-server/Dockerfile
    ports:
      - "7100:7100"
    environment:
      MCP_PORT: "7100"
    networks:
      - mcp-network
    restart: unless-stopped

  session-mcp:
    build:
      context: .
      dockerfile: session-mcp-server/Dockerfile
    ports:
      - "7102:7102"
    environment:
      MCP_PORT: "7102"
    networks:
      - mcp-network
    restart: unless-stopped

  audit-mcp:
    build:
      context: .
      dockerfile: audit-mcp-server/Dockerfile
    ports:
      - "7105:7105"
    environment:
      MCP_PORT: "7105"
    networks:
      - mcp-network
    restart: unless-stopped

  infra-mcp:
    build:
      context: .
      dockerfile: infra-mcp-server/Dockerfile
    ports:
      - "7106:7106"
    environment:
      MCP_PORT: "7106"
    networks:
      - mcp-network
    restart: unless-stopped

  services-mcp:
    build:
      context: .
      dockerfile: services-mcp-server/Dockerfile
    ports:
      - "7107:7107"
    environment:
      MCP_PORT: "7107"
    networks:
      - mcp-network
    restart: unless-stopped

  pipeline-mcp:
    build:
      context: .
      dockerfile: pipeline-mcp-server/Dockerfile
    ports:
      - "7108:7108"
    environment:
      MCP_PORT: "7108"
    networks:
      - mcp-network
    restart: unless-stopped

  qa-mcp:
    build:
      context: .
      dockerfile: qa-mcp-server/Dockerfile
    ports:
      - "7109:7109"
    environment:
      MCP_PORT: "7109"
    networks:
      - mcp-network
    restart: unless-stopped

  deploy-mcp:
    build:
      context: .
      dockerfile: deploy-mcp-server/Dockerfile
    ports:
      - "7110:7110"
    environment:
      MCP_PORT: "7110"
    networks:
      - mcp-network
    restart: unless-stopped

  docs-mcp:
    build:
      context: .
      dockerfile: docs-mcp-server/Dockerfile
    ports:
      - "7111:7111"
    environment:
      MCP_PORT: "7111"
    networks:
      - mcp-network
    restart: unless-stopped

  ai-governance-mcp:
    build:
      context: .
      dockerfile: ai-governance-mcp-server/Dockerfile
    ports:
      - "7112:7112"
    environment:
      MCP_PORT: "7112"
    networks:
      - mcp-network
    restart: unless-stopped

  # Registry helper (real tooling at repo root, unchanged).
  mcp-registry:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./mcp-registry.py:/app/mcp-registry.py
    command: bash -c "pip install -q fastapi uvicorn aiohttp && python mcp-registry.py"
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    networks:
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge
