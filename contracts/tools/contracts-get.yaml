schema_version: 1
provider_id: contracts-mcp
name: contracts_get
description: Read one canonical governed tool contract.
status: active
input_schema:
  type: object
  additionalProperties: false
  properties:
    provider_id: {type: string, minLength: 1}
    name: {type: string, minLength: 1}
  required: [provider_id, name]
output_schema:
  type: object
  additionalProperties: false
  properties:
    found: {type: boolean}
    contract:
      anyOf:
        - type: object
          additionalProperties: false
          properties:
            provider_id: {type: string}
            name: {type: string}
            description: {type: string}
            status: {type: string, enum: [active, disabled]}
            required_scope: {type: string}
            mutating: {type: boolean}
            risk: {type: object}
            secret_reference_only: {type: boolean}
            input_schema: {type: object}
            output_schema: {type: object}
          required: [provider_id, name, description, status, required_scope, mutating, risk, secret_reference_only, input_schema, output_schema]
        - type: 'null'
  required: [found, contract]
required_scope: contracts:read
mutating: false
risk: {level: low, effects: [read], blast_radius: none, approval_required: none}
secret_reference_only: true
