schema_version: 1
provider_id: project-product-mcp
name: project_list
description: List active tenant projects, optionally filtered by product or status.
status: active
input_schema:
  type: object
  additionalProperties: false
  properties:
    product_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
    status:
      type: string
      enum:
      - planned
      - active
      - paused
      - completed
      - archived
    after_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
    limit:
      type: integer
      minimum: 1
      maximum: 100
      default: 50
output_schema:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          project_id:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
          product_id:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
          slug:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          name:
            type: string
            minLength: 1
            maxLength: 200
          description:
            anyOf:
            - type: string
              maxLength: 4000
            - type: 'null'
          status:
            type: string
            enum:
            - planned
            - active
            - paused
            - completed
            - archived
          owner_user_refs:
            type: array
            maxItems: 100
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 512
          service_refs:
            type: object
            additionalProperties: false
            properties:
              governance_ref:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 512
                - type: 'null'
              schedule_ref:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 512
                - type: 'null'
              communication_ref:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 512
                - type: 'null'
              notification_ref:
                anyOf:
                - type: string
                  minLength: 1
                  maxLength: 512
                - type: 'null'
          version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          created_by_ref:
            type: string
            minLength: 1
            maxLength: 512
          updated_by_ref:
            type: string
            minLength: 1
            maxLength: 512
        required:
        - project_id
        - product_id
        - slug
        - name
        - description
        - status
        - owner_user_refs
        - service_refs
        - version
        - created_at
        - updated_at
        - created_by_ref
        - updated_by_ref
    next_after_id:
      anyOf:
      - type: string
        format: uuid
        minLength: 36
        maxLength: 36
      - type: 'null'
  required:
  - items
  - next_after_id
required_scope: portfolio:project:read
mutating: false
risk:
  level: low
  effects:
  - read
  blast_radius: none
  approval_required: none
secret_reference_only: true
