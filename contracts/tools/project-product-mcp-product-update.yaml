schema_version: 1
provider_id: project-product-mcp
name: product_update
description: Update a product with idempotency and optimistic concurrency.
status: active
input_schema:
  type: object
  additionalProperties: false
  properties:
    idempotency_key:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]+$
    product_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
    expected_version:
      type: integer
      minimum: 1
    changes:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
        status:
          type: string
          enum:
          - planned
          - active
          - paused
          - retired
        owner_user_refs:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
  required:
  - idempotency_key
  - product_id
  - expected_version
  - changes
output_schema:
  type: object
  additionalProperties: false
  properties:
    product_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
    slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    name:
      type: string
      minLength: 1
      maxLength: 200
    description:
      anyOf:
      - type: string
        maxLength: 4000
      - type: 'null'
    status:
      type: string
      enum:
      - planned
      - active
      - paused
      - retired
    owner_user_refs:
      type: array
      maxItems: 100
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 512
    version:
      type: integer
      minimum: 1
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    created_by_ref:
      type: string
      minLength: 1
      maxLength: 512
    updated_by_ref:
      type: string
      minLength: 1
      maxLength: 512
  required:
  - product_id
  - slug
  - name
  - description
  - status
  - owner_user_refs
  - version
  - created_at
  - updated_at
  - created_by_ref
  - updated_by_ref
required_scope: portfolio:product:write
mutating: true
risk:
  level: medium
  effects:
  - write
  blast_radius: tenant
  approval_required: none
secret_reference_only: true
