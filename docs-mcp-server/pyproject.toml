[project]
name = "docs-mcp"
version = "0.1.0"
description = "MCP sidecar (kind=mcp_http, Model C) do docs — padrões, validação e auditoria de documentação, gateway-ready."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dataforalltech platform team" }]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # requerido pelo fastapi.testclient
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24.0",
]

[project.scripts]
docs-mcp = "src.server.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"src.knowledge" = ["templates/*.md"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S104 (bind 0.0.0.0): justificado no código (ingress só via gateway, INV-1).
ignore = ["S104", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]        # assert em testes
# git log p/ mtime — binário confiável; path parcial ('git') é intencional/portável.
"src/tools/audit_tool.py" = ["S603", "S607"]
# md5 é hash de CONTEÚDO (dedupe/índice), não uso criptográfico/segurança.
"src/tools/scan_tool.py" = ["S324"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/**/__init__.py"]
