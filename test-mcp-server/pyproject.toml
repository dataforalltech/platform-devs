[project]
name = "test-mcp"
version = "0.1.0"
description = "MCP sidecar (kind=mcp_http, Model C) do test — engenharia de cenários/validação com backend PostgreSQL, gateway-ready."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dataforalltech platform team" }]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "psycopg2-binary>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # o low-level Server é async (testes herméticos)
    "httpx>=0.27",           # requerido pelo fastapi.testclient
    "ruff==0.15.12",
    "mypy==2.2.0",
    "black>=24.0",
]

[project.scripts]
test-mcp = "src.server.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# Desvios justificados p/ um sidecar backend-backed (test persiste em PostgreSQL):
#   E501 — black (line-length 110) é a autoridade de formatação; as linhas longas
#          remanescentes são strings de template i18n (checklists/cenários) e banners
#          de comentário que o black não quebra. Não desabilita a checagem no black.
#   S104 — bind 0.0.0.0: ingress só via gateway (INV-1), justificado no código.
#   S608 — SQL "dinâmico" só concatena fragmentos estáticos; valores via %s (parametrizado).
ignore = ["E501", "S104", "S608"]

[tool.ruff.lint.per-file-ignores]
# S101 assert em testes; S105/S106 tokens/senhas fake em test doubles (sem I/O real).
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/**/__init__.py"]
