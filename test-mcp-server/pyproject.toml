[project]
name = "test-mcp"
version = "0.1.0"
description = "MCP sidecar (kind=mcp_http, Model C) do test — engenharia de cenários/validação sobre o ORM canônico (dual-db, tenant-scoped), gateway-ready."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dataforalltech platform team" }]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    # ORM canônico (dual-db) + resolução credencial-zero do tenant (privadas, git+https).
    # O build (Dockerfile) autentica via --mount=type=secret,id=github_token (padrão K10).
    "aiomysql>=0.2",
    "platform-database-lib @ git+https://github.com/dataforalltech/platform-database-lib.git@v1.1.0",
    "platform-tenant-lib @ git+https://github.com/dataforalltech/platform-tenant-lib.git@v0.2.1",
    "platform-core-lib @ git+https://github.com/dataforalltech/platform-core-lib.git@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # suíte async (Repository/pool são async)
    "httpx>=0.27",           # requerido pelo fastapi.testclient
    "aiomysql>=0.2",         # suíte canônica: MySQL real, banco nunca mockado
    "ruff==0.15.12",
    "mypy==2.2.0",
    "black>=24.0",
]

[project.scripts]
test-mcp = "src.server.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# Desvios justificados p/ um sidecar backend-backed (test persiste via ORM canônico):
#   E501 — black (line-length 110) é a autoridade de formatação; as linhas longas
#          remanescentes são strings de template i18n (checklists/cenários) e banners
#          de comentário que o black não quebra. Não desabilita a checagem no black.
#   S104 — bind 0.0.0.0: ingress só via gateway (INV-1), justificado no código.
ignore = ["E501", "S104"]

[tool.ruff.lint.per-file-ignores]
# S101 assert em testes; S105/S106 tokens/senhas fake em test doubles (sem I/O real).
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercita MySQL real (banco nunca mockado — PA-01/FID-02); pula se indisponível",
]

[tool.coverage.run]
omit = ["src/**/__init__.py"]
